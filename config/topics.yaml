# 데일리 지식 봇 설정
# - 매일 아래 topics 중 하나를 무작위로 골라, 그 주제의 개념 하나를 공부 노트로 보냅니다.
# - 주제를 늘리려면 topics에 항목을 하나 더 추가하면 됩니다.
# - concepts는 "아직 안 배운 것"부터 차례로 무작위 선택됩니다. 다 배우면 Claude가 새 개념을 고르거나
#   (API 키가 있을 때) 가장 오래전에 배운 개념부터 복습합니다.

settings:
  timezone: Asia/Seoul
  avoid_recent_days: 3        # 최근 N일 안에 보낸 주제는 다시 고르지 않음(모든 주제가 막히면 무시)
  retention_days: 365         # 기록 보관 기간
  audience: "배터리와 AI를 함께 공부하는 대학원·연구자 수준 독자"
  quiz_as_poll: true          # 퀴즈를 텔레그램 퀴즈 투표로 보냄(길이 제한을 넘으면 본문의 스포일러로 대체)

telegram:
  bot_token_env: TELEGRAM_BOT_TOKEN
  chat_id_env: TELEGRAM_CHAT_ID

topics:
