name: Daily knowledge

on:
  schedule:
    # 목표: 매일 05:00 KST 발송. GitHub 예약 실행은 1~2시간씩 늦게 시작하는 일이 잦아서
    # 02:07, 03:07, 04:07 KST(=UTC 17:07, 18:07, 19:07)에 미리 시작해 05:00까지 기다렸다 보낸다.
    # 하루 한 번만 보내므로 먼저 도착한 실행만 발송하고 나머지는 건너뛴다.
    - cron: "7 17 * * *"
    - cron: "7 18 * * *"
    - cron: "7 19 * * *"
  workflow_dispatch:
    inputs:
      topic:
        description: "주제(비우면 무작위). 예 - 계면, 분석법, LLM, ai-ontology"
        required: false
        default: ""
      force:
        description: "오늘 이미 보냈어도 다시 보내기"
        type: boolean
        default: false
      dry_run:
        description: "미리보기: 켜면 텔레그램으로 보내지 않고 로그에만 출력"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  wait:
    # 예약 실행이 05:00 KST보다 일찍 시작하면 05:00까지 기다린다(수동 실행은 바로 보냄).
    # 공개 저장소라 대기 시간에 Actions 사용 요금이 들지 않는다.
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Wait until 05:00 KST
        if: ${{ github.event_name == 'schedule' }}
        run: |
          now=$(date +%s)
          target=$(TZ=Asia/Seoul date -d "$(TZ=Asia/Seoul date +%F) 05:00" +%s)
          wait=$(( target - now ))
          echo "지금 $(TZ=Asia/Seoul date '+%F %H:%M') KST"
          if [ "$wait" -gt 0 ] && [ "$wait" -lt 14400 ]; then
            echo "05:00 KST까지 ${wait}초 기다립니다."
            sleep "$wait"
          else
            echo "이미 05:00 KST가 지났습니다. 바로 보냅니다."
          fi

  send:
    needs: wait
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: knowledge-bot-data   # 명령 폴링과 같은 그룹: data/history.json 동시 수정 방지
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}   # 기다리는 동안 다른 실행이 남긴 최신 기록을 받아 중복 발송 방지
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Send today's lesson
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
          INPUT_TOPIC: ${{ github.event.inputs.topic }}
          INPUT_FORCE: ${{ github.event.inputs.force }}
          INPUT_DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          args=(send)
          if [ -n "${INPUT_TOPIC}" ]; then args+=(--topic "${INPUT_TOPIC}"); fi
          if [ "${INPUT_FORCE}" = "true" ]; then args+=(--force); fi
          if [ "${INPUT_DRY_RUN}" = "true" ]; then args+=(--dry-run); fi
          python -m knowledge_bot "${args[@]}"
      - name: Commit history
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          scripts/commit-data.sh "chore: 오늘의 공부 노트 기록"
