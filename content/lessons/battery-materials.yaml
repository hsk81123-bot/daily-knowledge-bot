# 배터리 › 소재 공부 노트 (concept 이름은 config/topics.yaml과 정확히 같아야 합니다)

- concept: "층상 양극재 NCM의 구조와 니켈 함량"
  title: "NCM 양극재: 니켈을 늘리면 용량은 오르고 안정성은 내려간다"
  level: 중급
  one_liner: >-
    NCM은 LiCoO₂와 같은 층상 구조에서 코발트 자리를 Ni·Co·Mn이 나눠 맡은 양극재로, 니켈 비율이 용량과 안정성의 균형을 결정한다.
  sections:
    - heading: "구조"
      body: >-
        NCM(LiNiₓCoᵧMn_zO₂, x+y+z=1)은 α-NaFeO₂형 층상 구조(R-3m)를 가진다. 산소가 입방 최밀 충전을 이루고,
        그 사이 팔면체 자리에 전이금속 층과 리튬 층이 번갈아 쌓인다. 충전하면 리튬이 층 사이에서 빠져나가고,
        방전하면 다시 들어간다. 이름의 숫자(NCM111, 523, 622, 811)는 Ni:Co:Mn 비율을 뜻한다.
    - heading: "원소별 역할"
      body: >-
        니켈은 주된 산화환원 활성 원소로, Ni²⁺/Ni³⁺/Ni⁴⁺ 사이를 오가며 용량을 낸다. 망간은 대체로 Mn⁴⁺로 남아
        전기화학적으로는 거의 반응하지 않지만 구조를 안정시킨다. 코발트는 층상 구조의 질서를 유지해 양이온 혼합을 줄이고
        전자 전도도와 율속 특성을 돕는다. 코발트는 비싸고 공급 위험이 커서 줄이려는 흐름이 강하다.
    - heading: "고니켈화의 득과 실"
      body: >-
        니켈 비율을 높이면 같은 전압 범위에서 더 많은 리튬을 꺼낼 수 있어 가역 용량이 커진다(NCM811은 대략 200 mAh/g 수준).
        대신 높은 충전 상태에서 불안정한 Ni⁴⁺가 많아져 전해질과의 부반응, 상전이, 산소 방출, 입자 미세균열이 심해지고
        열 안정성이 떨어진다. 또 표면에 LiOH·Li₂CO₃ 같은 잔류 리튬이 생기기 쉬워 수분 관리가 까다롭다.
  formula: |
    이론 용량 Q = n·F / (3.6·M)  [mAh/g]
    n: 화학식당 전자 수(=1), F = 96485 C/mol, M: 몰질량(g/mol)
    예) LiNi0.8Co0.1Mn0.1O2, M ≈ 97.3 → Q ≈ 275 mAh/g (실제로 쓰는 것은 그 일부)
  example: >-
    NCM622와 NCM811을 같은 상한 전압(예: 4.3 V vs Li/Li⁺)으로 충전하면 811이 더 많은 용량을 내지만,
    고온 사이클에서 용량 유지율이 더 빨리 떨어지는 경향이 보인다. 그래서 고니켈 소재에는 도핑(Al, Zr 등)과
    표면 코팅, 단결정화 같은 보완 기술이 함께 쓰인다.
  misconception: >-
    이론 용량 275 mAh/g를 모두 쓸 수 있는 것은 아니다. 리튬을 너무 많이 빼면 구조가 무너지므로 실제로는
    상한 전압을 정해 일부만 쓴다. 니켈 함량이 같아도 공정·도핑·입자 형태에 따라 성능 차이가 크다.
  connection: >-
    조성(Ni:Co:Mn 비율), 도핑 원소, 소성 온도 같은 변수를 입력으로 용량과 수명을 예측하는 머신러닝 모델이
    양극재 탐색에 많이 쓰인다. 실험 수가 적어서 가우시안 프로세스나 베이지안 최적화가 자주 쓰인다.
  quiz:
    question: "NCM 양극재에서 주로 산화환원 반응을 하며 용량을 내는 원소는?"
    choices: ["망간(Mn)", "니켈(Ni)", "산소(O)", "알루미늄(Al)"]
    answer_index: 1
    explanation: "니켈이 Ni²⁺↔Ni⁴⁺로 반응하며 용량의 대부분을 낸다. 망간은 주로 Mn⁴⁺로 남아 구조를 지탱한다."
  keywords:
    - {ko: "층상 구조", en: "layered structure"}
    - {ko: "고니켈 양극", en: "Ni-rich cathode"}
    - {ko: "잔류 리튬", en: "residual lithium"}
  next_topics: ["양이온 혼합(cation mixing)", "고니켈 양극의 상전이와 산소 방출", "단결정 양극재와 입자 미세균열"]
  references: ["A. Manthiram, A reflection on lithium-ion battery cathode chemistry, Nature Communications, 2020"]

- concept: "올리빈 구조 LFP 양극재"
  title: "LFP: 에너지 밀도 대신 안전성과 수명을 택한 양극재"
  level: 입문
  one_liner: >-
    LiFePO₄는 강한 P–O 결합 덕분에 열에 강하고 수명이 길지만, 전압과 전도도가 낮아 나노화와 탄소 코팅으로 단점을 메운다.
  sections:
    - heading: "구조"
      body: >-
        LFP는 올리빈 구조(사방정계, Pnma)를 가진다. FeO₆ 팔면체와 PO₄ 사면체가 골격을 이루고, 리튬은 b축 방향의
        1차원 통로를 따라 움직인다. 인산 음이온(PO₄³⁻)의 P–O 공유 결합이 매우 강해 충전 상태에서도 산소를 잘 내놓지 않는다.
    - heading: "2상 반응과 평탄한 전압"
      body: >-
        충방전은 LiFePO₄와 FePO₄ 두 상 사이의 2상 반응으로 진행된다. 두 상이 공존하는 동안 깁스 상률에 따라 전압이 거의
        일정해서, 약 3.4 V(vs Li/Li⁺)의 매우 평탄한 전압 곡선이 나타난다. 이 덕분에 출력이 안정적이지만, 전압만 보고
        충전 상태(SOC)를 추정하기는 어렵다.
    - heading: "약점과 해결"
      body: >-
        LFP는 전자 전도도와 리튬 확산이 느리다. 그래서 입자를 수십~수백 nm로 작게 만들고 표면을 탄소로 얇게 감싸
        전도 경로를 만든다. 이론 용량은 약 170 mAh/g이고 평균 전압이 낮아 NCM보다 에너지 밀도가 낮지만, 철과 인은 싸고 풍부하며
        수명이 길어 ESS와 보급형 전기차에 널리 쓰인다.
  formula: |
    LiFePO4 ⇌ FePO4 + Li⁺ + e⁻   (Fe²⁺ ⇌ Fe³⁺)
    이론 용량 ≈ 96485 / (3.6 × 157.8) ≈ 170 mAh/g
  example: >-
    LFP 셀의 OCV 곡선은 SOC 20~80% 구간에서 수십 mV밖에 변하지 않는다. 그래서 BMS는 전압 대신 전류 적산(쿨롱 카운팅)과
    완충 시점 보정에 더 많이 의존한다.
  misconception: >-
    LFP가 원래 전도도가 좋은 소재라서 많이 쓰이는 것은 아니다. 나노화와 탄소 코팅 같은 공정 기술이 나온 뒤에야 실용화되었다.
  connection: >-
    평탄한 전압 때문에 SOC 추정이 어려운 LFP는 전류·전압·온도 이력을 입력으로 SOC를 추정하는 칼만 필터나
    LSTM 같은 시계열 모델이 특히 많이 연구되는 대상이다.
  quiz:
    question: "LFP 전압 곡선이 넓은 SOC 범위에서 평탄한 주된 이유는?"
    choices: ["전해질 저항이 매우 작아서", "LiFePO₄와 FePO₄의 2상 반응이라서", "철이 전자를 2개씩 내놓아서", "탄소 코팅 때문에"]
    answer_index: 1
    explanation: "두 상이 공존하면 상률에 따라 리튬 화학 퍼텐셜이 고정되어 전압이 거의 일정하게 유지된다."
  keywords:
    - {ko: "올리빈 구조", en: "olivine structure"}
    - {ko: "2상 반응", en: "two-phase reaction"}
    - {ko: "탄소 코팅", en: "carbon coating"}
  next_topics: ["상전이 반응 vs 고용체 반응의 전압 곡선", "OCV, 엔트로피 계수, 가역 발열"]
  references: ["A. K. Padhi, K. S. Nanjundaswamy, J. B. Goodenough, Phospho-olivines as positive-electrode materials for rechargeable lithium batteries, J. Electrochem. Soc., 1997"]

- concept: "스피넬 LMO 양극재"
  title: "스피넬 LMO: 3차원 통로로 빠르지만 망간 용출이 약점"
  level: 중급
  one_liner: >-
    LiMn₂O₄는 리튬이 3차원 통로로 움직여 출력이 좋고 값이 싸지만, 고온에서 망간이 녹아 나와 수명이 짧아지기 쉽다.
  sections:
    - heading: "구조"
      body: >-
        LMO는 입방정 스피넬 구조(Fd-3m)다. 망간은 팔면체 자리(16d), 리튬은 사면체 자리(8a)에 있고, 리튬이 지나는 통로가
        3차원으로 연결되어 있다. 그래서 층상 구조보다 리튬 확산 경로가 다양하고 율속 특성이 좋다.
    - heading: "전압과 용량"
      body: >-
        약 4 V 부근에서 Mn³⁺/Mn⁴⁺ 반응으로 리튬이 빠지고 들어가며, 이론 용량은 약 148 mAh/g다. 리튬을 더 넣어
        3 V 영역까지 쓰면 Mn³⁺가 많아지면서 얀-텔러 왜곡이 일어나 입방정이 정방정으로 바뀌고 구조가 크게 손상된다.
    - heading: "망간 용출"
      body: >-
        전해질의 LiPF₆가 수분과 반응해 생긴 HF가 표면을 공격하면, 2Mn³⁺ → Mn⁴⁺ + Mn²⁺ 불균등화 반응으로 생긴 Mn²⁺가
        전해질에 녹는다. 녹은 망간은 음극으로 가서 SEI를 망가뜨려 용량 감소를 가속한다. 고온일수록 심하다.
        일부 망간을 다른 원소로 치환하거나 표면을 코팅해 이를 줄인다.
  formula: |
    LiMn2O4 ⇌ Mn2O4(λ-MnO2) + Li⁺ + e⁻
    불균등화: 2Mn³⁺ → Mn⁴⁺ + Mn²⁺(용해)
  example: >-
    초기 전기차 일부는 LMO와 NCM을 섞은 양극을 썼다. LMO의 출력과 낮은 가격, NCM의 용량을 함께 얻기 위해서였다.
    고전압 변형인 LiNi0.5Mn1.5O4(LNMO)는 약 4.7 V에서 작동하지만 이 전압을 견딜 전해질이 과제다.
  misconception: >-
    얀-텔러 왜곡은 망간이 있다고 항상 일어나는 것이 아니라, Mn³⁺ 비율이 높아질 때(평균 산화수가 3.5 이하로 내려갈 때)
    두드러진다. 그래서 4 V 영역만 쓰면 비교적 안정하다.
  connection: >-
    전이금속 용출과 같은 열화는 사이클 데이터만 보고 원인을 구분하기 어렵다. 전압 곡선 특징을 추출해 열화 모드를
    분류하는 머신러닝 연구가 활발하다.
  quiz:
    question: "LMO에서 3 V 영역까지 방전하면 구조가 크게 손상되는 원인은?"
    choices: ["산소 방출", "Mn³⁺의 얀-텔러 왜곡", "리튬 덴드라이트", "SEI 두께 증가"]
    answer_index: 1
    explanation: "Mn³⁺가 많아지면 얀-텔러 효과로 입방정이 정방정으로 바뀌며 큰 부피 변화와 균열이 생긴다."
  keywords:
    - {ko: "스피넬", en: "spinel"}
    - {ko: "얀-텔러 효과", en: "Jahn–Teller effect"}
    - {ko: "망간 용출", en: "manganese dissolution"}
  next_topics: ["전이금속 용출과 크로스토크", "양극 표면 코팅(Al2O3, LiNbO3 등)"]
  references: ["M. M. Thackeray et al., Lithium insertion into manganese spinels, Materials Research Bulletin, 1983"]

- concept: "흑연 음극과 리튬 삽입(staging)"
  title: "흑연 음극: 리튬이 층을 건너뛰며 채워지는 스테이징"
  level: 중급
  one_liner: >-
    흑연은 그래핀 층 사이에 리튬을 넣어 LiC₆까지 만들 수 있고, 이 과정은 여러 단계(stage)의 상전이로 진행된다.
  sections:
    - heading: "삽입 반응"
      body: >-
        흑연은 그래핀 층이 약한 반데르발스 힘으로 쌓인 구조다. 충전하면 리튬 이온이 층 사이에 들어가 탄소 6개당 리튬 1개인
        LiC₆까지 만들 수 있다. 이론 용량은 약 372 mAh/g이고, 반응 전위가 리튬 금속 대비 약 0.1~0.2 V로 낮아 셀 전압을 높여 준다.
    - heading: "스테이징"
      body: >-
        리튬은 모든 층에 고르게 들어가지 않고, 일정한 간격으로 층을 건너뛰며 채워진다. n개 층마다 리튬 층이 하나 있는 상태를
        stage n이라 한다. 충전이 진행되면 묽은 상태에서 stage 4, 3, 2L, 2를 거쳐 stage 1(LiC₆)로 바뀐다. 상이 바뀔 때마다
        전압 곡선에 평탄 구간이 생기고, dQ/dV 그래프에는 뚜렷한 피크로 나타난다.
    - heading: "실제 사용의 쟁점"
      body: >-
        첫 충전 때 전해질이 흑연 표면에서 환원되어 SEI가 만들어지며, 이때 쓰인 리튬은 돌아오지 않는다. 또 흑연 전위가 리튬
        석출 전위(0 V)에 가까워서, 급속 충전이나 저온 충전 시 리튬이 흑연 안으로 들어가지 못하고 표면에 금속으로 석출될 수 있다.
        층간 간격은 리튬이 들어가면 약 10% 늘어난다.
  formula: |
    6C + Li⁺ + e⁻ ⇌ LiC6
    이론 용량 = 96485 / (3.6 × 72.06) ≈ 372 mAh/g (C6 기준)
  example: >-
    흑연 반쪽 셀을 아주 느린 전류(예: C/20)로 충전하며 dQ/dV를 그리면 약 0.2, 0.12, 0.09 V 부근에 스테이지 전이 피크가 보인다.
    이 피크 위치와 크기의 변화로 흑연의 열화를 추적할 수 있다.
  misconception: >-
    흑연 음극의 용량을 높이려고 무조건 리튬을 더 넣을 수 있는 것은 아니다. LiC₆가 상한이며, 그 이상은 금속 리튬 석출로 이어진다.
  connection: >-
    dQ/dV 피크의 위치·높이를 특징으로 뽑아 셀의 잔존 수명(RUL)을 예측하는 머신러닝 연구가 많다.
    스테이징이 물리적 근거가 있는 특징을 만들어 주는 셈이다.
  quiz:
    question: "흑연에 리튬이 완전히 삽입된 화합물은?"
    choices: ["LiC₂", "LiC₆", "LiC₁₂", "Li₂C₆"]
    answer_index: 1
    explanation: "탄소 6개당 리튬 1개인 LiC₆(stage 1)가 완전 삽입 상태이며 이론 용량 약 372 mAh/g에 해당한다."
  keywords:
    - {ko: "층간 삽입", en: "intercalation"}
    - {ko: "스테이징", en: "staging"}
    - {ko: "리튬 석출", en: "lithium plating"}
  next_topics: ["리튬 도금(lithium plating)", "dQ/dV 미분 용량 분석", "SEI(고체 전해질 계면)의 형성과 조성"]
  references: ["T. Ohzuku, Y. Iwakoshi, K. Sawai, Formation of lithium-graphite intercalation compounds in nonaqueous electrolytes, J. Electrochem. Soc., 1993"]

- concept: "실리콘 음극의 부피 팽창 문제"
  title: "실리콘 음극: 흑연의 10배 용량, 그러나 300% 부피 팽창"
  level: 중급
  one_liner: >-
    실리콘은 리튬과 합금을 만들어 흑연보다 훨씬 많은 리튬을 저장하지만, 그만큼 크게 부풀어 입자가 깨지고 SEI가 계속 새로 생긴다.
  sections:
    - heading: "합금 반응"
      body: >-
        실리콘은 층 사이에 리튬을 끼우는 흑연과 달리 리튬과 합금을 만든다. 상온에서는 대략 Li₁₅Si₄까지 반응하며 이론 용량은
        약 3,580 mAh/g로 흑연(372 mAh/g)의 열 배 가까이 된다. 반응 전위도 약 0.4 V 이하로 낮아 음극으로 적합하다.
    - heading: "부피 팽창이 일으키는 문제"
      body: >-
        완전히 리튬화되면 부피가 약 3~4배로 늘어난다. 이 반복적인 팽창·수축 때문에 첫째, 입자가 깨진다(분쇄).
        둘째, 입자와 도전재·집전체의 접촉이 끊긴다. 셋째, 깨진 새 표면마다 SEI가 다시 생겨 리튬과 전해질이 계속 소모된다.
        결과적으로 쿨롱 효율이 낮고 용량이 빠르게 떨어진다.
    - heading: "해결 전략"
      body: >-
        입자를 나노 크기로 만들면 깨짐이 줄어든다(대략 150 nm 이하에서 균열이 크게 줄어든다는 보고가 있다).
        탄소와 복합화하거나 산화물(SiOₓ)을 쓰고, 팽창을 견디는 바인더를 쓰며, FEC 같은 첨가제로 SEI를 튼튼하게 만든다.
        상용 셀에서는 흑연에 실리콘계 소재를 몇~십여 % 섞어 쓰는 방식이 주류다.
  formula: |
    4Si + 15Li⁺ + 15e⁻ → Li15Si4
    이론 용량 ≈ (15 × 96485) / (3.6 × 4 × 28.09) ≈ 3,580 mAh/g
  example: >-
    흑연에 SiOₓ를 일부 섞은 음극은 순수 흑연 음극보다 용량이 크지만, 첫 사이클 쿨롱 효율이 낮아 사전 리튬화(prelithiation)로
    잃은 리튬을 보충하는 기술이 함께 연구된다.
  misconception: >-
    용량이 크다고 셀 에너지 밀도가 그만큼 오르지는 않는다. 양극 용량, 팽창을 위한 여유 공간, 낮은 효율을 함께 따져야 하므로
    실제 셀 수준 이득은 훨씬 작다.
  connection: >-
    실리콘 입자의 균열과 SEI 성장을 함께 다루는 화학-기계 결합 모델은 계산량이 크다. 이를 빠르게 근사하는 대리 모델(surrogate model)로
    신경망이 쓰인다.
  quiz:
    question: "실리콘 음극에서 용량이 빠르게 줄어드는 근본 원인이 아닌 것은?"
    choices: ["입자 분쇄", "전기적 접촉 손실", "SEI의 반복 형성", "올리빈 구조의 2상 반응"]
    answer_index: 3
    explanation: "2상 반응은 LFP 양극의 특징이다. 실리콘은 부피 팽창으로 분쇄·접촉 손실·SEI 재형성이 일어난다."
  keywords:
    - {ko: "합금 반응", en: "alloying reaction"}
    - {ko: "부피 팽창", en: "volume expansion"}
    - {ko: "사전 리튬화", en: "prelithiation"}
  next_topics: ["SEI 형성 첨가제 FEC·VC", "바인더와 도전재", "인공 SEI"]
  references: ["M. N. Obrovac, V. L. Chevrier, Alloy negative electrodes for Li-ion batteries, Chemical Reviews, 2014"]

- concept: "리튬 금속 음극과 덴드라이트"
  title: "리튬 금속 음극: 궁극의 음극이 어려운 이유"
  level: 중급
  one_liner: >-
    리튬 금속은 용량이 가장 크고 전위가 가장 낮은 음극이지만, 고르지 않게 석출되며 덴드라이트와 죽은 리튬을 만든다.
  sections:
    - heading: "왜 궁극의 음극인가"
      body: >-
        리튬 금속은 이론 용량이 약 3,860 mAh/g이고, 표준 수소 전극 대비 약 −3.04 V로 전위가 가장 낮다. 흑연처럼 호스트 구조가
        필요 없어 무게와 부피를 크게 줄일 수 있다. 리튬-황, 리튬-공기, 전고체 전지 등 차세대 전지가 대부분 리튬 금속을 전제로 한다.
    - heading: "덴드라이트와 죽은 리튬"
      body: >-
        충전할 때 리튬은 표면에 고르게 쌓이지 않는다. SEI가 고르지 않거나 전류가 한 곳에 몰리면 바늘이나 이끼 모양으로 자란다.
        이것이 분리막을 뚫으면 내부 단락으로 이어진다. 방전할 때 뿌리 쪽이 먼저 녹아 끊어지면 전기적으로 고립된 죽은 리튬이 남아
        용량이 줄고 표면적이 커져 부반응도 늘어난다.
    - heading: "해결 방향"
      body: >-
        SEI를 균일하고 튼튼하게 만드는 전해질 설계(고농도·불소계 전해질), 인공 보호막, 리튬이 들어갈 3차원 호스트, 셀에 압력을 가하는 방법,
        단단한 고체 전해질 사용 등이 연구된다. 리튬 금속의 쿨롱 효율은 보통 99.9% 이상이어야 실용 수명을 기대할 수 있다.
  formula: |
    Sand's time: t_s = πD·(z·c0·F)² / [4·(J·(1−t₊))²]
    (전류 밀도 J가 클수록 표면 리튬 이온이 빨리 고갈되어 수지상 성장이 시작되기 쉽다)
  example: >-
    음극에 리튬을 넣지 않고 구리 집전체만 쓰는 무음극(anode-free) 셀은 양극의 리튬만으로 작동한다. 리튬 손실이 바로 용량 손실이 되므로
    리튬 쿨롱 효율을 평가하는 엄격한 시험대로 쓰인다.
  misconception: >-
    단단한 고체 전해질을 쓰면 덴드라이트가 생기지 않는다고 생각하기 쉽지만, 고체 전해질의 결정립계나 결함을 따라 리튬이 파고드는
    현상도 보고된다. 기계적 강도만으로는 충분하지 않다.
  connection: >-
    리튬 석출 형태를 현미경 이미지로 분류하거나, 위상장(phase-field) 시뮬레이션을 신경망으로 가속하는 연구가 진행 중이다.
  quiz:
    question: "방전 중 끊어져 전기적으로 고립된 리튬을 무엇이라 부르나?"
    choices: ["죽은 리튬(dead lithium)", "SEI", "리튬 스테이징", "잔류 리튬"]
    answer_index: 0
    explanation: "덴드라이트 뿌리가 먼저 녹아 끊어지면 전자를 주고받지 못하는 죽은 리튬이 남아 용량이 줄어든다."
  keywords:
    - {ko: "덴드라이트", en: "dendrite"}
    - {ko: "죽은 리튬", en: "dead lithium"}
    - {ko: "무음극 전지", en: "anode-free battery"}
  next_topics: ["리튬 도금(lithium plating)", "인공 SEI", "용매화 구조와 고농도·국부고농도 전해질"]
  references: ["D. Lin, Y. Liu, Y. Cui, Reviving the lithium metal anode for high-energy batteries, Nature Nanotechnology, 2017"]

- concept: "황화물·산화물 고체 전해질"
  title: "고체 전해질: 황화물은 빠르고 무르며, 산화물은 단단하고 안정하다"
  level: 중급
  one_liner: >-
    고체 전해질은 액체를 대신해 리튬 이온을 전달하며, 대표 계열인 황화물과 산화물은 전도도·가공성·안정성에서 서로 반대 성격을 가진다.
  sections:
    - heading: "고체에서 이온이 움직이는 방식"
      body: >-
        고체 전해질에서는 리튬 이온이 결정 격자의 빈자리나 틈새 자리를 뛰어넘으며 이동한다. 이동 통로가 연결되어 있고 활성화 에너지가
        낮을수록 전도도가 높다. 좋은 고체 전해질은 상온에서 10⁻³ S/cm 이상의 전도도를 보이며, 리튬 이온만 움직이므로 전이수가 1에 가깝다.
    - heading: "황화물계"
      body: >-
        Li₁₀GeP₂S₁₂(LGPS), 아지로다이트(Li₆PS₅Cl) 같은 황화물은 전도도가 액체 전해질 수준(10⁻³~10⁻² S/cm)까지 높다.
        재료가 물러서 눌러 붙이기만 해도 입자 사이 접촉이 잘 된다. 반면 수분과 반응해 유독한 H₂S를 내고, 전기화학 창이 좁아
        전극과의 계면에서 분해되기 쉽다.
    - heading: "산화물계"
      body: >-
        가넷형 LLZO(Li₇La₃Zr₂O₁₂)나 NASICON형 LATP 같은 산화물은 공기 중에서 안정하고, LLZO는 리튬 금속에도 비교적 안정하다.
        하지만 단단하고 부서지기 쉬워 전극과 밀착시키려면 고온 소결이 필요하고, 입계 저항이 커지기 쉽다. 이 밖에 할라이드계와
        고분자 전해질도 연구된다.
  formula: |
    아레니우스 관계: σ·T = A · exp(−Ea / kB·T)
    σ: 이온 전도도, Ea: 이동 활성화 에너지, kB: 볼츠만 상수
  example: >-
    전고체 셀을 만들 때 황화물 전해질은 양극 입자와 함께 압축 성형할 수 있지만, 산화물 전해질은 1000 °C 안팎의 소결이 필요해
    양극 소재와 반응하지 않도록 공정을 조심스럽게 설계해야 한다.
  misconception: >-
    고체라서 무조건 안전한 것은 아니다. 황화물은 공기 중 수분과 반응하고, 리튬 금속과의 계면에서 분해 산물이 생기며,
    양극 쪽에서도 분해가 일어날 수 있다.
  connection: >-
    수만 개의 후보 조성에 대해 DFT로 이동 장벽을 계산하는 대신, 결정 구조 그래프를 입력으로 전도도를 예측하는 GNN이
    고체 전해질 탐색에 쓰인다.
  quiz:
    question: "황화물계 고체 전해질의 대표적인 단점은?"
    choices: ["이온 전도도가 매우 낮다", "고온 소결이 반드시 필요하다", "수분과 반응해 H₂S가 생긴다", "전이수가 0에 가깝다"]
    answer_index: 2
    explanation: "황화물은 전도도가 높고 무르지만 수분과 반응해 H₂S를 내므로 건조실 공정이 필요하다."
  keywords:
    - {ko: "황화물 고체 전해질", en: "sulfide solid electrolyte"}
    - {ko: "가넷형 LLZO", en: "garnet LLZO"}
    - {ko: "이온 전도도", en: "ionic conductivity"}
  next_topics: ["고체전해질/전극 계면의 공간전하층", "전고체 전지의 계면 접촉 손실(화학-기계적 열화)", "전기화학 창(electrochemical window)"]
  references: ["J. Janek, W. G. Zeier, A solid future for battery development, Nature Energy, 2016"]

- concept: "LiPF6-카보네이트 액체 전해질"
  title: "LiPF₆ + 카보네이트: 30년 넘게 쓰인 표준 전해질"
  level: 입문
  one_liner: >-
    상용 리튬이온 전지 전해질은 LiPF₆ 염을 고리형(EC)과 선형(DMC, EMC 등) 카보네이트 혼합 용매에 녹인 것이 기본이다.
  sections:
    - heading: "용매 조합"
      body: >-
        에틸렌 카보네이트(EC)는 유전율이 높아 염을 잘 해리시키고, 흑연 위에 안정한 SEI를 만드는 핵심 성분이다. 하지만 상온에서 고체이고
        점도가 높다. 그래서 점도가 낮은 선형 카보네이트(DMC, EMC, DEC)를 섞어 이온이 잘 움직이게 한다. 프로필렌 카보네이트(PC)만 쓰면
        흑연 층 사이로 용매가 함께 들어가 흑연이 벗겨지는 문제가 있다.
    - heading: "왜 LiPF₆인가"
      body: >-
        LiPF₆는 전도도, 전기화학 안정성, 알루미늄 집전체 부식 억제(표면에 AlF₃ 보호막 형성)의 균형이 좋다. 단점은 열과 수분에 약하다는 것이다.
        LiPF₆ ⇌ LiF + PF₅로 분해되고, PF₅와 미량의 물이 반응하면 HF가 생겨 양극을 공격하고 전이금속 용출을 일으킨다.
    - heading: "일반적인 사양"
      body: >-
        보통 1.0~1.2 M 농도에서 상온 전도도가 대략 10 mS/cm 수준이다. 여기에 VC, FEC 같은 첨가제를 몇 % 넣어 SEI를 조절한다.
        카보네이트 용매는 인화성이 있어 열폭주 시 화재의 원인이 되므로, 난연 첨가제나 불연성 용매가 연구된다.
  formula: |
    LiPF6 ⇌ LiF + PF5
    PF5 + H2O → POF3 + 2HF
  example: >-
    전해질 주입은 이슬점이 매우 낮은 건조실에서 한다. 수분이 수십 ppm만 있어도 HF가 생겨 고온 수명이 나빠지기 때문이다.
  misconception: >-
    전해질 전도도가 높을수록 항상 좋은 것은 아니다. 점도, 전이수, SEI 형성 능력, 전위 안정성을 함께 봐야 하며,
    전도도를 위해 EC를 너무 줄이면 SEI가 약해질 수 있다.
  connection: >-
    용매 조합과 염 농도를 바꿔 가며 전도도를 측정하는 실험은 조합 수가 많다. 로봇 실험과 베이지안 최적화를 결합한 자율 실험실이
    전해질 조성 최적화에 쓰인 사례가 있다.
  quiz:
    question: "EC를 선형 카보네이트(DMC 등)와 섞어 쓰는 주된 이유는?"
    choices: ["EC의 높은 점도를 낮추려고", "EC가 SEI를 못 만들어서", "LiPF₆가 EC에 안 녹아서", "알루미늄 부식을 늘리려고"]
    answer_index: 0
    explanation: "EC는 해리와 SEI 형성에 좋지만 점도가 높고 상온에서 고체라, 저점도 선형 카보네이트를 섞는다."
  keywords:
    - {ko: "에틸렌 카보네이트", en: "ethylene carbonate"}
    - {ko: "육불화인산리튬", en: "lithium hexafluorophosphate"}
    - {ko: "불산", en: "hydrofluoric acid"}
  next_topics: ["SEI(고체 전해질 계면)의 형성과 조성", "SEI 형성 첨가제 FEC·VC", "용매화 구조와 고농도·국부고농도 전해질"]
  references: ["K. Xu, Nonaqueous liquid electrolytes for lithium-based rechargeable batteries, Chemical Reviews, 2004"]

- concept: "분리막의 역할과 셧다운 기능"
  title: "분리막: 전자는 막고 이온은 통과시키는 얇은 다공막"
  level: 입문
  one_liner: >-
    분리막은 양극과 음극의 직접 접촉을 막으면서 전해질이 채워진 미세 기공으로 이온을 통과시키고, 과열되면 기공을 닫아 전류를 차단한다.
  sections:
    - heading: "기본 역할과 구조"
      body: >-
        리튬이온 전지 분리막은 주로 폴리에틸렌(PE)이나 폴리프로필렌(PP)으로 만든 수~수십 μm 두께의 다공성 필름이다. 기공률은 대략 40% 안팎이며,
        기공에 전해질이 채워져 이온이 지나간다. 자체는 전기화학 반응에 참여하지 않지만 셀 저항, 안전성, 수명에 큰 영향을 준다.
    - heading: "셧다운 기능"
      body: >-
        PE는 약 130 °C, PP는 약 165 °C에서 녹는다. 셀이 과열되면 PE가 먼저 녹아 기공을 막고 이온 흐름을 차단한다. 이것이 셧다운이다.
        PP/PE/PP 3층 분리막은 PE가 기공을 닫는 동안 녹는점이 더 높은 PP가 형태를 유지해 전극끼리 닿지 않게 한다.
    - heading: "세라믹 코팅"
      body: >-
        온도가 더 오르면 고분자 분리막은 수축해 전극이 직접 닿을 수 있다. 그래서 알루미나 같은 세라믹 입자를 분리막 표면에 코팅해
        고온 수축을 줄이고 전해질 젖음성을 높인다. 대신 두께와 무게가 늘어난다.
  formula: |
    맥멀린 수: N_M = σ0 / σ_eff = τ / ε
    σ0: 전해질 전도도, σ_eff: 분리막에 채운 전해질의 유효 전도도, τ: 굴곡도, ε: 기공률
  example: >-
    같은 두께라도 기공이 구불구불한(굴곡도가 큰) 분리막은 맥멀린 수가 커서 이온 저항이 높다. 고출력 셀에는 얇고 기공률이 높은 분리막이 쓰인다.
  misconception: >-
    셧다운은 열폭주를 항상 막아 주지 않는다. 내부 단락이나 이미 시작된 발열 반응은 전류를 끊어도 계속될 수 있다.
  connection: >-
    분리막 SEM이나 X선 CT 이미지에서 기공 구조를 분할(segmentation)해 굴곡도를 계산하는 데 CNN 기반 이미지 분할 모델이 쓰인다.
  quiz:
    question: "PP/PE/PP 3층 분리막에서 셧다운 때 기공을 닫는 층은?"
    choices: ["바깥쪽 PP 층", "가운데 PE 층", "세라믹 코팅층", "알루미늄 집전체"]
    answer_index: 1
    explanation: "녹는점이 낮은 PE(약 130 °C)가 먼저 녹아 기공을 막고, PP는 형태를 유지한다."
  keywords:
    - {ko: "다공성 분리막", en: "porous separator"}
    - {ko: "셧다운", en: "thermal shutdown"}
    - {ko: "맥멀린 수", en: "MacMullin number"}
  next_topics: ["DSC·ARC 열안전성 평가", "이온 전도도와 리튬 이온 전이수"]
  references: ["P. Arora, Z. Zhang, Battery separators, Chemical Reviews, 2004"]

- concept: "바인더와 도전재"
  title: "바인더와 도전재: 전극의 몇 %가 성능을 좌우한다"
  level: 입문
  one_liner: >-
    바인더는 활물질 입자를 서로와 집전체에 붙여 두고, 도전재는 입자 사이에 전자가 다닐 길을 만든다.
  sections:
    - heading: "전극의 구성"
      body: >-
        전극은 활물질, 도전재, 바인더를 용매와 섞은 슬러리를 집전체(양극은 알루미늄, 음극은 구리)에 바르고 말린 뒤 압연해 만든다.
        활물질 비율을 높일수록 에너지 밀도가 오르지만, 바인더와 도전재가 부족하면 접착력과 전자 전도성이 나빠진다.
    - heading: "바인더"
      body: >-
        양극에는 주로 PVDF를 NMP 용매에 녹여 쓴다. PVDF는 전기화학적으로 안정하지만 NMP는 독성이 있어 회수 설비가 필요하다.
        음극에는 물에 분산되는 SBR과 CMC 조합이 주로 쓰인다. 실리콘처럼 크게 부푸는 소재에는 PAA처럼 입자 표면과 강하게 결합하는
        바인더가 연구된다.
    - heading: "도전재"
      body: >-
        활물질, 특히 양극 소재는 전자 전도도가 낮다. 카본블랙 같은 입자형 도전재는 활물질 사이 빈틈을 채워 점 접촉을 만들고,
        탄소나노튜브(CNT) 같은 선형 도전재는 적은 양으로 긴 전도 경로를 만든다. 도전재는 비표면적이 커서 부반응과 바인더 소모도 늘릴 수 있다.
  formula: |
    전극 조성 예: 활물질 : 도전재 : 바인더 = 96 : 2 : 2 (wt%)
    면적당 용량 = 로딩(mg/cm²) × 활물질 비율 × 비용량(mAh/g) / 1000
  example: >-
    같은 양극 소재라도 CNT를 일부 쓰면 카본블랙만 쓸 때보다 적은 도전재로 비슷한 전도성을 얻어 활물질 비율을 높일 수 있다.
  misconception: >-
    바인더와 도전재는 비활성 성분이라 성능과 무관하다고 보기 쉽지만, 분포가 고르지 않으면 국부적인 전류 집중과 열화가 생긴다.
    건조 중 바인더가 표면으로 이동하는 현상도 성능에 영향을 준다.
  connection: >-
    전극 단면 3D 이미지를 바탕으로 활물질·도전재·기공의 미세구조를 생성하는 생성 모델(GAN, 확산 모델)이 전극 설계에 쓰인다.
  quiz:
    question: "흑연 음극에 흔히 쓰이는 수계 바인더 조합은?"
    choices: ["PVDF/NMP", "SBR/CMC", "PE/PP", "LiPF₆/EC"]
    answer_index: 1
    explanation: "음극은 물에 분산되는 SBR(접착)과 CMC(증점·분산) 조합을 주로 쓴다. PVDF/NMP는 주로 양극용이다."
  keywords:
    - {ko: "바인더", en: "binder"}
    - {ko: "도전재", en: "conductive additive"}
    - {ko: "슬러리", en: "slurry"}
  next_topics: ["실리콘 음극의 부피 팽창 문제", "SEM·TEM 단면 분석"]
  references: []

- concept: "양이온 혼합(cation mixing)"
  title: "양이온 혼합: 리튬 자리에 니켈이 들어가면 생기는 일"
  level: 심화
  one_liner: >-
    층상 양극에서 Ni²⁺가 크기가 비슷한 Li⁺ 자리로 들어가는 현상으로, 리튬 이동 통로를 막고 용량과 율속 특성을 떨어뜨린다.
  sections:
    - heading: "왜 일어나나"
      body: >-
        Ni²⁺(약 0.69 Å)와 Li⁺(약 0.76 Å)는 이온 반지름이 비슷하다. 그래서 합성 과정이나 충방전 중에 일부 니켈이 리튬 층으로 들어가고
        리튬이 전이금속 층으로 가는 자리 바꿈이 생긴다. 니켈 함량이 높을수록, 산소가 부족한 분위기에서 합성할수록, 높은 충전 상태일수록
        심해지는 경향이 있다.
    - heading: "무엇이 나빠지나"
      body: >-
        리튬 층에 들어간 니켈은 리튬이 지나가는 2차원 통로를 막는 장애물이 된다. 또 충전 중 층간 간격이 줄어들게 해 리튬 확산을 더 어렵게 한다.
        결과적으로 가역 용량, 첫 사이클 효율, 율속 특성이 나빠진다. 표면에서는 양이온 혼합이 심화되어 암염(rock-salt) 구조로 바뀌는 상전이의 출발점이 된다.
    - heading: "측정과 억제"
      body: >-
        XRD에서 (003)과 (104) 피크의 세기 비가 대략 1.2보다 작으면 양이온 혼합이 크다고 본다. 리트벨트 정련으로 리튬 자리의 니켈 점유율을
        구하기도 한다. 산소 분위기 소성, 적절한 소성 온도, 코발트나 다른 원소 도핑으로 혼합을 줄인다.
  formula: |
    지표: I(003) / I(104) > 약 1.2 → 양이온 혼합 적음
    점유: [Li1−x Nix]3b [Ni1−x Lix ...]3a O2
  example: >-
    같은 조성의 NCM811을 공기와 산소 분위기에서 각각 소성하면, 산소 분위기 시료가 I(003)/I(104) 비가 더 크고 첫 방전 용량도 더 높게 나오는 경향이 있다.
  misconception: >-
    I(003)/I(104) 비 하나로 양이온 혼합을 정량할 수 있다고 생각하기 쉽지만, 이 비는 결정 방위(우선 배향)의 영향도 받는다.
    정확히 보려면 리트벨트 정련이 필요하다.
  connection: >-
    XRD 패턴 전체를 입력으로 상 조성과 격자 상수, 결함 정도를 바로 예측하는 1D CNN 모델이 리트벨트 정련을 보조하는 데 쓰인다.
  quiz:
    question: "층상 양극에서 리튬 자리를 주로 차지하게 되는 이온은?"
    choices: ["Mn⁴⁺", "Co³⁺", "Ni²⁺", "Al³⁺"]
    answer_index: 2
    explanation: "Ni²⁺는 Li⁺와 이온 반지름이 비슷해 리튬 층으로 들어가기 쉽다."
  keywords:
    - {ko: "양이온 혼합", en: "cation mixing"}
    - {ko: "리트벨트 정련", en: "Rietveld refinement"}
    - {ko: "암염 구조", en: "rock-salt phase"}
  next_topics: ["XRD와 operando XRD", "고니켈 양극의 상전이와 산소 방출"]
  references: []

- concept: "단결정 양극재와 입자 미세균열"
  title: "단결정 양극재: 깨지지 않는 입자를 만드는 이유"
  level: 심화
  one_liner: >-
    작은 결정이 뭉친 다결정 입자는 충방전 중 결정 사이가 벌어져 깨지지만, 하나의 결정으로 된 단결정 입자는 이런 입계 균열이 거의 없다.
  sections:
    - heading: "다결정 입자의 균열"
      body: >-
        일반적인 NCM은 수백 nm 크기 1차 입자가 모인 수~십여 μm의 2차 입자다. 충전하면 격자가 방향마다 다르게 수축·팽창한다
        (고니켈 소재는 높은 충전 상태에서 c축이 급격히 줄어든다). 방향이 제각각인 1차 입자들이 서로 다르게 변형하면서 입계에 응력이 쌓여 균열이 생긴다.
    - heading: "균열이 일으키는 문제"
      body: >-
        균열이 생기면 전해질이 입자 안쪽으로 스며들어 새로운 표면에서 부반응과 상전이가 일어난다. 또 1차 입자끼리 전기적으로 끊어져
        일부 활물질이 반응에 참여하지 못한다. 그래서 용량이 줄고 저항과 가스 발생이 늘어난다.
    - heading: "단결정 입자"
      body: >-
        단결정(실제로는 단일 1차 입자에 가까운 수 μm 입자) 양극은 내부 입계가 없어 균열이 크게 줄고, 비표면적이 작아 부반응도 적다.
        대신 리튬 확산 거리가 길어 율속 특성이 떨어질 수 있고, 높은 온도에서 소성해야 해 양이온 혼합 관리가 어렵다.
  formula: |
    고니켈 NCM의 c축 변화: 높은 충전 상태(H2→H3 상전이)에서 수 % 급감
    부피 변화가 클수록 입계 응력 ↑
  example: >-
    장수명이 중요한 셀에서는 단결정 NCM이 쓰인 사례가 많다. 사이클 후 단면 SEM을 보면 다결정 입자는 내부에 거미줄 같은 균열이 보이지만
    단결정 입자는 대체로 온전하다.
  misconception: >-
    단결정이라고 균열이 전혀 생기지 않는 것은 아니다. 높은 전압에서는 입자 내부에 미끄럼이나 미세균열이 생길 수 있다.
  connection: >-
    단면 SEM 이미지에서 균열을 자동으로 검출하고 정량하는 이미지 분할 모델(U-Net 등)을 쓰면 수백 개 입자의 열화를 빠르게 통계화할 수 있다.
  quiz:
    question: "다결정 NCM 입자에서 미세균열이 주로 생기는 곳은?"
    choices: ["집전체 내부", "1차 입자 사이의 입계", "전해질 속", "분리막 표면"]
    answer_index: 1
    explanation: "방향이 다른 1차 입자들이 서로 다르게 변형하면서 입계에 응력이 쌓여 균열이 생긴다."
  keywords:
    - {ko: "단결정 양극", en: "single-crystal cathode"}
    - {ko: "입계 균열", en: "intergranular cracking"}
    - {ko: "이방성 변형", en: "anisotropic strain"}
  next_topics: ["고니켈 양극의 상전이와 산소 방출", "SEM·TEM 단면 분석"]
  references: []

- concept: "고니켈 양극의 상전이와 산소 방출"
  title: "고니켈 양극의 표면 상전이와 산소 방출"
  level: 심화
  one_liner: >-
    리튬이 많이 빠진 고니켈 양극 표면은 층상 → 스피넬 → 암염 구조로 바뀌며 산소를 내놓고, 이것이 저항 증가와 열 불안정의 원인이 된다.
  sections:
    - heading: "표면에서 시작되는 상전이"
      body: >-
        충전 상태가 높으면 Ni⁴⁺가 많아져 불안정해진다. 표면에서는 전이금속이 리튬 층으로 이동하면서 층상 구조가 스피넬 비슷한 구조를 거쳐
        NiO와 비슷한 암염 구조로 바뀐다. 암염층은 리튬 이온이 잘 통과하지 못해 계면 저항을 키운다.
    - heading: "산소 방출"
      body: >-
        암염 구조는 층상 구조보다 산소 비율이 낮다. 따라서 상전이 과정에서 격자 산소가 빠져나온다. 방출된 산소는 전해질을 산화시켜 CO₂·CO 같은
        가스를 만들고, 고온에서는 발열 반응을 키워 열폭주 위험을 높인다. 고니켈 소재가 열 안정성이 낮은 이유가 여기에 있다.
    - heading: "대응"
      body: >-
        상한 전압을 낮추면 증상이 줄지만 용량도 줄어든다. 그래서 Al·Mg 등의 도핑으로 구조를 안정화하고, 표면 코팅으로 전해질 접촉을 막으며,
        안쪽은 니켈이 많고 바깥쪽은 망간이 많은 농도 구배 입자를 쓰기도 한다.
  formula: |
    개략적 전이: 층상(R-3m) → 스피넬형(Fd-3m) → 암염형(Fm-3m)
    예) 3NiO2 → Ni3O4 + O2 ,  Ni3O4 → 3NiO + 1/2 O2
  example: >-
    DEMS로 고니켈 양극 셀을 4.3 V 이상으로 충전하며 가스를 측정하면 특정 전압 이상에서 O₂와 CO₂가 함께 늘어나는 것이 관찰된다.
  misconception: >-
    상전이는 입자 전체에서 고르게 일어나지 않는다. 보통 표면 수 nm 영역에서 시작되며, 균열이 생기면 새 표면에서 다시 시작된다.
  connection: >-
    TEM 이미지에서 층상·암염 영역을 자동으로 구분하거나, DFT 계산 데이터로 산소 방출 경향을 예측하는 머신러닝 모델이 연구된다.
  quiz:
    question: "고니켈 양극 표면이 암염 구조로 바뀌면 가장 직접적으로 나빠지는 것은?"
    choices: ["이론 용량 계산값", "리튬 이온의 계면 통과(저항 증가)", "분리막 기공률", "전해질의 녹는점"]
    answer_index: 1
    explanation: "암염층은 리튬이 지나갈 통로가 거의 없어 계면 저항을 키우고 출력과 용량을 떨어뜨린다."
