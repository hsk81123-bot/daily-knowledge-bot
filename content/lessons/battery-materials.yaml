- concept: "나트륨 이온 배터리 소재"
  title: "나트륨 이온 배터리: 흔한 원소로 만드는 전지"
  level: 중급
  one_liner: >-
    나트륨 이온 전지는 리튬 대신 풍부한 나트륨을 쓰며, 이온이 커서 흑연 대신 하드카본을, 양극은 층상 산화물·프러시안 블루·폴리음이온을 쓴다.
  sections:
    - heading: "리튬과 무엇이 다른가"
      body: >-
        나트륨은 지각에 매우 풍부하고 값이 싸다. 하지만 Na⁺는 Li⁺보다 크고 무거우며, 표준 전위가 약 0.3 V 높아 셀 전압과 에너지 밀도가 낮다.
        장점으로는 알루미늄과 합금을 만들지 않아 음극 집전체도 구리 대신 알루미늄을 쓸 수 있다는 점이 있다.
    - heading: "음극: 하드카본"
      body: >-
        나트륨은 흑연 층 사이에 거의 들어가지 않는다(열역학적으로 불안정). 그래서 무질서한 구조의 하드카본을 쓴다. 하드카본에서는 층 사이 삽입,
        결함 흡착, 닫힌 기공 채우기가 함께 일어나며, 대략 300 mAh/g 안팎의 용량을 낸다.
    - heading: "양극 후보"
      body: >-
        NaₓMO₂ 층상 산화물(용량이 크지만 공기 안정성과 상전이가 과제), 프러시안 블루 유사체(골격이 넓어 빠르지만 결정수 관리가 어려움),
        Na₃V₂(PO₄)₃ 같은 폴리음이온(안정하지만 무겁고 바나듐 사용) 등이 연구된다. 저온 성능이 좋고 ESS나 저가 차량에 쓰임새가 기대된다.
  formula: |
    E°(Na⁺/Na) ≈ −2.71 V vs SHE,  E°(Li⁺/Li) ≈ −3.04 V vs SHE
    → 같은 양극이라도 나트륨 셀 전압이 대략 0.3 V 낮아지기 쉽다
  example: >-
    하드카본의 충방전 곡선은 경사 구간과 0.1 V 부근의 평탄 구간으로 나뉜다. 두 구간이 어떤 저장 메커니즘에 해당하는지는 아직 논쟁 중이다.
  misconception: >-
    나트륨 이온 전지가 리튬 이온 전지를 완전히 대체한다기보다, 가격과 자원 안정성이 중요한 분야에서 보완하는 역할로 보는 시각이 많다.
  connection: >-
    소재 데이터베이스(Materials Project 등)의 계산 데이터로 학습한 모델로 나트륨 양극 후보의 전압과 안정성을 먼저 걸러 내는 스크리닝이 쓰인다.
  quiz:
    question: "나트륨 이온 전지에서 흑연 대신 주로 쓰이는 음극은?"
    choices: ["실리콘", "하드카본", "리튬 금속", "LTO"]
    answer_index: 1
    explanation: "나트륨은 흑연에 거의 삽입되지 않아 무질서한 구조와 기공을 가진 하드카본을 쓴다."
  keywords:
    - {ko: "하드카본", en: "hard carbon"}
    - {ko: "프러시안 블루 유사체", en: "Prussian blue analogue"}
    - {ko: "폴리음이온 양극", en: "polyanion cathode"}
  next_topics: ["흑연 음극과 리튬 삽입(staging)", "올리빈 구조 LFP 양극재"]
  references: ["N. Yabuuchi, K. Kubota, M. Dahbi, S. Komaba, Research development on sodium-ion batteries, Chemical Reviews, 2014"]

- concept: "리튬-황 배터리와 폴리설파이드 셔틀"
  title: "리튬-황 전지: 황의 큰 용량과 폴리설파이드 셔틀"
  level: 심화
  one_liner: >-
    황은 리튬 2개와 반응해 이론 용량이 매우 크지만, 중간 생성물인 폴리설파이드가 전해질에 녹아 음극까지 오가며 용량을 갉아먹는다.
  sections:
    - heading: "반응"
      body: >-
        리튬-황 전지는 S₈ 고리가 리튬과 반응해 단계적으로 사슬이 짧아지며 최종적으로 Li₂S가 된다. 황 1개당 전자 2개가 오가므로
        이론 용량이 약 1,672 mAh/g(황 기준)로 매우 크고, 황은 싸고 풍부하다. 방전 곡선에는 보통 약 2.3 V와 2.1 V의 두 평탄 구간이 나타난다.
    - heading: "폴리설파이드 셔틀"
      body: >-
        중간 생성물인 긴 사슬 폴리설파이드(Li₂Sₙ, n≈4~8)는 에테르계 전해질에 잘 녹는다. 녹은 폴리설파이드는 음극으로 확산해 리튬과 반응해
        짧은 사슬로 환원되고, 다시 양극으로 돌아가 산화된다. 이 왕복(셔틀)은 전류를 낭비해 쿨롱 효율을 낮추고, 활물질 손실과 리튬 음극 부식을 일으킨다.
    - heading: "그 밖의 과제와 대응"
      body: >-
        황과 Li₂S는 전자와 이온을 거의 통하지 않아 다공성 탄소에 담아야 하고, 방전 시 부피가 약 80% 늘어난다. LiNO₃ 첨가제로 리튬 표면에 보호막을 만들고,
        폴리설파이드를 붙잡는 극성 호스트나 촉매, 차단층을 쓴다. 전해질 양을 줄이면 에너지 밀도는 오르지만 셔틀과 반응 속도 문제가 더 심해진다.
  formula: |
    S8 + 16Li⁺ + 16e⁻ → 8Li2S
    이론 용량 = 2 × 96485 / (3.6 × 32.06) ≈ 1,672 mAh/g (S 기준)
  example: >-
    코인셀에서는 전해질을 넉넉히 넣어 좋은 수명이 나오지만, 실제 파우치 셀처럼 전해질/황 비율을 낮추면 수명이 급격히 줄어드는 경우가 많다.
    그래서 논문을 볼 때는 황 로딩과 전해질 양을 꼭 확인해야 한다.
  misconception: >-
    황 기준 용량이 크다고 셀 에너지 밀도가 그만큼 높은 것은 아니다. 탄소 호스트, 과량의 전해질, 리튬 금속 여유분까지 포함하면 셀 수준 이득은 훨씬 작다.
  connection: >-
    폴리설파이드를 잘 붙잡는 호스트 소재를 찾기 위해 흡착 에너지를 DFT로 계산하고, 그 데이터를 학습한 모델로 후보를 빠르게 스크리닝하는 연구가 있다.
  quiz:
    question: "리튬-황 전지에서 셔틀 현상을 일으키는 물질은?"
    choices: ["전해질에 녹는 긴 사슬 폴리설파이드", "Li₂S 고체", "탄소 호스트", "LiNO₃"]
    answer_index: 0
    explanation: "녹는 Li₂Sₙ(n≈4~8)이 양극과 음극을 오가며 산화·환원되어 전류를 낭비하고 활물질을 잃게 한다."
  keywords:
    - {ko: "폴리설파이드", en: "polysulfide"}
    - {ko: "셔틀 효과", en: "shuttle effect"}
    - {ko: "황 로딩", en: "sulfur loading"}
  next_topics: ["리튬 금속 음극과 덴드라이트", "쿨롱 효율과 에너지 효율"]
  references: ["A. Manthiram, Y. Fu, S.-H. Chung, C. Zu, Y.-S. Su, Rechargeable lithium–sulfur batteries, Chemical Reviews, 2014"]
