# 배터리 › 전기화학 공부 노트

- concept: "네른스트 식과 평형 전위"
  title: "네른스트 식: 농도가 전위를 바꾸는 방법"
  level: 입문
  one_liner: >-
    네른스트 식은 반응물과 생성물의 활동도(농도)에 따라 전극의 평형 전위가 표준 전위에서 얼마나 벗어나는지를 알려 준다.
  sections:
    - heading: "식의 의미"
      body: >-
        전류가 흐르지 않는 평형 상태에서 전극 전위는 반응의 깁스 자유 에너지 변화로 정해진다(ΔG = −nFE). 표준 상태(활동도 1)에서의 전위가 표준 전위 E°이고,
        실제 농도가 다르면 반응 지수 Q만큼 보정된다. 이것이 네른스트 식이다. 25 °C에서 전자 1개 반응이면 농도가 10배 바뀔 때 전위가 약 59 mV 바뀐다.
    - heading: "배터리에서"
      body: >-
        삽입형 전극에서는 '농도' 대신 전극 안의 리튬 함량(x)이 전위를 정한다. 리튬이 이상적으로 섞인다면 전위는 ln[x/(1−x)]에 비례해 변하지만,
        실제 소재는 리튬 사이 상호작용과 상전이 때문에 이 형태에서 크게 벗어난다. 그래서 OCV 곡선의 모양 자체가 소재의 열역학 정보를 담고 있다.
    - heading: "한계"
      body: >-
        네른스트 식은 평형 상태만 다룬다. 전류가 흐르면 반응 속도와 물질 전달 때문에 과전압이 생기고, 이는 버틀러-볼머 식과 확산 방정식이 다룬다.
        또 실제 계에서는 농도 대신 활동도를 써야 하며, 고농도 전해질에서는 둘의 차이가 크다.
  formula: |
    E = E° − (RT / nF) · ln Q
    25 °C: E = E° − (0.0592 / n) · log10 Q  [V]
  example: >-
    Li/Li⁺ 기준 전극의 전위도 전해질의 리튬 이온 활동도에 따라 조금 달라진다. 그래서 전해질이 다르면 같은 'vs Li/Li⁺' 값이라도 수십 mV 차이가 날 수 있다.
  misconception: >-
    셀 전압이 높을수록 반응이 빠르다고 생각하기 쉽지만, 네른스트 식이 정하는 것은 열역학적 구동력일 뿐 반응 속도는 별개다.
  connection: >-
    OCV 곡선을 열역학 모델(예: 격자 기체 모델)과 신경망을 결합해 맞추면, 적은 데이터로도 소재의 SOC-OCV 관계를 정확히 표현하는 물리 정보 모델을 만들 수 있다.
  quiz:
    question: "25 °C, 1전자 반응에서 반응 지수 Q가 10배 커지면 전위는 대략 얼마나 변하나?"
    choices: ["약 5.9 mV 감소", "약 59 mV 감소", "약 590 mV 감소", "변하지 않음"]
    answer_index: 1
    explanation: "E = E° − 0.0592·log Q이므로 Q가 10배면 약 59 mV 감소한다."
  keywords:
    - {ko: "네른스트 식", en: "Nernst equation"}
    - {ko: "평형 전위", en: "equilibrium potential"}
    - {ko: "활동도", en: "activity"}
  next_topics: ["버틀러-볼머 식과 교환 전류 밀도", "OCV, 엔트로피 계수, 가역 발열"]
  references: ["A. J. Bard, L. R. Faulkner, Electrochemical Methods: Fundamentals and Applications, 2nd ed., 2001"]

- concept: "버틀러-볼머 식과 교환 전류 밀도"
  title: "버틀러-볼머 식: 전극 반응 속도는 과전압에 지수적으로 반응한다"
  level: 중급
  one_liner: >-
    전극 반응의 알짜 전류는 산화·환원 두 방향 속도의 차이이고, 과전압이 커질수록 한쪽이 지수적으로 우세해진다.
  sections:
    - heading: "정의"
      body: >-
        버틀러-볼머 식은 전하전달이 속도를 결정할 때 전극 전류 밀도와 과전압(η)의 관계를 나타낸다. 평형 전위에서는 산화 전류와 환원 전류가 같아 알짜 전류가 0이지만,
        두 방향 반응은 계속 일어나고 있다. 이때 한 방향의 전류 크기를 교환 전류 밀도(i₀)라고 한다.
    - heading: "원리"
      body: >-
        전위를 바꾸면 산화와 환원의 활성화 에너지 장벽이 서로 반대 방향으로 기울어진다. 전달 계수(α)는 이 전위 변화가 장벽을 얼마나 낮추는지를 나타내며,
        보통 0.5 근처로 가정한다. 그래서 η가 작을 때는 전류가 η에 거의 비례하고(선형 영역), η가 크면 한쪽 항만 남아 로그 관계(타펠 영역)가 된다.
    - heading: "배터리에서의 의미"
      body: >-
        i₀가 큰 전극은 같은 전류를 작은 과전압으로 흘릴 수 있다. 선형 영역에서 전하전달 저항은 R_ct = RT/(nF·i₀)로, EIS 반원의 지름과 연결된다.
        저온에서 i₀가 크게 줄어드는 것이 저온 출력 저하와 리튬 도금 위험의 한 원인이다.
  formula: |
    i = i₀ · [exp(α_a·F·η / RT) − exp(−α_c·F·η / RT)]
    작은 η: i ≈ i₀·F·η / RT  →  R_ct = RT / (n·F·i₀)
  example: >-
    같은 셀을 25 °C와 −10 °C에서 EIS로 측정하면 −10 °C에서 전하전달 반원이 훨씬 커진다. 여러 온도의 R_ct로 아레니우스 플롯을 그려 활성화 에너지를 구할 수 있다.
  misconception: >-
    과전압이 크다고 무조건 전하전달이 느린 것은 아니다. 전체 과전압에는 옴 저항과 농도(확산) 과전압도 섞여 있으니 측정법으로 나눠 봐야 한다.
  connection: >-
    DFN 같은 물리 기반 모델은 입자 표면마다 버틀러-볼머 식을 쓰고, 이를 신경망과 결합한 하이브리드 모델로 배터리 상태를 추정하는 연구가 많다.
  quiz:
    question: "교환 전류 밀도 i₀가 커지면 전하전달 저항 R_ct는?"
    choices: ["커진다", "작아진다", "변하지 않는다", "온도와만 관련 있다"]
    answer_index: 1
    explanation: "R_ct = RT/(nF·i₀)이므로 i₀가 클수록 R_ct는 작아진다."
  keywords:
    - {ko: "교환 전류 밀도", en: "exchange current density"}
    - {ko: "전달 계수", en: "transfer coefficient"}
    - {ko: "전하전달 저항", en: "charge-transfer resistance"}
  next_topics: ["타펠 식과 타펠 기울기", "전기화학 임피던스 분광법(EIS)과 등가회로"]
  references: ["A. J. Bard, L. R. Faulkner, Electrochemical Methods: Fundamentals and Applications, 2nd ed., 2001"]

- concept: "타펠 식과 타펠 기울기"
  title: "타펠 식: 로그 그래프에서 반응 속도 읽기"
  level: 중급
  one_liner: >-
    과전압이 충분히 크면 버틀러-볼머 식의 한쪽 항만 남아 과전압이 전류의 로그에 비례하며, 그 기울기(타펠 기울기)로 반응 메커니즘과 교환 전류를 알 수 있다.
  sections:
    - heading: "유도"
      body: >-
        과전압 η가 RT/F(25 °C에서 약 26 mV)보다 몇 배 크면 버틀러-볼머 식에서 반대 방향 항은 무시할 만큼 작아진다. 그러면 η = a + b·log|i| 꼴의 직선 관계가 되는데,
        이것이 타펠 식이다. 1905년 타펠이 실험으로 먼저 찾은 관계가 이후 이론으로 설명되었다.
    - heading: "타펠 그래프 읽기"
      body: >-
        가로축에 log|i|, 세로축에 η를 그리면 높은 과전압 영역이 직선이 된다. 기울기 b = 2.303RT/(αnF)이며, α = 0.5, n = 1이면 25 °C에서 약 118 mV/decade다.
        직선을 η = 0까지 연장해 만나는 전류가 교환 전류 밀도 i₀다.
    - heading: "쓰임과 주의"
      body: >-
        타펠 기울기는 전기촉매(산소 발생·환원 등) 연구에서 반응 메커니즘의 속도 결정 단계를 추정하는 데 많이 쓰인다. 배터리 전극에서는 과전압이 커지면
        확산 한계가 먼저 나타나 깨끗한 타펠 영역을 얻기 어려운 경우가 많다. 측정 전에 옴 저항(iR) 보정이 필요하다.
  formula: |
    η = (2.303·RT / α·n·F) · log10(|i| / i₀)
    타펠 기울기 b = 2.303RT/(αnF) ≈ 118 mV/dec (α=0.5, n=1, 25 °C)
  example: >-
    리튬 금속 대칭 셀에서 전류를 단계적으로 바꾸며 과전압을 측정해 타펠 그래프를 그리면, 전해질에 따른 교환 전류 밀도 차이를 비교할 수 있다.
  misconception: >-
    타펠 기울기가 작을수록 촉매가 좋다는 해석은 같은 조건에서 비교할 때만 의미가 있다. iR 보정을 하지 않으면 기울기가 크게 왜곡된다.
  connection: >-
    전기촉매 데이터베이스의 타펠 기울기와 과전압을 표적값으로 삼아, 표면 흡착 에너지 같은 서술자로 촉매 성능을 예측하는 머신러닝 연구가 많다.
  quiz:
    question: "타펠 그래프에서 직선을 η=0까지 연장한 전류는 무엇인가?"
    choices: ["한계 전류", "교환 전류 밀도", "단락 전류", "누설 전류"]
    answer_index: 1
    explanation: "η = b·log(i/i₀)이므로 η=0이 되는 전류가 i₀, 즉 교환 전류 밀도다."
  keywords:
    - {ko: "타펠 기울기", en: "Tafel slope"}
    - {ko: "iR 보정", en: "iR compensation"}
    - {ko: "속도 결정 단계", en: "rate-determining step"}
  next_topics: ["과전압의 종류(활성화·농도·저항)", "순환 전압전류법(CV)"]
  references: []

- concept: "과전압의 종류(활성화·농도·저항)"
  title: "과전압의 세 얼굴: 활성화·농도·저항"
  level: 입문
  one_liner: >-
    전류가 흐를 때 셀 전압이 평형값에서 벗어나는 정도(과전압)는 옴 저항, 반응 활성화, 농도 구배라는 세 원인으로 나누어 볼 수 있다.
  sections:
    - heading: "저항 과전압"
      body: >-
        전해질, 전극, 집전체, 접촉면의 저항 때문에 생기는 전압 강하로, 옴의 법칙(η = iR)을 따른다. 전류를 바꾸는 순간 바로 나타나고 바로 사라진다.
        전해질 전도도를 높이거나 전극을 얇게 하면 줄일 수 있다.
    - heading: "활성화 과전압"
      body: >-
        전극 표면에서 전자가 오가고 리튬이 탈용매화·삽입되는 반응에도 에너지 장벽이 있다. 이 장벽을 넘기 위해 필요한 추가 전압이 활성화 과전압이며
        버틀러-볼머 식으로 기술한다. 온도가 낮을수록, 반응 면적이 작을수록 커진다.
    - heading: "농도 과전압"
      body: >-
        반응이 계속되면 전극 표면 근처의 리튬 이온이 고갈되거나 쌓여 농도 구배가 생긴다. 표면 농도가 벌크와 달라지면 네른스트 식에 따라 전위가 바뀌는데,
        이것이 농도 과전압이다. 전해질 속과 활물질 입자 속 모두에서 생기며, 시간이 지날수록 커지고 휴지하면 천천히 회복된다.
  formula: |
    V_charge = OCV + η_ohm + η_act + η_conc
    V_discharge = OCV − η_ohm − η_act − η_conc
  example: >-
    방전 중 전류를 끊으면 전압이 즉시 일부 회복(옴 저항)되고, 이어서 수 초 안에 조금 더(활성화), 그리고 수 분~수 시간에 걸쳐 천천히(확산) 회복된다.
    이 회복 곡선을 보면 과전압의 비율을 대략 나눌 수 있다.
  misconception: >-
    과전압 손실은 모두 열로 바뀌므로, 급속 충방전에서 셀이 뜨거워지는 주된 이유다. 반대로 과전압이 작다고 반응이 없는 것은 아니다.
  connection: >-
    펄스 시험의 전압 응답을 등가회로 파라미터로 바꾸는 과정을 신경망으로 자동화해, 차량 BMS에서 실시간으로 저항 증가(SOH)를 추정하는 연구가 있다.
  quiz:
    question: "전류를 끊은 직후 '즉시' 회복되는 전압은 어떤 과전압에 해당하나?"
    choices: ["농도 과전압", "옴(저항) 과전압", "활성화 과전압", "엔트로피 과전압"]
    answer_index: 1
    explanation: "옴 과전압(iR)은 시간 지연 없이 전류에 비례하므로 전류를 끊는 순간 사라진다."
  keywords:
    - {ko: "과전압", en: "overpotential"}
    - {ko: "농도 분극", en: "concentration polarization"}
    - {ko: "전압 완화", en: "voltage relaxation"}
  next_topics: ["Fick 확산과 고체 내 확산 계수", "GITT로 확산 계수 구하기"]
  references: []

- concept: "패러데이 법칙과 이론 용량 계산"
  title: "패러데이 법칙: 전하량으로 물질량을 센다"
  level: 입문
  one_liner: >-
    전극 반응에서 흐른 전하량은 반응한 물질의 몰수에 비례하며, 이를 이용해 소재의 이론 용량을 화학식만으로 계산할 수 있다.
  sections:
    - heading: "법칙"
      body: >-
        패러데이 법칙은 전기분해로 바뀌는 물질의 양이 흐른 전하량에 비례한다는 것이다. 전자 1 mol의 전하량이 패러데이 상수 F ≈ 96,485 C/mol이다.
        따라서 n개의 전자가 관여하는 반응에서 물질 1 mol이 반응하려면 nF의 전하가 필요하다.
    - heading: "이론 용량 계산"
      body: >-
        배터리에서는 용량을 보통 mAh/g로 쓴다. 1 mAh = 3.6 C이므로 이론 용량은 nF/(3.6·M)이다. 예를 들어 LiCoO₂(M ≈ 97.9 g/mol)는 리튬 1개를 모두 빼면
        약 274 mAh/g다. 실제로는 구조 안정성 때문에 절반 정도(약 0.5개)만 써서 약 140 mAh/g 수준을 쓴다.
    - heading: "셀 용량과의 차이"
      body: >-
        소재의 이론 용량은 출발점일 뿐이다. 실제 셀 용량은 양극과 음극 중 작은 쪽, 첫 사이클 손실, 도전재·바인더·집전체·전해질·케이스 무게를 모두 반영해야 한다.
        그래서 셀 수준 에너지 밀도는 소재 이론값에서 계산한 값보다 훨씬 작다.
  formula: |
    Q_theo [mAh/g] = n · F / (3.6 · M)
    예) LiCoO2: 1 × 96485 / (3.6 × 97.9) ≈ 274 mAh/g
  example: >-
    흑연(LiC₆ 기준 72 g/mol의 C₆): 96485/(3.6 × 72.06) ≈ 372 mAh/g. 실리콘(Li₁₅Si₄): 약 3,580 mAh/g. 같은 공식으로 모든 소재를 비교할 수 있다.
  misconception: >-
    이론 용량은 반응식에 들어가는 '호스트' 물질 무게로 나눈 값이다. 리튬을 포함한 상태로 나누는지 아닌지에 따라 숫자가 달라지므로 기준을 확인해야 한다.
  connection: >-
    소재 데이터베이스에서 조성과 몰질량으로 이론 용량을 자동 계산해 후보를 걸러 내는 것은 머신러닝 스크리닝 파이프라인의 가장 기본적인 단계다.
  quiz:
    question: "1 mAh는 몇 쿨롱(C)인가?"
    choices: ["0.36 C", "3.6 C", "36 C", "3600 C"]
    answer_index: 1
    explanation: "1 mA × 1 h = 0.001 A × 3600 s = 3.6 C이다."
  keywords:
    - {ko: "패러데이 상수", en: "Faraday constant"}
    - {ko: "이론 용량", en: "theoretical capacity"}
    - {ko: "비용량", en: "specific capacity"}
  next_topics: ["쿨롱 효율과 에너지 효율", "층상 양극재 NCM의 구조와 니켈 함량"]
  references: []

- concept: "쿨롱 효율과 에너지 효율"
  title: "쿨롱 효율과 에너지 효율: 99.9%와 99.99%의 차이"
  level: 입문
  one_liner: >-
    쿨롱 효율은 넣은 전하 중 꺼낸 전하의 비율이고 에너지 효율은 전압 손실까지 포함한 비율로, 쿨롱 효율의 작은 차이가 장기 수명에서는 큰 차이를 만든다.
  sections:
    - heading: "쿨롱 효율"
      body: >-
        쿨롱 효율(CE)은 방전 용량을 충전 용량으로 나눈 값이다. 100%에 못 미치는 부분은 SEI 성장, 전해질 분해, 셔틀 반응처럼 리튬이나 전하를 소모하는 부반응을 뜻한다.
        상용 리튬이온 셀은 보통 99.9%를 넘고, 수천 사이클 수명을 위해서는 99.95% 이상이 필요하다.
    - heading: "에너지 효율"
      body: >-
        에너지 효율은 방전 에너지(∫V·I dt)를 충전 에너지로 나눈 값이다. 충전 전압이 방전 전압보다 높아서 생기는 전압 히스테리시스 손실이 더해지므로
        쿨롱 효율보다 낮다. 고출력 운전일수록 과전압이 커져 에너지 효율이 떨어진다.
    - heading: "작은 차이의 누적"
      body: >-
        CE가 일정하다고 가정하면 n사이클 후 남는 리튬 비율은 대략 CEⁿ이다. 99.9%면 500사이클 후 약 61%, 99.99%면 약 95%가 남는다.
        그래서 쿨롱 효율은 소수점 넷째 자리까지 정밀하게 재는 고정밀 충방전기가 쓰인다.
  formula: |
    CE = Q_discharge / Q_charge
    EE = E_discharge / E_charge = CE × (평균 방전 전압 / 평균 충전 전압)
    잔존 비율 ≈ CEⁿ
  example: >-
    리튬 금속 음극의 쿨롱 효율을 평가할 때는 구리 위에 리튬을 쌓았다가 벗겨내는 Li|Cu 셀을 쓴다. 이 값이 99% 수준이면 실용 수명에 크게 못 미친다.
  misconception: >-
    쿨롱 효율이 100%보다 높게 나오면 좋은 것이라고 착각하기 쉽지만, 대개 측정 오차나 이전 사이클에 쌓인 리튬이 돌아오는 현상, 셔틀 등의 신호다.
  connection: >-
    초기 수십 사이클의 고정밀 쿨롱 효율과 용량 변화 데이터로 수천 사이클 수명을 예측하는 머신러닝 연구가 있다(초기 데이터 기반 수명 예측).
  quiz:
    question: "쿨롱 효율 99.9%로 500사이클 돌리면 남는 리튬 비율은 대략?"
    choices: ["약 95%", "약 61%", "약 99%", "약 30%"]
    answer_index: 1
    explanation: "0.999⁵⁰⁰ ≈ e^(−0.5) ≈ 0.61. 작은 비효율도 사이클이 쌓이면 크게 누적된다."
  keywords:
    - {ko: "쿨롱 효율", en: "Coulombic efficiency"}
    - {ko: "에너지 효율", en: "energy efficiency"}
    - {ko: "전압 히스테리시스", en: "voltage hysteresis"}
  next_topics: ["포메이션 공정과 초기 쿨롱 효율", "사이클 수명 시험과 열화 모드 분리(LLI, LAM)"]
  references: ["A. J. Smith, J. C. Burns, S. Trussler, J. R. Dahn, Precision measurements of the coulombic efficiency of lithium-ion batteries and of electrode materials for lithium-ion batteries, J. Electrochem. Soc., 2010"]

- concept: "Fick 확산과 고체 내 확산 계수"
  title: "확산: 리튬이 입자 속을 이동하는 속도"
  level: 중급
  one_liner: >-
    리튬은 농도 구배를 따라 확산하며, 확산 시간은 거리의 제곱에 비례하므로 입자 크기를 절반으로 줄이면 확산 시간은 4분의 1이 된다.
  sections:
    - heading: "Fick 법칙"
      body: >-
        Fick 제1법칙은 확산 플럭스가 농도 구배에 비례한다는 것이고, 비례 상수가 확산 계수 D다. 제2법칙은 시간에 따른 농도 변화를 기술하는 편미분 방정식이다.
        충방전 중 활물질 입자 표면에서 리튬이 들어가거나 나가면 입자 안에 농도 구배가 생기고, 리튬은 이를 따라 안쪽으로 퍼진다.
    - heading: "특성 시간"
      body: >-
        확산의 특성 시간은 대략 τ ≈ L²/D이다. 고체 전극 소재의 D는 대략 10⁻⁸~10⁻¹⁴ cm²/s로 범위가 매우 넓다. 예를 들어 D = 10⁻¹⁰ cm²/s, 반지름 5 μm인 입자는
        τ ≈ (5×10⁻⁴)²/10⁻¹⁰ = 2,500 s 정도로, 40분 남짓이다. 이보다 빨리 충방전하면 입자 중심까지 리튬이 다 채워지지 못한다.
    - heading: "의미"
      body: >-
        확산이 느리면 높은 전류에서 입자 표면만 먼저 꽉 차거나 비어 전압이 차단 전압에 일찍 도달하고, 쓸 수 있는 용량이 줄어든다. 그래서 확산이 느린 소재는
        입자를 작게 만든다. 확산 계수는 리튬 함량에 따라 크게 변하므로, 하나의 숫자로 소재를 대표하는 데는 주의가 필요하다.
  formula: |
    Fick 1법칙: J = −D · ∂c/∂x
    Fick 2법칙(구형 입자): ∂c/∂t = D · (1/r²) ∂/∂r (r² ∂c/∂r)
    특성 시간: τ ≈ L² / D
  example: >-
    LFP는 확산이 느려 입자를 100 nm 안팎으로 작게 만든다. 반지름을 5 μm에서 100 nm로 줄이면 확산 시간은 (50)² = 2,500배 짧아진다.
  misconception: >-
    문헌의 확산 계수가 몇 자릿수씩 다른 것은 측정 오류만이 아니라, 측정법(GITT, EIS, PITT)마다 가정과 유효 면적이 다르기 때문이다.
  connection: >-
    확산 방정식이 들어간 전기화학 모델을 PINN으로 풀거나, 측정 전압으로부터 확산 계수를 역추정하는 데 신경망 대리 모델을 쓰는 연구가 있다.
  quiz:
    question: "입자 반지름을 절반으로 줄이면 확산 특성 시간은?"
    choices: ["절반", "4분의 1", "2배", "변하지 않음"]
    answer_index: 1
    explanation: "τ ≈ L²/D이므로 L이 1/2이면 τ는 1/4이 된다."
  keywords:
    - {ko: "확산 계수", en: "diffusion coefficient"}
    - {ko: "Fick 법칙", en: "Fick's laws"}
    - {ko: "특성 확산 시간", en: "characteristic diffusion time"}
  next_topics: ["GITT로 확산 계수 구하기", "C-rate와 율속 특성"]
  references: []

- concept: "전기화학 창(electrochemical window)"
  title: "전기화학 창: 전해질이 버틸 수 있는 전압 범위"
  level: 중급
  one_liner: >-
    전기화학 창은 전해질이 산화도 환원도 되지 않고 안정하게 남는 전위 범위로, 그 밖에서 작동하는 전극은 보호막(SEI·CEI) 덕분에 쓸 수 있다.
  sections:
    - heading: "정의"
      body: >-
        전해질은 너무 낮은 전위에서는 환원되고 너무 높은 전위에서는 산화된다. 그 사이의 안정한 범위가 전기화학 창이다. 물은 열역학적으로 약 1.23 V 창을 가져
        고전압 전지에 쓰기 어렵고, 카보네이트 유기 전해질은 대략 1 V에서 4.5 V(vs Li/Li⁺) 정도까지 견딘다.
    - heading: "오비탈 그림"
      body: >-
        Goodenough가 제시한 그림에서는 전해질의 LUMO와 HOMO가 창의 경계를 정한다. 음극의 전자 에너지(페르미 준위)가 LUMO보다 높으면 전자가 전해질로 넘어가 환원이 일어나고,
        양극의 페르미 준위가 HOMO보다 낮으면 전해질에서 전자를 빼앗아 산화가 일어난다. 실제로는 분자 오비탈보다 용매화된 상태의 산화·환원 전위가 더 정확한 기준이다.
    - heading: "측정과 한계"
      body: >-
        선형 주사 전압전류법(LSV)으로 전류가 갑자기 늘어나는 전위를 찾아 창을 측정한다. 하지만 전극 소재(백금, 탄소 등)와 주사 속도, '전류가 늘었다'고 보는 기준에 따라 값이 달라진다.
        실제 전지 양극은 촉매처럼 작용해 측정값보다 낮은 전위에서 산화가 시작될 수 있다.
  formula: |
    안정 조건: μ_anode < LUMO,  μ_cathode > HOMO  (전자 에너지 기준)
    → 셀 개방 전압 eV_oc = μ_anode − μ_cathode ≤ E_gap(창 폭)
  example: >-
    흑연 음극(약 0.1 V)은 카보네이트 전해질의 환원 한계(약 0.8 V)보다 낮은 전위에서 작동하지만, 첫 충전에 생긴 SEI가 전자를 막아 계속 쓸 수 있다.
  misconception: >-
    전기화학 창이 넓은 전해질이 항상 좋은 것은 아니다. 창 밖에서라도 좋은 보호막을 만드는 전해질이 실제로는 더 잘 작동할 수 있다.
  connection: >-
    수많은 용매 분자의 산화·환원 전위를 DFT로 계산한 데이터셋으로 그래프 신경망을 학습시켜, 새 용매의 안정성을 빠르게 예측하는 연구가 있다.
  quiz:
    question: "흑연 음극이 전해질의 환원 한계 아래에서도 작동할 수 있는 이유는?"
    choices: ["흑연이 전해질을 산화시켜서", "SEI가 전자 이동을 막아서", "전해질이 고체라서", "흑연 전위가 4 V라서"]
    answer_index: 1
    explanation: "첫 충전 때 생긴 SEI가 전자를 막아 전해질이 더 이상 환원되지 않게 하는 '운동학적 안정화'가 일어난다."
  keywords:
    - {ko: "전기화학 창", en: "electrochemical stability window"}
    - {ko: "HOMO·LUMO", en: "HOMO/LUMO"}
    - {ko: "선형 주사 전압전류법", en: "linear sweep voltammetry"}
  next_topics: ["SEI(고체 전해질 계면)의 형성과 조성", "전기화학 퍼텐셜과 페르미 준위"]
  references: ["J. B. Goodenough, Y. Kim, Challenges for rechargeable Li batteries, Chemistry of Materials, 2010"]

- concept: "OCV, 엔트로피 계수, 가역 발열"
  title: "OCV와 엔트로피: 전지가 충전 중에 식기도 하는 이유"
  level: 심화
  one_liner: >-
    OCV의 온도 변화율(엔트로피 계수)은 반응 엔트로피를 알려 주며, 이것 때문에 전지는 전류 방향에 따라 열을 흡수하거나 내는 가역 발열을 보인다.
  sections:
    - heading: "OCV와 열역학"
      body: >-
        개방 회로 전압(OCV)은 충분히 휴지한 셀의 전압으로, 반응의 깁스 자유 에너지와 연결된다(ΔG = −nFE). 깁스 에너지는 엔탈피와 엔트로피로 나뉘므로,
        OCV를 온도에 대해 미분하면 반응 엔트로피를 얻는다. 이 값 ∂E/∂T를 엔트로피 계수라 한다.
    - heading: "가역 발열"
      body: >-
        셀의 발열은 과전압에 의한 비가역 발열(항상 양수)과 엔트로피 변화에 의한 가역 발열로 나뉜다. 가역 발열은 I·T·∂E/∂T로, 전류 방향과 엔트로피 계수의 부호에 따라
        열을 내기도 하고 흡수하기도 한다. 낮은 전류에서는 가역 발열 비중이 커서, 특정 SOC 구간에서 충전 중 셀 온도가 오히려 내려가는 현상이 관찰되기도 한다.
    - heading: "측정과 활용"
      body: >-
        SOC를 고정하고 온도를 몇 단계로 바꾸며 OCV를 측정하면 엔트로피 계수를 얻는다. 엔트로피 곡선에는 상전이와 리튬 배열 변화가 민감하게 드러나서,
        소재 분석과 열화 진단에도 쓰인다. 열 관리 시스템을 설계할 때도 이 값이 필요하다.
  formula: |
    ΔS = n·F · (∂E_ocv/∂T)
    발열(Bernardi): Q̇ = I·(E_ocv − V) − I·T·(∂E_ocv/∂T)   (방전 전류 I>0 기준)
  example: >-
    흑연 음극은 SOC에 따라 엔트로피 계수의 부호가 바뀐다. 그래서 셀 단위 엔트로피 곡선은 양극과 음극 곡선의 합으로 나타나고, 그 모양이 사이클에 따라 변하는 것으로 열화를 추적할 수 있다.
  misconception: >-
    전지 발열은 모두 저항 때문이라고 생각하기 쉽지만, 저전류에서는 가역 발열이 비가역 발열과 비슷하거나 더 클 수 있다.
  connection: >-
    셀 열 모델의 파라미터(엔트로피 계수, 열용량, 열저항)를 측정 데이터로부터 베이지안 추론으로 추정하면 불확실성까지 함께 얻을 수 있다.
  quiz:
    question: "엔트로피 계수 ∂E/∂T로 직접 알 수 있는 것은?"
    choices: ["옴 저항", "반응 엔트로피 변화", "확산 계수", "분리막 기공률"]
    answer_index: 1
    explanation: "ΔS = nF·∂E/∂T로, OCV의 온도 변화율은 반응 엔트로피와 바로 연결된다."
  keywords:
    - {ko: "개방 회로 전압", en: "open-circuit voltage"}
    - {ko: "엔트로피 계수", en: "entropy coefficient"}
    - {ko: "가역 발열", en: "reversible heat"}
  next_topics: ["네른스트 식과 평형 전위", "DSC·ARC 열안전성 평가"]
  references: []

- concept: "2전극·3전극 셀과 기준 전극"
  title: "기준 전극: 셀 전압 속에 숨은 전극 전위 보기"
  level: 입문
  one_liner: >-
    2전극 셀은 두 전극 전위의 차이만 보여 주지만, 전류가 흐르지 않는 기준 전극을 더한 3전극 셀은 각 전극의 전위를 따로 측정할 수 있게 한다.
  sections:
    - heading: "2전극 셀"
      body: >-
        코인셀이나 파우치 셀은 양극과 음극 두 전극만 있다. 측정되는 전압은 두 전극 전위의 차이와 그 사이 저항에 의한 강하를 모두 포함한다. 반쪽 셀(소재|리튬 금속)에서는
        리튬 금속을 상대 전극 겸 기준 전극으로 쓰는데, 리튬 금속의 과전압과 저항이 측정값에 섞이는 한계가 있다.
    - heading: "3전극 셀"
      body: >-
        작업 전극, 상대 전극, 기준 전극으로 이뤄진다. 전류는 작업 전극과 상대 전극 사이로만 흐르고, 기준 전극은 전류가 거의 흐르지 않아 전위가 일정하게 유지된다.
        따라서 작업 전극 전위를 기준 전극 대비로 정확히 잴 수 있다. 풀셀에 기준 전극을 넣으면 충전 중 음극 전위가 0 V 아래로 내려가는지(리튬 도금 위험)도 볼 수 있다.
    - heading: "기준 전극의 조건과 주의"
      body: >-
        좋은 기준 전극은 전위가 안정하고 재현성이 좋아야 한다. 리튬 금속, 리튬화한 LTO나 LFP, 금 선에 리튬을 입힌 전극 등이 쓰인다. 기준 전극의 위치가 전류 경로와 비대칭이면
        EIS에서 가짜 신호(유도성 루프 등)가 나타날 수 있어 배치가 중요하다.
  formula: |
    V_cell = φ_cathode − φ_anode
    3전극: φ_WE vs RE 를 직접 측정 (I_RE ≈ 0)
  example: >-
    급속 충전 프로토콜을 개발할 때 기준 전극을 넣은 풀셀로 충전 중 음극 전위를 실시간 감시하며, 음극 전위가 약 0 V에 가까워지면 전류를 줄이는 방식으로 조건을 찾는다.
  misconception: >-
    반쪽 셀의 전압이 곧 작업 전극의 전위라고 보기 쉽지만, 상대 전극인 리튬 금속의 과전압이 함께 측정된다. 특히 높은 전류나 EIS에서 오차가 커진다.
  connection: >-
    3전극 실험으로 얻은 전극별 전위 데이터는 2전극 데이터만으로 음극 전위를 추정하는 머신러닝 모델의 학습 정답(label)으로 쓰인다.
  quiz:
    question: "3전극 셀에서 기준 전극에 대한 설명으로 옳은 것은?"
    choices: ["가장 큰 전류가 흐른다", "전류가 거의 흐르지 않아 전위가 일정하다", "항상 백금이어야 한다", "셀 전압을 높여 준다"]
    answer_index: 1
    explanation: "기준 전극에는 전류가 거의 흐르지 않아 분극되지 않으므로 안정한 전위 기준이 된다."
  keywords:
    - {ko: "기준 전극", en: "reference electrode"}
    - {ko: "작업 전극", en: "working electrode"}
    - {ko: "반쪽 셀", en: "half cell"}
  next_topics: ["리튬 도금(lithium plating)", "계면 저항의 분리와 해석"]
  references: []

- concept: "이온 전도도와 리튬 이온 전이수"
  title: "전이수: 전류 중 리튬이 실어 나르는 몫"
  level: 중급
  one_liner: >-
    전해질 전도도는 모든 이온의 기여를 합한 것이고, 그중 리튬 이온이 운반하는 비율이 전이수(t₊)로, 액체 전해질에서는 보통 0.2~0.4에 불과하다.
  sections:
    - heading: "전도도"
      body: >-
        이온 전도도는 이온의 농도, 전하, 이동도의 곱을 모든 이온에 대해 더한 값이다. 염 농도를 높이면 운반자가 늘어 전도도가 오르다가, 점도 증가와 이온쌍 형성 때문에
        일정 농도(카보네이트 전해질에서 대략 1 M 부근)에서 최대가 되고 다시 줄어든다.
    - heading: "전이수"
      body: >-
        리튬염 전해질에서는 Li⁺와 음이온(PF₆⁻ 등)이 모두 움직인다. 리튬 이온은 용매 껍질이 커서 오히려 음이온보다 느린 경우가 많아, 전체 전류 중 리튬이 나르는 비율 t₊가 작다.
        전지에서 실제로 반응하는 것은 리튬뿐이므로, 음이온이 나른 몫은 전극 근처에 농도 구배를 만든다.
    - heading: "왜 중요한가"
      body: >-
        t₊가 작으면 높은 전류에서 전해질 안에 큰 농도 구배가 생겨 농도 과전압이 커지고, 심하면 음극 근처 염이 고갈된다. 두꺼운 전극과 급속 충전에서 특히 문제다.
        고체 전해질이나 단일 이온 전도 고분자는 t₊가 1에 가까워 이 문제가 적다.
  formula: |
    σ = Σ zᵢ · F · cᵢ · uᵢ   (u: 이동도)
    t₊ = σ₊ / σ = 리튬이 운반한 전류 비율
    브루스-빈센트 법: t₊ = I_ss(ΔV − I₀R₀) / [I₀(ΔV − I_ssR_ss)]
  example: >-
    리튬 대칭 셀에 작은 전압을 걸고 전류가 초기값에서 정상 상태로 줄어드는 정도를 EIS와 함께 측정하면, 브루스-빈센트 방법으로 t₊를 구할 수 있다.
  misconception: >-
    전도도가 높은 전해질이 항상 고출력에 유리한 것은 아니다. 전도도가 높아도 t₊가 작으면 급속 충전에서 농도 분극이 커질 수 있다.
  connection: >-
    분자동역학 시뮬레이션 결과로 전도도와 전이수를 예측하는 모델을 학습해, 실험 전에 염·용매 조합을 고르는 데이터 기반 전해질 설계가 이루어진다.
  quiz:
    question: "액체 전해질에서 리튬 이온 전이수가 작은 주된 이유는?"
    choices: ["리튬 이온이 용매 껍질 때문에 크고 느려서", "리튬 이온이 움직이지 않아서", "음이온이 없어서", "전자가 이온을 대신해서"]
    answer_index: 0
    explanation: "Li⁺는 여러 용매 분자에 둘러싸여 유효 크기가 커서 음이온보다 느리게 움직이는 경우가 많다."
  keywords:
    - {ko: "이온 전도도", en: "ionic conductivity"}
    - {ko: "전이수", en: "transference number"}
    - {ko: "농도 분극", en: "concentration polarization"}
  next_topics: ["과전압의 종류(활성화·농도·저항)", "C-rate와 율속 특성"]
  references: ["P. G. Bruce, C. A. Vincent, Steady state current flow in solid binary electrolyte cells, J. Electroanal. Chem., 1987"]

- concept: "C-rate와 율속 특성"
  title: "C-rate: 1시간에 다 쓰는 전류가 1C"
  level: 입문
  one_liner: >-
    C-rate는 셀 용량을 기준으로 전류 크기를 나타내는 단위로, 1C는 정격 용량을 1시간에 충전 또는 방전하는 전류다.
  sections:
    - heading: "정의"
      body: >-
        용량 3 Ah 셀에서 1C는 3 A, 2C는 6 A, C/10(0.1C)은 0.3 A다. 이론적으로 1C로 방전하면 1시간, 2C면 30분, C/10이면 10시간이 걸린다.
        크기가 다른 셀이나 소재를 같은 조건으로 비교하기 위해 쓴다. 소재 연구에서는 '1C = 특정 mA/g'처럼 기준 용량을 따로 정해 쓰기도 한다.
    - heading: "율속 특성"
      body: >-
        C-rate를 높이면 과전압이 커져 전압이 차단 전압에 일찍 도달하므로 꺼낼 수 있는 용량이 줄어든다. 여러 C-rate에서 얻는 용량을 비교한 것이 율속 특성(rate capability)이다.
        저항, 확산, 전해질 농도 분극 중 무엇이 병목인지에 따라 줄어드는 양상이 다르다.
    - heading: "전극 설계와의 관계"
      body: >-
        에너지 밀도를 높이려고 전극을 두껍게 만들면 이온이 이동할 거리가 길어져 율속 특성이 나빠진다. 그래서 에너지형 셀과 출력형 셀은 같은 소재라도 전극 두께,
        기공률, 입자 크기가 다르다. 실제 활용에서는 충전 C-rate가 리튬 도금 위험과 직결된다.
  formula: |
    I [A] = C-rate × Q_nominal [Ah]
    방전 시간(이상적) ≈ 1 / C-rate [h]
  example: >-
    율속 시험에서는 보통 C/10, C/5, C/2, 1C, 2C, 5C 순서로 몇 사이클씩 돌린 뒤 다시 C/10으로 돌아와, 용량이 회복되는지로 고율 시험 중 손상이 생겼는지 확인한다.
  misconception: >-
    1C 방전이 정확히 1시간 걸리는 것은 아니다. 과전압 때문에 용량을 다 못 꺼내서 대개 1시간보다 짧다.
  connection: >-
    충전 C-rate를 SOC에 따라 바꾸는 다단계 충전 프로토콜의 최적 조합을 베이지안 최적화와 수명 예측 모델로 찾은 연구가 잘 알려져 있다.
  quiz:
    question: "용량 5 Ah 셀을 0.5C로 충전하는 전류는?"
    choices: ["0.5 A", "2.5 A", "5 A", "10 A"]
    answer_index: 1
    explanation: "I = 0.5 × 5 Ah = 2.5 A이며, 이상적으로 약 2시간이 걸린다."
  keywords:
    - {ko: "C-rate", en: "C-rate"}
    - {ko: "율속 특성", en: "rate capability"}
    - {ko: "후막 전극", en: "thick electrode"}
  next_topics: ["Fick 확산과 고체 내 확산 계수", "리튬 도금(lithium plating)"]
  references: ["P. M. Attia et al., Closed-loop optimization of fast-charging protocols for batteries with machine learning, Nature, 2020"]

- concept: "상전이 반응 vs 고용체 반응의 전압 곡선"
  title: "평탄 vs 경사: 전압 곡선 모양으로 반응 종류 읽기"
  level: 중급
  one_liner: >-
    두 상이 공존하는 2상 반응은 전압이 평탄하고, 리튬이 한 상 안에서 연속적으로 섞이는 고용체 반응은 전압이 리튬 함량에 따라 비스듬히 변한다.
  sections:
    - heading: "깁스 상률로 보는 평탄 구간"
      body: >-
        온도와 압력이 일정할 때 두 상(예: LiFePO₄와 FePO₄)이 평형으로 공존하면 자유도가 없어 리튬의 화학 퍼텐셜이 고정된다. 리튬 함량이 바뀌어도 두 상의 비율만 바뀌므로
        전압이 일정하게 유지된다. LFP의 약 3.4 V 평탄 구간과 흑연의 스테이징 평탄 구간이 대표적이다.
    - heading: "고용체 반응"
      body: >-
        NCM처럼 리튬이 한 결정 구조 안에서 빈자리를 연속적으로 채우는 경우, 리튬 함량이 바뀔 때마다 화학 퍼텐셜도 변해 전압이 경사지게 바뀐다.
        리튬 사이 상호작용이 클수록 곡선 모양이 이상적인 로그 형태에서 벗어나고, 리튬이 정렬하는 조성에서는 작은 계단이 생기기도 한다.
    - heading: "진단에서의 의미"
      body: >-
        평탄한 곡선은 출력이 안정적이지만 전압으로 SOC를 추정하기 어렵다. 경사진 곡선은 SOC 추정에 유리하다. dQ/dV로 바꾸면 평탄 구간은 날카로운 피크가 되고
        경사 구간은 넓은 바닥으로 나타나, 반응 종류와 열화를 구분하는 데 쓴다.
  formula: |
    E = −(1/F) · ∂G/∂x  (x: 리튬 함량)
    2상 공존: ∂²G/∂x² 영역을 공통 접선이 잇는 구간 → E 일정
  example: >-
    LFP와 NCM 셀의 방전 곡선을 겹쳐 보면 LFP는 넓은 구간에서 거의 수평이고, NCM은 4.2 V에서 3.0 V까지 비스듬히 내려간다. 같은 전압 변화가 의미하는 SOC 변화가 전혀 다르다.
  misconception: >-
    2상 반응 소재도 나노 입자에서는 고용체처럼 반응하는 경로가 생길 수 있다. 입자 크기와 전류에 따라 반응 경로가 달라진다는 연구가 있다.
  connection: >-
    전압 곡선에서 평탄·경사 구간을 자동으로 찾고 특징을 뽑아 소재를 분류하거나 열화를 진단하는 신호 처리·머신러닝 파이프라인에서 이 구분이 기본이 된다.
  quiz:
    question: "2상 공존 구간에서 전압이 거의 일정한 이유는?"
    choices: ["저항이 0이라서", "상률에 따라 리튬 화학 퍼텐셜이 고정되어서", "전류가 흐르지 않아서", "온도가 올라가서"]
    answer_index: 1
    explanation: "두 상이 평형 공존하면 자유도가 없어 리튬 화학 퍼텐셜이 고정되고, 상 비율만 바뀐다."
  keywords:
    - {ko: "2상 반응", en: "two-phase reaction"}
    - {ko: "고용체 반응", en: "solid-solution reaction"}
    - {ko: "깁스 상률", en: "Gibbs phase rule"}
  next_topics: ["올리빈 구조 LFP 양극재", "dQ/dV 미분 용량 분석"]
  references: []

- concept: "뉴먼(Doyle-Fuller-Newman) 모델의 기본 가정"
  title: "DFN 모델: 다공성 전극을 1차원 + 입자로 나눠 보기"
  level: 심화
  one_liner: >-
    DFN(P2D) 모델은 전극을 두께 방향 1차원 다공성 매질로 보고, 각 지점에 구형 입자를 붙여 전해질 이동, 고체 확산, 계면 반응을 함께 푸는 물리 기반 전지 모델이다.
  sections:
    - heading: "구조: 의사 2차원"
      body: >-
        x축은 음극-분리막-양극을 지나는 두께 방향이고, 각 x 위치마다 반지름 방향 r축을 가진 대표 구형 입자가 있다. 그래서 의사 2차원(P2D) 모델이라 부른다.
        다공성 전극 이론으로 고체와 전해질이 같은 공간을 나눠 쓴다고 보고 평균화한 식을 쓴다.
    - heading: "푸는 식들"
      body: >-
        (1) 입자 안 리튬 확산(Fick), (2) 전해질 속 리튬 농도 보존(확산 + 이동, 전이수 포함), (3) 고체 전위의 옴 법칙, (4) 전해질 전위(농도 효과 포함한 옴 법칙),
        (5) 입자 표면의 버틀러-볼머 반응. 이 다섯 묶음이 서로 연결된 비선형 편미분 방정식이 된다.
    - heading: "주요 가정과 단순화"
      body: >-
        입자는 같은 크기의 구, 전극은 두께 방향으로만 변하고, 전해질은 묽은(또는 농도 보정한) 이원 전해질로 본다. 온도는 보통 일정하다고 두거나 열 모델과 따로 연결한다.
        더 빠르게 계산하려고 전해질 변화를 무시하면 단일 입자 모델(SPM)이 된다. 파라미터가 수십 개라 측정과 추정이 큰 과제다.
  formula: |
    고체: ∂c_s/∂t = (D_s/r²)·∂/∂r(r²·∂c_s/∂r)
    전해질: ε·∂c_e/∂t = ∂/∂x(D_eff·∂c_e/∂x) + (1−t₊)·a·j
    계면: j = (i₀/F)·[exp(α_aFη/RT) − exp(−α_cFη/RT)]
  example: >-
    오픈소스 PyBaMM을 쓰면 DFN·SPM 모델을 몇 줄 코드로 만들고, 파라미터 세트를 바꿔 방전 곡선과 전해질 농도 분포를 그려 볼 수 있다.
  misconception: >-
    DFN 모델이 정확하다고 해서 모든 열화를 설명하는 것은 아니다. 기본 모델에는 SEI 성장, 리튬 도금, 입자 균열이 없고, 이를 추가 하위 모델로 붙여야 한다.
  connection: >-
    DFN은 계산이 무거워 BMS에서 실시간으로 쓰기 어렵다. 그래서 DFN 시뮬레이션 데이터로 학습한 신경망 대리 모델이나 PINN이 빠른 대안으로 연구된다.
  quiz:
    question: "DFN 모델에서 전해질 변화를 무시하고 전극마다 입자 하나로 단순화한 모델은?"
    choices: ["등가회로 모델", "단일 입자 모델(SPM)", "위상장 모델", "분자동역학"]
    answer_index: 1
    explanation: "전해질 농도·전위 변화를 무시하고 전극당 대표 입자 하나만 푸는 것이 단일 입자 모델이다."
  keywords:
    - {ko: "의사 2차원 모델", en: "pseudo-two-dimensional model"}
    - {ko: "다공성 전극 이론", en: "porous electrode theory"}
    - {ko: "단일 입자 모델", en: "single particle model"}
  next_topics: ["물리 정보 신경망(PINN)", "Fick 확산과 고체 내 확산 계수", "버틀러-볼머 식과 교환 전류 밀도"]
  references: ["M. Doyle, T. F. Fuller, J. Newman, Modeling of galvanostatic charge and discharge of the lithium/polymer/insertion cell, J. Electrochem. Soc., 1993"]

- concept: "전기화학 퍼텐셜과 페르미 준위"
  title: "전기화학 퍼텐셜: 전압의 정체"
  level: 심화
  one_liner: >-
    셀 전압은 두 전극에 있는 전자의 전기화학 퍼텐셜(페르미 준위) 차이를 전하로 나눈 값이며, 이온의 이동은 이온의 전기화학 퍼텐셜 구배가 이끈다.
  sections:
    - heading: "화학 퍼텐셜과 전기화학 퍼텐셜"
      body: >-
        화학 퍼텐셜 μ는 입자 하나(또는 1 mol)를 더할 때 자유 에너지가 얼마나 변하는지다. 하전 입자는 전위 φ가 있는 곳에서 zeφ만큼 에너지가 더해지므로
        전기화학 퍼텐셜 μ̃ = μ + zFφ를 쓴다. 평형에서는 서로 오갈 수 있는 모든 입자의 μ̃가 같아진다.
    - heading: "페르미 준위와 셀 전압"
      body: >-
        전자의 전기화학 퍼텐셜이 페르미 준위다. 전압계는 두 전극의 페르미 준위 차이를 잰다: eV = μ̃_e(음극) − μ̃_e(양극). 그래서 셀 전압은 내부 전위(φ) 차이가 아니라
        전자의 전기화학 퍼텐셜 차이라는 점이 중요하다.
    - heading: "리튬으로 다시 쓰기"
      body: >-
        평형에서 Li ⇌ Li⁺ + e⁻이므로 μ_Li = μ̃_Li⁺ + μ̃_e이다. 전해질에서 Li⁺의 μ̃는 양쪽 전극 계면에서 같으므로, 셀 전압은 두 전극에서의 리튬 화학 퍼텐셜 차이로도 표현된다.
        OCV 곡선이 소재 안 리튬의 화학 퍼텐셜 곡선이라는 해석이 여기서 나온다.
  formula: |
    μ̃ᵢ = μᵢ + zᵢ·F·φ
    셀 전압: V = −[μ_Li(양극) − μ_Li(음극)] / F
  example: >-
    같은 리튬 화학 퍼텐셜이라도 표면에 쌍극자층이 생기면 내부 전위는 바뀌지만 셀 전압은 변하지 않는다. 그래서 전극 사이 '전위차'와 '측정 전압'을 구분해야 한다.
  misconception: >-
    셀 전압이 전극 사이 정전기 전위 차이라고 생각하기 쉽지만, 실제로는 화학적 기여까지 포함한 전기화학 퍼텐셜 차이다.
  connection: >-
    DFT로 계산한 리튬 삽입 에너지에서 평균 전압을 구하는 방법이 이 관계에 바탕을 두며, 이렇게 만든 대량 전압 데이터가 소재 예측 머신러닝의 학습 자료가 된다.
  quiz:
    question: "전압계가 측정하는 두 전극의 차이는 무엇인가?"
    choices: ["내부 정전기 전위 φ", "전자의 전기화학 퍼텐셜(페르미 준위)", "이온 농도", "전극 질량"]
    answer_index: 1
    explanation: "전압계는 두 금속 단자에서 전자의 전기화학 퍼텐셜, 즉 페르미 준위 차이를 잰다."
  keywords:
    - {ko: "전기화학 퍼텐셜", en: "electrochemical potential"}
    - {ko: "페르미 준위", en: "Fermi level"}
    - {ko: "화학 퍼텐셜", en: "chemical potential"}
  next_topics: ["전기화학 창(electrochemical window)", "고체전해질/전극 계면의 공간전하층"]
  references: ["J. Newman, K. E. Thomas-Alyea, Electrochemical Systems, 3rd ed., 2004"]
