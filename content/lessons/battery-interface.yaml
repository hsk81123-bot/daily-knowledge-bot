# 배터리 › 계면 공부 노트

- concept: "SEI(고체 전해질 계면)의 형성과 조성"
  title: "SEI: 음극을 지키는 수 nm의 막"
  level: 중급
  one_liner: >-
    SEI는 첫 충전 때 전해질이 음극 표면에서 환원되어 생긴 막으로, 리튬 이온은 통과시키고 전자는 막아 전해질이 계속 분해되는 것을 멈춘다.
  sections:
    - heading: "왜 생기나"
      body: >-
        흑연 음극은 리튬 대비 약 0.1 V까지 내려가는데, 카보네이트 전해질은 대략 0.8 V 아래에서 환원된다. 즉 음극은 전해질이 안정한 전위 범위 밖에서
        작동한다. 첫 충전 때 전해질이 환원 분해되어 생긴 생성물이 표면에 쌓여 막이 된다. 이 막이 전자를 차단하면 그 뒤로는 분해가 거의 멈춘다.
        이렇게 전지가 스스로 만드는 보호막이 SEI(solid electrolyte interphase)다.
    - heading: "조성과 구조"
      body: >-
        SEI는 수 nm~수십 nm 두께로, 전극 가까이에는 LiF·Li₂O·Li₂CO₃ 같은 무기물이 많고 전해질 쪽에는 ROCO₂Li 같은 유기물과 고분자가 많은
        층상 또는 모자이크 구조로 설명된다. 좋은 SEI는 이온 전도성은 높고 전자 전도성은 낮으며, 얇고 균일하고 기계적으로 튼튼하다.
    - heading: "비용과 성장"
      body: >-
        SEI를 만드는 데 쓰인 리튬은 돌아오지 않는다. 그래서 첫 사이클 쿨롱 효율이 100%보다 낮다. SEI는 사이클과 보관 중에도 아주 천천히 자라는데,
        시간의 제곱근에 비례하는 성장(확산 지배)으로 모사하는 경우가 많다. 이 느린 성장이 캘린더 열화의 주된 원인 중 하나다.
  formula: |
    SEI 두께 근사: L(t) ≈ k·√t   (확산 지배 성장)
    → 캘린더 수명에서 용량 손실 ∝ √t 형태로 자주 나타남
  example: >-
    새로 만든 셀은 포메이션 공정에서 낮은 전류로 첫 충전을 한다. 천천히 충전할수록 더 치밀하고 균일한 SEI가 생긴다고 알려져 있다.
  misconception: >-
    SEI는 한 번 생기면 끝나는 고정된 막이 아니다. 온도와 사이클에 따라 녹고 다시 생기며 조성도 변한다. 또 SEI를 없애는 것이 목표가 아니라
    좋은 SEI를 만드는 것이 목표다.
  connection: >-
    용량 감소 곡선을 √t 같은 물리 기반 항과 신경망 항으로 나누어 학습하는 하이브리드 수명 예측 모델에서 SEI 성장이 핵심 물리 항으로 쓰인다.
  quiz:
    question: "좋은 SEI가 갖춰야 할 성질의 조합은?"
    choices: ["전자 전도성↑, 이온 전도성↓", "이온 전도성↑, 전자 전도성↓", "둘 다 높음", "둘 다 낮음"]
    answer_index: 1
    explanation: "리튬 이온은 통과시키고 전자는 막아야 전해질 분해가 멈추면서도 충방전이 가능하다."
  keywords:
    - {ko: "고체 전해질 계면", en: "solid electrolyte interphase"}
    - {ko: "환원 분해", en: "reductive decomposition"}
    - {ko: "캘린더 열화", en: "calendar aging"}
  next_topics: ["SEI 형성 첨가제 FEC·VC", "포메이션 공정과 초기 쿨롱 효율", "XPS로 SEI 조성 분석하기"]
  references: ["E. Peled, The electrochemical behavior of alkali and alkaline earth metals in nonaqueous battery systems—the solid electrolyte interphase model, J. Electrochem. Soc., 1979", "E. Peled, S. Menkin, Review—SEI: past, present and future, J. Electrochem. Soc., 2017"]

- concept: "CEI(양극 전해질 계면)"
  title: "CEI: 양극에도 막이 생긴다"
  level: 중급
  one_liner: >-
    CEI는 높은 전위의 양극 표면에서 전해질이 산화되고 염이 분해되어 생기는 막으로, SEI보다 얇고 덜 안정하지만 고전압 수명을 좌우한다.
  sections:
    - heading: "생성 원리"
      body: >-
        양극은 4 V 이상의 높은 전위에서 작동한다. 이 전위에서는 전해질 용매가 산화되고, LiPF₆ 분해로 생긴 HF가 표면의 산화물과 반응한다.
        그 결과 LiF, 금속 불화물, 탄산염, 유기 산화물 등이 표면에 쌓여 CEI(cathode electrolyte interphase)가 된다. 양극 표면에 원래 있던
        잔류 리튬(Li₂CO₃, LiOH)도 CEI 조성에 영향을 준다.
    - heading: "SEI와의 차이"
      body: >-
        SEI는 수십 nm까지 자라 비교적 분명한 보호 역할을 하지만, CEI는 대개 수 nm 수준으로 얇고 불균일하다. 또 양극 소재 자체의 표면 상전이
        (암염층 형성)와 섞여 있어 어디까지가 CEI이고 어디부터가 소재 열화인지 구분하기 어렵다.
    - heading: "고전압과 CEI"
      body: >-
        에너지 밀도를 높이려고 상한 전압을 올리면 전해질 산화가 빨라져 CEI가 두꺼워지고 저항이 커진다. 그래서 산화에 강한 용매, 불소계 첨가제,
        LiDFOB 같은 염 첨가제, 표면 코팅 등으로 얇고 안정한 CEI를 만들려는 연구가 많다.
  formula: |
    전해질 산화(예): 카보네이트 용매 → CO2, 유기 라디칼 + e⁻  (양극 고전위)
    HF와 표면 산화물: M–O + 2HF → MF2 + H2O
  example: >-
    같은 셀을 4.2 V와 4.4 V 상한으로 사이클하면, 4.4 V 쪽이 용량은 크지만 EIS에서 양극 계면 저항이 더 빨리 커지는 경향이 보인다.
  misconception: >-
    전기화학 창 표에서 용매의 산화 전위가 충분히 높다고 해도, 실제 양극 표면은 촉매처럼 작용해 더 낮은 전위에서 산화가 시작될 수 있다.
  connection: >-
    XPS나 ToF-SIMS의 복잡한 스펙트럼을 비지도 학습(NMF, PCA)으로 분해해 CEI 성분을 구분하는 데이터 분석 기법이 쓰인다.
  quiz:
    question: "CEI가 SEI보다 연구하기 어려운 이유로 가장 알맞은 것은?"
    choices: ["CEI는 전혀 생기지 않아서", "얇고 불균일하며 소재 표면 상전이와 섞여 있어서", "CEI는 액체라서", "흑연에서만 생겨서"]
    answer_index: 1
    explanation: "CEI는 수 nm로 얇고 불균일하며 양극 표면의 암염층 형성 같은 소재 열화와 겹쳐 구분이 어렵다."
  keywords:
    - {ko: "양극 전해질 계면", en: "cathode electrolyte interphase"}
    - {ko: "전해질 산화", en: "electrolyte oxidation"}
    - {ko: "고전압 작동", en: "high-voltage operation"}
  next_topics: ["양극 표면 코팅(Al2O3, LiNbO3 등)", "전이금속 용출과 크로스토크"]
  references: []

- concept: "전기이중층 구조(Helmholtz, Gouy-Chapman, Stern)"
  title: "전기이중층: 전극 표면 1 nm에서 일어나는 전하 분리"
  level: 중급
  one_liner: >-
    전극이 전하를 띠면 전해질 쪽에 반대 전하 이온이 모여 이중층을 만들고, 그 구조는 헬름홀츠·구이-채프먼·스턴 모델로 단계적으로 설명된다.
  sections:
    - heading: "헬름홀츠 모델"
      body: >-
        가장 단순한 그림은 전극 표면 전하와 그 바로 앞에 붙은 반대 전하 이온층이 평행판 축전기처럼 마주 보는 것이다. 두 층 사이 거리가 매우 짧아
        (약 0.3~0.5 nm) 단위 면적당 정전용량이 수십 μF/cm²에 이른다. 하지만 이 모델은 정전용량이 전위나 농도에 따라 변하는 현상을 설명하지 못한다.
    - heading: "구이-채프먼 모델"
      body: >-
        이온은 열운동을 하므로 한 층에 딱 붙지 않고, 표면에서 멀어질수록 농도가 줄어드는 확산층을 만든다. 볼츠만 분포와 푸아송 식을 합쳐 풀면
        전위가 거리에 따라 지수적으로 감소하고, 그 특성 길이가 디바이 길이다. 묽은 용액에서는 디바이 길이가 길어 정전용량이 작아진다.
    - heading: "스턴 모델"
      body: >-
        구이-채프먼 모델은 이온을 점으로 보아 표면에 무한히 가까이 모일 수 있다고 가정해, 높은 전위에서 정전용량을 과대평가한다.
        스턴 모델은 이온 크기 때문에 생기는 조밀층(헬름홀츠층)과 그 바깥 확산층을 직렬로 연결해 이를 보완한다. 전체 정전용량은 두 축전기의 직렬 합성이다.
  formula: |
    디바이 길이: λD = √(ε·kB·T / (2·NA·e²·I))   (I: 이온 세기)
    스턴 모델: 1/C_dl = 1/C_H + 1/C_diffuse
  example: >-
    EIS 등가회로에서 전하전달 저항과 병렬로 놓는 축전기(또는 CPE)가 바로 전기이중층 정전용량이다. 슈퍼커패시터는 이 이중층에 전하를 저장하는 장치다.
  misconception: >-
    리튬이온 전지처럼 고농도(약 1 M) 유기 전해질에서는 디바이 길이가 1 nm보다 훨씬 짧아 확산층이 거의 의미가 없고, 고전적인 모델이 잘 맞지 않는다.
    용매 배향과 이온 크기, 표면 흡착이 더 중요해진다.
  connection: >-
    분자동역학(MD) 시뮬레이션은 계면 이온 분포를 직접 보여 주지만 비용이 크다. 기계학습 원자간 퍼텐셜(MLIP)을 쓰면 DFT에 가까운 정확도로
    더 크고 긴 계면 시뮬레이션이 가능하다.
  quiz:
    question: "스턴 모델에서 전체 이중층 정전용량은 어떻게 구성되나?"
    choices: ["조밀층과 확산층 정전용량의 병렬 합", "조밀층과 확산층 정전용량의 직렬 합성", "확산층만", "조밀층만"]
    answer_index: 1
    explanation: "1/C_dl = 1/C_H + 1/C_diffuse로, 두 축전기를 직렬로 연결한 것과 같다. 작은 쪽이 전체를 좌우한다."
  keywords:
    - {ko: "전기이중층", en: "electric double layer"}
    - {ko: "디바이 길이", en: "Debye length"}
    - {ko: "이중층 정전용량", en: "double-layer capacitance"}
  next_topics: ["전기화학 임피던스 분광법(EIS)과 등가회로", "탈용매화(desolvation)와 계면 전하전달"]
  references: ["A. J. Bard, L. R. Faulkner, Electrochemical Methods: Fundamentals and Applications, 2nd ed., 2001"]

- concept: "탈용매화(desolvation)와 계면 전하전달"
  title: "탈용매화: 리튬 이온이 전극에 들어가기 전에 옷을 벗는 단계"
  level: 심화
  one_liner: >-
    전해질 속 리튬 이온은 용매 분자에 둘러싸여 있고, 전극에 들어가려면 이 용매 껍질을 벗어야 하는데 이 단계가 저온 성능을 좌우하는 경우가 많다.
  sections:
    - heading: "용매화 껍질"
      body: >-
        카보네이트 전해질에서 Li⁺는 보통 용매 분자 약 4개(주로 EC의 카보닐 산소)와 음이온에 둘러싸인 용매화 껍질을 가진다. 이온이 전해질 속을
        움직일 때는 이 껍질과 함께 움직인다. 전극 안으로는 맨 리튬 이온만 들어갈 수 있으므로, 계면에서 껍질을 벗는 탈용매화가 필요하다.
    - heading: "계면에서 일어나는 단계"
      body: >-
        리튬이 전극으로 들어가는 과정은 대략 (1) 용매화된 이온이 표면으로 이동, (2) 탈용매화, (3) SEI 통과, (4) 전극 표면에서 전자를 받아 결정 안으로
        삽입되는 단계로 나뉜다. 이 중 어느 단계가 가장 느린지는 계와 온도에 따라 다르지만, 흑연 음극에서는 탈용매화의 활성화 에너지가 크다는 연구가 많다.
    - heading: "왜 중요한가"
      body: >-
        탈용매화 활성화 에너지는 대략 50~70 kJ/mol 수준으로 보고되며, 이 때문에 온도가 내려가면 계면 저항이 급격히 커진다. 그래서 저온 성능을 높이려면
        리튬과 약하게 결합하는 용매를 쓰거나, 음이온이 껍질에 많이 들어간 용매화 구조를 만들어 탈용매화를 쉽게 하는 전략을 쓴다.
  formula: |
    계면 저항의 온도 의존: 1/R_ct ∝ exp(−Ea / R·T)
    ln(1/R_ct) vs 1/T 기울기 → 활성화 에너지 Ea
  example: >-
    EIS를 여러 온도에서 측정해 전하전달 반원의 저항으로 아레니우스 플롯을 그리면, 전해질 종류에 따라 활성화 에너지가 달라지는 것을 볼 수 있다.
    이 값이 클수록 저온에서 급속 충전이 어렵다.
  misconception: >-
    전해질의 이온 전도도가 높으면 저온 성능도 좋을 것이라 생각하기 쉽지만, 전도도는 벌크 이동만 반영한다. 저온에서는 계면 탈용매화가 병목이 되는 경우가 많다.
  connection: >-
    용매-리튬 결합 에너지나 용매화 구조를 분자 시뮬레이션으로 계산하고, 그 특징으로 저온 성능을 예측하는 데이터 기반 전해질 설계가 연구된다.
  quiz:
    question: "흑연 음극에서 저온일 때 계면 저항이 크게 늘어나는 대표 원인은?"
    choices: ["탈용매화의 큰 활성화 에너지", "분리막 녹음", "양극 산소 방출", "집전체 부식"]
    answer_index: 0
    explanation: "리튬 이온이 용매 껍질을 벗는 단계는 활성화 에너지가 커서 온도가 낮을수록 급격히 느려진다."
  keywords:
    - {ko: "탈용매화", en: "desolvation"}
    - {ko: "용매화 껍질", en: "solvation sheath"}
    - {ko: "활성화 에너지", en: "activation energy"}
  next_topics: ["용매화 구조와 고농도·국부고농도 전해질", "버틀러-볼머 식과 교환 전류 밀도"]
  references: ["T. Abe et al., Solvated Li-ion transfer at interface between graphite and electrolyte, J. Electrochem. Soc., 2004"]

- concept: "리튬 도금(lithium plating)"
  title: "리튬 도금: 급속·저온 충전의 숨은 적"
  level: 중급
  one_liner: >-
    음극 전위가 리튬 금속 전위(0 V vs Li/Li⁺) 아래로 내려가면 리튬이 흑연 안으로 들어가지 못하고 표면에 금속으로 쌓이는데, 이것이 리튬 도금이다.
  sections:
    - heading: "언제 생기나"
      body: >-
        흑연의 작동 전위는 리튬 석출 전위보다 0.1 V 정도밖에 높지 않다. 큰 전류로 충전하면 과전압 때문에 음극 표면 전위가 0 V 아래로 내려갈 수 있다.
        저온에서는 확산과 계면 반응이 느려 이 일이 더 쉽게 일어나고, 충전 상태가 높을수록, 음극 용량 여유(N/P 비)가 작을수록 위험하다.
    - heading: "무엇이 나쁜가"
      body: >-
        석출된 리튬 일부는 휴지 기간에 다시 흑연으로 들어가지만(재삽입), 일부는 전해질과 반응해 새 SEI를 만들거나 끊어져 죽은 리튬이 된다.
        그래서 용량이 갑자기 빨리 줄고(열화 가속, '무릎' 현상), 바늘 모양으로 자라면 분리막을 뚫어 단락과 열폭주로 이어질 수 있다.
    - heading: "검출 방법"
      body: >-
        충전 직후 휴지 중 전압 곡선에서 재삽입에 해당하는 평탄 구간이 보이거나, 방전 초기 dV/dQ에 리튬 벗김(stripping) 신호가 나타나는지로 판단한다.
        셀을 분해해 음극 표면이 은회색으로 변했는지 보거나, 3전극 셀로 음극 전위를 직접 측정하기도 한다.
  formula: |
    도금 조건: φ_anode(표면) = φ_eq − |η| < 0 V vs Li/Li⁺
    η: 계면·농도 과전압 (전류↑, 온도↓일수록 커짐)
  example: >-
    급속 충전 프로토콜은 처음에는 큰 전류로 충전하다가 음극 전위가 0 V에 가까워지기 전에 전류를 줄이는 다단계 정전류 방식을 많이 쓴다.
  misconception: >-
    셀 전압은 정상 범위라도 음극 전위는 0 V 아래로 내려갈 수 있다. 셀 전압은 양극과 음극 전위의 차이이므로 음극 상태를 직접 알려 주지 않는다.
  connection: >-
    충전 프로토콜을 강화학습이나 베이지안 최적화로 찾아 도금 없이 충전 시간을 줄이는 연구가 있다. 실험 수를 줄이려고 초기 사이클 데이터로 수명을 예측하는 모델을 함께 쓴다.
  quiz:
    question: "리튬 도금 위험을 높이는 조건이 아닌 것은?"
    choices: ["저온 충전", "높은 충전 전류", "높은 충전 상태", "작은 전류로 천천히 방전"]
    answer_index: 3
    explanation: "도금은 충전 중 음극 전위가 0 V 아래로 내려갈 때 생긴다. 느린 방전은 도금 위험을 높이지 않는다."
  keywords:
    - {ko: "리튬 도금", en: "lithium plating"}
    - {ko: "급속 충전", en: "fast charging"}
    - {ko: "N/P 비", en: "N/P ratio"}
  next_topics: ["2전극·3전극 셀과 기준 전극", "사이클 수명 시험과 열화 모드 분리(LLI, LAM)", "리튬 금속 음극과 덴드라이트"]
  references: ["T. Waldmann, B.-I. Hogg, M. Wohlfahrt-Mehrens, Li plating as unwanted side reaction in commercial Li-ion cells – A review, J. Power Sources, 2018"]

- concept: "SEI 형성 첨가제 FEC·VC"
  title: "FEC·VC: 몇 %로 SEI를 바꾸는 첨가제"
  level: 중급
  one_liner: >-
    VC와 FEC는 주 용매보다 먼저 환원되어 음극 표면에 더 튼튼한 SEI를 만드는 첨가제로, 소량만 넣어도 수명이 크게 달라진다.
  sections:
    - heading: "원리: 먼저 환원되기"
      body: >-
        첨가제는 주 용매(EC 등)보다 환원 전위가 높아(=더 쉽게 환원되어) 첫 충전 때 먼저 반응한다. 그러면 주 용매가 분해되기 전에 첨가제 유래의 막이
        표면을 덮는다. 보통 전해질 무게의 몇 % 이하만 넣는다. 너무 많이 넣으면 막이 두꺼워져 저항이 커지거나 남은 첨가제가 양극에서 산화될 수 있다.
    - heading: "VC"
      body: >-
        비닐렌 카보네이트(VC)는 이중결합을 가지고 있어 환원되면 고분자(폴리-VC)를 만든다. 이 고분자는 유연하고 치밀한 SEI를 만들어 흑연 음극의 수명을 늘린다.
        대신 SEI 저항이 커질 수 있고, 양극에서 산화되어 가스를 만들 수도 있다.
    - heading: "FEC"
      body: >-
        플루오로에틸렌 카보네이트(FEC)는 환원되면서 LiF가 많은 SEI를 만든다. LiF가 풍부한 SEI는 단단하고 전자 절연성이 좋아, 부피 변화가 큰 실리콘 음극이나
        리튬 금속 음극에서 효과가 크다. FEC는 사이클 중 계속 소모되므로, 다 쓰고 나면 수명이 급격히 나빠질 수 있다.
  formula: |
    선택 기준: E_red(첨가제) > E_red(주 용매)  (vs Li/Li⁺)
    → 첫 충전 dQ/dV에서 주 용매보다 높은 전위에 환원 피크
  example: >-
    첫 충전 dQ/dV를 첨가제 유무로 비교하면, 첨가제를 넣은 셀에서 EC 환원 피크(약 0.6~0.8 V)보다 높은 전위에 작은 피크가 새로 생기고 EC 피크는 작아진다.
  misconception: >-
    첨가제는 많이 넣을수록 좋은 것이 아니다. 최적 농도가 있고, 음극에 좋은 첨가제가 양극에서는 산화되어 문제를 일으킬 수 있다.
  connection: >-
    첨가제 조합은 경우의 수가 많아, 고속 실험 데이터로 학습한 모델로 다음 실험할 조합을 고르는 능동 학습이 쓰인다.
  quiz:
    question: "FEC가 실리콘 음극에서 특히 효과적인 이유는?"
    choices: ["전해질 점도를 크게 낮춰서", "LiF가 풍부한 튼튼한 SEI를 만들어서", "양극 전압을 올려서", "분리막을 두껍게 해서"]
    answer_index: 1
    explanation: "FEC는 환원되며 LiF가 많은 단단한 SEI를 만들어 부피 변화가 큰 실리콘 표면을 잘 보호한다."
  keywords:
    - {ko: "비닐렌 카보네이트", en: "vinylene carbonate"}
    - {ko: "플루오로에틸렌 카보네이트", en: "fluoroethylene carbonate"}
    - {ko: "희생 첨가제", en: "sacrificial additive"}
  next_topics: ["실리콘 음극의 부피 팽창 문제", "dQ/dV 미분 용량 분석"]
  references: ["S. S. Zhang, A review on electrolyte additives for lithium-ion batteries, J. Power Sources, 2006"]

- concept: "전이금속 용출과 크로스토크"
  title: "전이금속 용출: 양극에서 녹아 음극을 망가뜨린다"
  level: 심화
  one_liner: >-
    양극에서 녹아 나온 Mn·Ni·Co 이온은 전해질을 지나 음극에 쌓여 SEI를 망가뜨리는데, 이렇게 한 전극의 반응이 다른 전극에 영향을 주는 것을 크로스토크라 한다.
  sections:
    - heading: "용출 원인"
      body: >-
        LiPF₆ 분해로 생긴 HF가 양극 표면을 공격하거나, 높은 전위와 고온에서 표면 구조가 불안정해지면 전이금속 이온이 전해질로 녹아 나온다.
        LMO에서는 Mn³⁺의 불균등화가, 고니켈 소재에서는 표면 상전이와 산소 손실이 용출을 키운다. 온도가 높을수록 훨씬 심해진다.
    - heading: "음극에서 벌어지는 일"
      body: >-
        녹은 금속 이온은 음극 쪽으로 이동해 낮은 전위에서 환원되어 SEI 안이나 위에 쌓인다. 이 금속이나 금속 화합물은 전해질 환원을 촉진하는 촉매처럼 작용해
        SEI가 계속 두꺼워지고 리튬이 소모된다. 그래서 양극에서 녹은 양은 적어도 음극 쪽 열화가 크게 나타날 수 있다.
    - heading: "그 밖의 크로스토크"
      body: >-
        양극에서 생긴 산화 생성물이나 가스가 음극으로 가서 반응하거나, 음극에서 생긴 환원 생성물이 양극으로 가서 산화되는 왕복 반응도 크로스토크다.
        전극 하나만 분석하면 원인을 놓치기 쉬워, 대칭 셀이나 분리한 전극으로 다시 조립한 셀을 써서 원인을 나눈다.
  formula: |
    HF 공격(예): LiMn2O4 + HF → MnF2(용해), H2O ...
    음극 쪽: Mn²⁺ + 2e⁻ → Mn⁰ (SEI 내 석출, 전해질 환원 촉진)
  example: >-
    고온 사이클 후 음극을 ICP로 분석하면 사이클 수에 따라 음극의 망간·니켈 양이 늘어나는 것을 확인할 수 있고, 이 양과 용량 손실이 상관관계를 보이는 경우가 많다.
  misconception: >-
    양극에서 일어난 열화는 양극만 분석하면 된다고 생각하기 쉽지만, 용출된 금속의 피해는 주로 음극에서 나타난다. 크로스토크는 전지를 하나의 시스템으로 봐야 하는 이유다.
  connection: >-
    양극·음극을 각각 분석한 데이터와 셀 전체 데이터를 함께 쓰는 멀티모달 학습으로 열화 원인을 분리하려는 시도가 있다.
  quiz:
    question: "양극에서 녹은 전이금속이 주로 피해를 주는 곳은?"
    choices: ["알루미늄 집전체", "음극 SEI", "분리막 셧다운층", "셀 케이스"]
    answer_index: 1
    explanation: "용출된 금속 이온은 음극에서 환원되어 SEI에 쌓이고, 전해질 환원을 촉진해 리튬 소모를 늘린다."
  keywords:
    - {ko: "전이금속 용출", en: "transition metal dissolution"}
    - {ko: "크로스토크", en: "crosstalk"}
    - {ko: "촉매적 SEI 성장", en: "catalytic SEI growth"}
  next_topics: ["스피넬 LMO 양극재", "양극 표면 코팅(Al2O3, LiNbO3 등)"]
  references: ["C. Zhan, T. Wu, J. Lu, K. Amine, Dissolution, migration, and deposition of transition metal ions in Li-ion batteries exemplified by Mn-based cathodes – a critical review, Energy & Environmental Science, 2018"]

- concept: "양극 표면 코팅(Al2O3, LiNbO3 등)"
  title: "양극 표면 코팅: 수 nm 막으로 계면을 지키기"
  level: 중급
  one_liner: >-
    양극 입자 표면에 얇은 산화물·인산염 막을 씌우면 전해질과의 직접 접촉과 HF 공격을 줄이고, 전고체 전지에서는 계면 반응을 막는 완충층이 된다.
  sections:
    - heading: "액체 전해질 셀에서의 역할"
      body: >-
        Al₂O₃, ZrO₂, 인산염 같은 코팅은 양극 표면과 전해질 사이 물리적 장벽이 된다. 전해질 산화와 전이금속 용출을 줄이고, HF를 먼저 받아 소비하는
        희생층 역할도 한다. 일부 코팅은 표면의 잔류 리튬과 반응해 리튬 전도성 화합물이 되기도 한다.
    - heading: "전고체 셀에서의 역할"
      body: >-
        황화물 고체 전해질은 산화물 양극과 맞닿으면 계면에서 분해되거나 상호 확산이 일어나 저항층이 생긴다. LiNbO₃, Li₂ZrO₃처럼 리튬 이온은 통하면서
        두 물질 사이를 화학적으로 분리하는 코팅이 필요하다. 공간전하층 형성을 줄이는 효과도 있다고 설명된다.
    - heading: "좋은 코팅의 조건"
      body: >-
        너무 두꺼우면 리튬 이동을 막아 저항이 커지므로 보통 수 nm 수준으로 얇고 고르게 덮어야 한다. 습식 코팅은 값싸지만 균일도가 떨어지고,
        원자층 증착(ALD)은 두께 제어가 뛰어나지만 비싸다. 코팅이 입자 균열로 깨지면 새 표면은 보호받지 못한다.
  formula: |
    코팅 설계의 균형: 보호 효과 ↑(두께↑) vs 리튬 이동 저항 ↑(두께↑)
    ALD: 사이클당 약 0.1 nm 수준으로 두께 제어
  example: >-
    ALD로 Al₂O₃를 몇 사이클만 입힌 양극은 고온 수명이 좋아지지만, 사이클 수를 너무 늘리면 율속 특성이 떨어지는 결과가 흔히 보고된다.
  misconception: >-
    코팅은 입자 표면을 완벽히 감싸는 껍질이라고 생각하기 쉽지만, 실제로는 섬처럼 불연속이거나 일부만 덮인 경우가 많다. 그래도 효과가 나타나는 것은 반응성 높은 자리를 우선 덮기 때문으로 해석되기도 한다.
  connection: >-
    코팅 소재를 고를 때 고체 전해질과 양극 사이의 화학 반응 에너지를 대량 계산하고, 결과를 학습한 모델로 후보를 빠르게 거르는 하이스루풋 스크리닝이 쓰인다.
  quiz:
    question: "전고체 전지에서 LiNbO₃ 코팅의 주된 목적은?"
    choices: ["양극 전자 전도도를 높이려고", "황화물 전해질과 양극 사이의 계면 반응을 막으려고", "분리막을 대신하려고", "음극 SEI를 만들려고"]
    answer_index: 1
    explanation: "LiNbO₃는 리튬은 통과시키면서 황화물 전해질과 산화물 양극 사이의 분해·상호 확산을 막는 완충층이다."
  keywords:
    - {ko: "표면 코팅", en: "surface coating"}
    - {ko: "원자층 증착", en: "atomic layer deposition"}
    - {ko: "완충층", en: "buffer layer"}
  next_topics: ["고체전해질/전극 계면의 공간전하층", "CEI(양극 전해질 계면)"]
  references: []

- concept: "고체전해질/전극 계면의 공간전하층"
  title: "공간전하층: 고체끼리 맞닿을 때 생기는 리튬 결핍층"
  level: 심화
  one_liner: >-
    화학 퍼텐셜이 다른 두 고체가 맞닿으면 리튬 이온이 한쪽으로 쏠려 계면 근처에 리튬이 부족한 층이 생기고, 이것이 계면 저항을 키운다는 가설이 공간전하층 모델이다.
  sections:
    - heading: "개념"
      body: >-
        두 물질이 접촉하면 전기화학 퍼텐셜이 같아지도록 전하 운반자가 이동한다. 산화물 양극과 황화물 고체 전해질처럼 리튬의 화학 퍼텐셜 차이가 큰 경우,
        전해질 쪽 계면 근처의 리튬이 양극 쪽으로 옮겨 가 전해질 표면에 리튬 결핍층이 생긴다고 설명된다. 이 층은 리튬 운반자가 적어 저항이 크다.
    - heading: "전자 전도성의 역할"
      body: >-
        양극은 전자를 잘 통하므로 양극 쪽 전하는 빠르게 가려진다(차폐). 반면 전해질은 전자를 통하지 않아 리튬 이동만으로 균형을 맞추므로,
        공간전하층이 전해질 쪽에 더 넓게 생긴다는 해석이 있다. 충전하면 양극 전위가 더 올라가 이 효과가 커질 수 있다.
    - heading: "논쟁과 완충층"
      body: >-
        공간전하층의 실제 두께와 저항 기여는 측정이 어려워 아직 논쟁 중이다. 화학 분해층이나 접촉 손실과 효과를 구분하기 어렵기 때문이다.
        다만 LiNbO₃ 같은 산화물 완충층을 넣으면 계면 저항이 크게 줄어드는 실험 결과가 이 설명과 맞아 널리 인용된다.
  formula: |
    평형 조건: μ̃_Li⁺(전해질) = μ̃_Li⁺(전극)
    μ̃ = μ + zFφ  (전기화학 퍼텐셜 = 화학 퍼텐셜 + 전기적 일)
  example: >-
    황화물 전고체 셀에서 코팅 없는 NCM과 LiNbO₃ 코팅 NCM의 EIS를 비교하면, 코팅 셀의 중간 주파수 계면 반원이 훨씬 작게 나타나는 경우가 많다.
  misconception: >-
    전고체 계면 저항의 원인이 공간전하층 하나뿐이라고 보기 쉽지만, 실제로는 화학 분해, 상호 확산, 기계적 접촉 손실이 함께 작용한다.
  connection: >-
    계면 원자 구조를 DFT로 직접 계산하기에는 너무 크다. 기계학습 원자간 퍼텐셜로 큰 계면 모델을 만들어 리튬 분포를 시뮬레이션하는 연구가 진행 중이다.
  quiz:
    question: "공간전하층 모델에서 리튬 결핍층이 주로 생기는 쪽은?"
    choices: ["전자 전도성이 좋은 양극 내부 깊은 곳", "황화물 고체 전해질의 계면 근처", "음극 집전체", "분리막"]
    answer_index: 1
    explanation: "전자 차폐가 어려운 전해질 쪽에서 리튬이 양극으로 옮겨 가 계면 근처에 결핍층이 생긴다고 설명된다."
  keywords:
    - {ko: "공간전하층", en: "space-charge layer"}
    - {ko: "전기화학 퍼텐셜", en: "electrochemical potential"}
    - {ko: "계면 저항", en: "interfacial resistance"}
  next_topics: ["전기화학 퍼텐셜과 페르미 준위", "양극 표면 코팅(Al2O3, LiNbO3 등)"]
  references: ["K. Takada et al., Interfacial modification for high-power solid-state lithium batteries, Solid State Ionics, 2008"]

- concept: "전고체 전지의 계면 접촉 손실(화학-기계적 열화)"
  title: "전고체 계면 접촉 손실: 고체는 흘러 들어가지 않는다"
  level: 심화
  one_liner: >-
    전고체 전지에서는 전극 입자가 충방전 중 부피가 변해도 고체 전해질이 액체처럼 틈을 메우지 못해, 계면이 벌어지며 용량과 출력이 떨어진다.
  sections:
    - heading: "액체와 고체의 차이"
      body: >-
        액체 전해질은 전극 입자가 줄어들어도 틈으로 흘러 들어가 접촉을 유지한다. 고체 전해질은 그렇지 못하다. 그래서 전고체 전지에서는
        입자와 전해질 사이 고체-고체 접촉 면적이 성능을 좌우하며, 처음부터 공극 없이 밀착시키는 것 자체가 어렵다.
    - heading: "부피 변화와 균열"
      body: >-
        NCM은 충전 중 수 % 부피가 줄고, 실리콘이나 리튬 금속 음극은 크게 변한다. 이 변화가 반복되면 계면이 떨어지거나(박리) 전해질과 입자 안에 균열이 생긴다.
        떨어진 입자는 리튬이나 전자를 주고받지 못해 활물질 손실이 된다. 계면 분해로 생긴 층이 다시 기계적 응력을 키우는 식으로 화학과 기계 열화가 서로를 부추긴다.
    - heading: "대응"
      body: >-
        셀에 높은 압력을 가해 접촉을 유지하는 방법이 흔히 쓰이지만, 실용 셀에서 큰 압력은 부담이다. 부피 변화가 작은 전극 소재, 무른 전해질(황화물·할라이드),
        입자 크기와 혼합 비율 최적화, 유연한 고분자 첨가 등이 연구된다.
  formula: |
    유효 이온 전류 ∝ 접촉 면적 A_contact
    계면 저항 R_int ≈ R_specific / A_contact  → 접촉 손실 시 R_int 증가
  example: >-
    같은 전고체 셀을 서로 다른 압력으로 눌러 사이클하면, 압력이 낮은 셀에서 용량이 더 빨리 줄고 EIS 계면 저항이 크게 늘어나는 결과가 흔히 보고된다.
  misconception: >-
    전고체 전지의 문제는 고체 전해질 전도도만 높이면 해결된다고 보기 쉽지만, 실제 셀에서는 계면 접촉과 기계적 안정성이 더 큰 병목인 경우가 많다.
  connection: >-
    X선 CT로 얻은 3차원 전극 구조에서 접촉 면적과 공극을 자동으로 분할·정량하는 딥러닝 이미지 분석이 전고체 전극 설계에 쓰인다.
  quiz:
    question: "전고체 전지에서 셀에 높은 압력을 가하는 주된 이유는?"
    choices: ["전해질을 녹이려고", "입자와 고체 전해질의 접촉을 유지하려고", "리튬 도금을 일부러 일으키려고", "SEI를 없애려고"]
    answer_index: 1
    explanation: "고체는 틈을 메우지 못하므로 압력으로 입자와 전해질의 접촉 면적을 유지해 계면 저항을 줄인다."
  keywords:
    - {ko: "화학-기계 열화", en: "chemo-mechanical degradation"}
    - {ko: "계면 박리", en: "interfacial delamination"}
    - {ko: "적층 압력", en: "stack pressure"}
  next_topics: ["황화물·산화물 고체 전해질", "단결정 양극재와 입자 미세균열"]
  references: ["R. Koerver et al., Capacity fade in solid-state batteries: interphase formation and chemomechanical processes in nickel-rich layered oxide cathodes and lithium thiophosphate solid electrolytes, Chemistry of Materials, 2017"]

- concept: "인공 SEI"
  title: "인공 SEI: 전지가 만들기 전에 미리 씌우는 보호막"
  level: 중급
  one_liner: >-
    인공 SEI는 전해질 분해에 맡기지 않고 원하는 조성과 두께의 보호막을 음극 표면에 미리 만들어, 균일하고 튼튼한 계면을 얻으려는 방법이다.
  sections:
    - heading: "왜 필요한가"
      body: >-
        자연적으로 생기는 SEI는 전해질 조성과 충전 조건에 따라 불균일해지기 쉽다. 특히 리튬 금속이나 실리콘처럼 부피 변화가 큰 음극에서는 SEI가 깨지고 다시
        생기기를 반복한다. 미리 균일하고 기계적으로 튼튼한 막을 씌우면 리튬이 고르게 들어가고 나와 덴드라이트와 부반응을 줄일 수 있다.
    - heading: "만드는 방법"
      body: >-
        리튬 금속을 특정 가스나 용액과 반응시켜 LiF, Li₃N 같은 무기층을 만들거나, ALD로 Al₂O₃ 같은 산화물을 입히거나, 고분자나 유무기 복합막을 코팅하는 방법이 있다.
        이상적인 인공 SEI는 리튬 이온 전도도가 높고, 전자는 막으며, 리튬의 부피 변화를 따라갈 만큼 유연하거나 견딜 만큼 단단해야 한다.
    - heading: "한계"
      body: >-
        인공 SEI도 사이클이 지나면 깨지거나 전해질과 반응해 결국 자연 SEI와 섞인다. 또 코팅 공정이 추가되어 비용이 늘고, 대면적에 균일하게 적용하기 어렵다.
        그래서 전해질 설계와 함께 쓰는 경우가 많다.
  formula: |
    요구 성질: σ_Li⁺ ↑, σ_e⁻ ↓, 균일 두께, 적절한 기계 강도(전단 탄성률 등)
    예) Li3N 이온 전도도는 비교적 높음(상온 10⁻³~10⁻⁴ S/cm 수준 보고)
  example: >-
    리튬 금속 표면을 질소 분위기에서 처리해 Li₃N 층을 만들면, 대칭 셀(Li|Li)에서 과전압이 더 오래 안정적으로 유지되는 결과가 보고된 바 있다.
  misconception: >-
    인공 SEI를 씌우면 전해질 분해가 완전히 멈춘다고 기대하기 쉽지만, 막이 완벽하지 않아 결국 자연 SEI도 함께 생긴다.
  connection: >-
    인공 SEI 후보 물질의 이온 전도도와 전자 띠 간격을 계산 데이터베이스와 머신러닝으로 빠르게 추정해 후보를 고르는 연구가 있다.
  quiz:
    question: "이상적인 인공 SEI의 성질로 옳은 것은?"
    choices: ["전자 전도도가 높아야 한다", "리튬 이온 전도도가 높고 전자는 막아야 한다", "전해질에 잘 녹아야 한다", "두꺼울수록 좋다"]
    answer_index: 1
    explanation: "자연 SEI와 마찬가지로 리튬 이온은 잘 통하고 전자는 막아야 하며, 얇고 균일해야 저항이 작다."
  keywords:
    - {ko: "인공 SEI", en: "artificial SEI"}
    - {ko: "질화리튬", en: "lithium nitride"}
    - {ko: "보호막", en: "protective layer"}
  next_topics: ["리튬 금속 음극과 덴드라이트", "SEI 형성 첨가제 FEC·VC"]
  references: []

- concept: "가스 발생 메커니즘"
  title: "전지 속 가스: 어디서 무엇이 나오나"
  level: 중급
  one_liner: >-
    리튬이온 전지의 가스는 음극의 SEI 형성, 양극의 전해질 산화와 격자 산소 방출, 잔류 수분과 탄산염 분해에서 주로 나오며, 셀 부풀음과 열화의 신호다.
  sections:
    - heading: "음극에서"
      body: >-
        첫 충전 때 EC가 환원되어 SEI가 생기면서 에틸렌(C₂H₄)이 주로 나온다. 선형 카보네이트가 환원되면 메탄·에탄 같은 탄화수소와 CO가 나온다.
        전해질 속 수분이 환원되면 수소(H₂)가 생긴다. 그래서 포메이션 단계에서 가스가 많이 생기고, 파우치 셀은 이 가스를 빼내는 탈기 공정을 거친다.
    - heading: "양극에서"
      body: >-
        높은 전위에서 카보네이트가 산화되면 CO₂와 CO가 나온다. 고니켈 양극은 높은 충전 상태에서 격자 산소를 방출하고, 이 산소가 전해질을 산화시켜 CO₂를 더 만든다.
        양극 표면의 잔류 탄산리튬(Li₂CO₃)도 고전위에서 분해되어 CO₂를 낸다.
    - heading: "크로스토크와 의미"
      body: >-
        한 전극에서 생긴 물질이 다른 전극으로 가서 가스를 만들기도 한다. 예를 들어 양극에서 생긴 산성 물질이나 물이 음극으로 가서 수소를 만든다.
        가스는 셀을 부풀게 하고 전극 접촉을 나쁘게 하며, 어떤 가스가 언제 나오는지가 열화 원인을 알려 주는 단서가 된다.
  formula: |
    EC 환원(대표): 2EC + 2Li⁺ + 2e⁻ → (CH2OCO2Li)2 + C2H4↑
    탄산염 분해: 2Li2CO3 → 4Li⁺ + 4e⁻ + 2CO2↑ + O2  (고전위)
  example: >-
    DEMS로 첫 충전을 측정하면 음극 SEI가 생기는 저전위 구간에서 C₂H₄ 신호가, 셀 전압이 높아지는 끝 무렵에 CO₂ 신호가 나타나는 것을 볼 수 있다.
  misconception: >-
    가스는 셀이 고장 났을 때만 생긴다고 생각하기 쉽지만, 정상 포메이션에서도 상당량이 생긴다. 중요한 것은 사이클과 보관 중 추가로 생기는 가스다.
  connection: >-
    가스 분석, 전압, 온도 데이터를 시계열로 함께 보고 이상 징후를 조기에 탐지하는 이상 탐지(anomaly detection) 모델이 안전 진단에 연구된다.
  quiz:
    question: "첫 충전 중 EC가 환원될 때 주로 나오는 가스는?"
    choices: ["산소(O₂)", "에틸렌(C₂H₄)", "황화수소(H₂S)", "질소(N₂)"]
    answer_index: 1
    explanation: "EC가 환원되어 리튬 알킬 탄산염 SEI 성분이 생길 때 에틸렌이 대표적으로 발생한다."
  keywords:
    - {ko: "가스 발생", en: "gas evolution"}
    - {ko: "탈기 공정", en: "degassing"}
    - {ko: "셀 부풀음", en: "cell swelling"}
  next_topics: ["DEMS/OEMS 가스 분석", "고니켈 양극의 상전이와 산소 방출"]
  references: []

- concept: "포메이션 공정과 초기 쿨롱 효율"
  title: "포메이션: 전지의 첫 충전이 수명을 정한다"
  level: 입문
  one_liner: >-
    포메이션은 조립한 셀을 처음 충방전하며 SEI를 만들고 안정화하는 공정으로, 이때 쓰인 리튬 때문에 초기 쿨롱 효율이 100%보다 낮다.
  sections:
    - heading: "무엇을 하나"
      body: >-
        셀을 조립하고 전해질을 넣은 뒤, 낮은 전류로 처음 충전해 SEI를 만든다. 이어서 일정 기간 온도를 유지하며 보관(에이징)하고 전압 변화를 보아 불량을 거른다.
        파우치 셀은 이때 생긴 가스를 빼내고 다시 밀봉한다. 포메이션과 에이징은 수 일에서 수 주가 걸려 공장 비용과 시간에서 큰 비중을 차지한다.
    - heading: "초기 쿨롱 효율"
      body: >-
        초기 쿨롱 효율(ICE)은 첫 방전 용량을 첫 충전 용량으로 나눈 값이다. 첫 충전 때 SEI를 만드는 데 쓰인 리튬은 돌아오지 않으므로 ICE는 보통 90%대다.
        양극 자체의 비가역 용량도 섞인다. 실리콘처럼 표면적이 크거나 SEI가 많이 생기는 소재는 ICE가 더 낮다.
    - heading: "조건에 따른 차이"
      body: >-
        포메이션 전류, 온도, 전압 범위에 따라 SEI의 조성과 두께가 달라지고, 이것이 이후 수명에 영향을 준다. 빠른 포메이션은 비용을 줄이지만
        SEI 품질이 나빠질 수 있어, 최적 조건을 찾는 것이 중요한 공정 과제다.
  formula: |
    ICE = Q_discharge,1 / Q_charge,1 × 100 (%)
    비가역 용량 = Q_charge,1 − Q_discharge,1
  example: >-
    같은 셀을 C/20과 C/5로 포메이션한 뒤 장기 사이클을 비교하면, 조건에 따라 수명 차이가 생긴다. 최근에는 높은 전류와 특정 전압 범위를 조합해
    시간을 줄이면서도 수명을 유지하는 프로토콜이 연구된다.
  misconception: >-
    ICE가 높으면 무조건 좋은 SEI라고 보기 쉽지만, ICE는 첫 사이클의 손실만 보여 준다. 이후 사이클의 쿨롱 효율과 SEI 성장 속도가 수명에 더 중요할 수 있다.
  connection: >-
    포메이션 단계의 전압·전류 데이터만으로 셀의 최종 수명을 미리 예측해 불량을 일찍 거르는 머신러닝 모델이 생산 공정에서 연구된다.
  quiz:
    question: "초기 쿨롱 효율이 100%보다 낮은 주된 이유는?"
    choices: ["분리막이 이온을 막아서", "SEI 형성에 쓰인 리튬이 돌아오지 않아서", "집전체가 녹아서", "측정 장비 오차 때문에"]
    answer_index: 1
    explanation: "첫 충전 중 SEI를 만드는 데 소모된 리튬은 방전 때 양극으로 돌아오지 않아 비가역 용량이 된다."
  keywords:
    - {ko: "포메이션", en: "formation"}
    - {ko: "초기 쿨롱 효율", en: "initial Coulombic efficiency"}
    - {ko: "에이징", en: "aging"}
  next_topics: ["SEI(고체 전해질 계면)의 형성과 조성", "쿨롱 효율과 에너지 효율"]
  references: []

- concept: "용매화 구조와 고농도·국부고농도 전해질"
  title: "고농도·국부고농도 전해질: 음이온이 껍질 안으로 들어오면"
  level: 심화
  one_liner: >-
    염 농도를 크게 높이면 리튬 주변에 자유 용매가 거의 없어지고 음이온이 껍질에 들어와, 음이온 유래의 무기질 SEI가 생기고 산화 안정성도 좋아진다.
  sections:
    - heading: "용매화 구조"
      body: >-
        일반 농도(약 1 M)에서는 리튬 이온이 주로 용매 분자에 둘러싸이고 음이온과는 떨어져 있다(용매 분리 이온쌍). 농도를 3~5 M 이상으로 높이면 용매가 부족해
        음이온이 리튬과 직접 맞닿는 접촉 이온쌍과 여러 리튬·음이온이 얽힌 응집체가 많아진다.
    - heading: "고농도 전해질의 장점"
      body: >-
        리튬과 결합하지 않은 자유 용매가 줄어들어 산화되기 쉬운 용매가 적어지고, 음이온이 껍질 안에 있어 먼저 환원되면서 LiF가 풍부한 무기질 SEI가 생긴다.
        그 결과 리튬 금속의 쿨롱 효율이 높아지고 고전압 안정성도 좋아진다. 대신 점도가 높고 젖음성이 나쁘며 염이 비싸다.
    - heading: "국부고농도 전해질"
      body: >-
        고농도 전해질에 리튬염을 거의 녹이지 않는 희석제(주로 불소화 에테르)를 섞으면, 리튬 주변은 고농도 용매화 구조를 유지하면서 전체 농도와 점도는 낮출 수 있다.
        이것이 국부고농도 전해질(LHCE)이다. 희석제는 용매화에 거의 참여하지 않고 '뼈대만 빌려주는' 역할을 한다.
  formula: |
    용매화 종 분류: SSIP(용매 분리 이온쌍) → CIP(접촉 이온쌍) → AGG(응집체)
    농도↑ 또는 희석제 사용 시 CIP·AGG 비율 ↑
  example: >-
    라만 분광으로 용매와 음이온의 특정 진동 피크를 보면, 농도를 높일수록 자유 용매 피크는 줄고 리튬과 결합한 음이온 피크가 커지는 것이 관찰된다.
  misconception: >-
    국부고농도 전해질의 희석제가 아무 역할도 하지 않는 것은 아니다. 일부는 SEI 형성에 참여하거나 계면 구조에 영향을 준다는 연구도 있다.
  connection: >-
    분자동역학과 머신러닝을 결합해 용매·염·희석제 조합의 용매화 구조와 전도도를 예측하고, 실험 전에 유망한 조합을 고르는 연구가 활발하다.
  quiz:
    question: "고농도 전해질에서 SEI가 LiF가 풍부해지는 주된 이유는?"
    choices: ["용매가 먼저 환원되어서", "음이온이 용매화 껍질에 들어와 먼저 환원되어서", "희석제가 고체가 되어서", "양극에서 산소가 나와서"]
    answer_index: 1
    explanation: "자유 용매가 줄고 음이온이 리튬과 직접 맞닿아 먼저 환원되면서, 음이온 유래 무기물(LiF 등)이 SEI를 이룬다."
  keywords:
    - {ko: "고농도 전해질", en: "high-concentration electrolyte"}
    - {ko: "국부고농도 전해질", en: "localized high-concentration electrolyte"}
    - {ko: "접촉 이온쌍", en: "contact ion pair"}
  next_topics: ["탈용매화(desolvation)와 계면 전하전달", "라만 분광법", "리튬 금속 음극과 덴드라이트"]
  references: ["Y. Yamada, J. Wang, S. Ko, E. Watanabe, A. Yamada, Advances and issues in developing salt-concentrated battery electrolytes, Nature Energy, 2019"]

- concept: "계면 저항의 분리와 해석"
  title: "계면 저항 분리: 어떤 저항이 얼마나 큰지 나누어 보기"
  level: 심화
  one_liner: >-
    셀 전체 저항은 옴 저항, SEI 저항, 전하전달 저항, 확산 저항이 합쳐진 것이며, 이를 나누려면 시간 영역·주파수 영역 측정과 3전극 셀을 함께 쓴다.
  sections:
    - heading: "저항의 종류와 시간 규모"
      body: >-
        전류를 흘리면 전압이 즉시 떨어지는 부분은 전해질·집전체 등의 옴 저항이다. 밀리초~초 단위로 나타나는 부분은 SEI 통과와 전하전달 같은 계면 과정이고,
        수 초 이상에 걸친 부분은 고체 내 확산이다. 각 과정의 시간 상수가 다르다는 점이 저항을 나누는 근거가 된다.
    - heading: "EIS와 DRT"
      body: >-
        EIS는 주파수를 바꾸며 임피던스를 재므로 시간 상수가 다른 과정이 나이퀴스트 그래프에서 서로 다른 반원으로 나타난다. 하지만 반원이 겹치면 구분이 어렵다.
        완화 시간 분포(DRT) 분석은 임피던스를 시간 상수별 분포로 바꾸어 겹친 과정을 피크로 분리해 보여 준다.
    - heading: "양극과 음극 나누기"
      body: >-
        2전극 셀의 임피던스는 양극과 음극이 합쳐져 있다. 기준 전극을 넣은 3전극 셀이나, 같은 전극 두 개로 만든 대칭 셀을 쓰면 전극별 기여를 나눌 수 있다.
        온도를 바꿔 측정하면 과정마다 활성화 에너지가 달라 구분에 도움이 된다.
  formula: |
    R_total ≈ R_ohm + R_SEI + R_ct + R_diff
    시간 상수 τ = R·C  (과정마다 다름) → 주파수 f ≈ 1/(2πτ)에서 반응
  example: >-
    음극 대칭 셀과 양극 대칭 셀의 EIS를 각각 측정해 합치면 풀셀 임피던스와 거의 같게 나온다. 이를 통해 사이클 후 저항 증가가 주로 어느 전극에서 왔는지 알 수 있다.
  misconception: >-
    나이퀴스트 그래프의 반원 하나가 곧 하나의 물리 과정이라고 생각하기 쉽지만, 여러 과정이 겹쳐 하나처럼 보이거나 하나의 과정이 다공성 전극 효과로 찌그러져 보일 수 있다.
  connection: >-
    EIS 스펙트럼 전체를 입력으로 등가회로 선택과 파라미터 추정을 자동화하거나, 바로 SOH를 예측하는 머신러닝 모델이 활발히 연구된다.
  quiz:
    question: "전류를 가한 직후 '즉시' 나타나는 전압 강하에 해당하는 저항은?"
    choices: ["확산 저항", "옴 저항", "SEI 저항", "전하전달 저항"]
    answer_index: 1
    explanation: "옴 저항(전해질·집전체·접촉)은 시간 상수가 거의 없어 전류 인가 즉시 전압 강하로 나타난다."
  keywords:
    - {ko: "옴 저항", en: "ohmic resistance"}
    - {ko: "완화 시간 분포", en: "distribution of relaxation times"}
    - {ko: "대칭 셀", en: "symmetric cell"}
  next_topics: ["전기화학 임피던스 분광법(EIS)과 등가회로", "DRT(완화 시간 분포) 분석", "2전극·3전극 셀과 기준 전극"]
  references: []
