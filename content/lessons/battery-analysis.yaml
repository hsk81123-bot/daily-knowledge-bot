# 배터리 › 분석법 공부 노트

- concept: "순환 전압전류법(CV)"
  title: "CV: 전위를 왕복하며 반응의 지문을 찍는다"
  level: 입문
  one_liner: >-
    순환 전압전류법은 전위를 일정한 속도로 올렸다 내리며 전류를 측정해, 어떤 전위에서 어떤 반응이 얼마나 가역적으로 일어나는지를 한 그래프로 보여 준다.
  sections:
    - heading: "측정 방법"
      body: >-
        작업 전극의 전위를 일정한 주사 속도(예: 0.1 mV/s~100 mV/s)로 한쪽 끝까지 바꾼 뒤 되돌아오며 전류를 기록한다. 가로축은 전위, 세로축은 전류다.
        산화 반응이 일어나는 전위에서는 양의 전류 피크가, 환원 반응에서는 음의 피크가 나타난다.
    - heading: "피크 읽기"
      body: >-
        산화 피크와 환원 피크의 전위 차이(ΔEp)가 작을수록 반응이 빠르고 가역적이다. 용액 속 빠른 1전자 반응의 이상값은 25 °C에서 약 59 mV다. 피크 전류의 크기는 반응량과 속도를 반영하며,
        사이클을 반복할 때 피크가 줄거나 이동하면 열화나 피막 형성을 뜻한다.
    - heading: "주사 속도 분석"
      body: >-
        주사 속도 v를 바꾸며 피크 전류 i_p를 보면, 확산 지배 반응은 i_p ∝ √v, 표면(용량성) 반응은 i_p ∝ v다. log i_p와 log v의 기울기(b값)가 0.5에 가까우면 확산 지배,
        1에 가까우면 표면 지배로 해석한다. 이 방법으로 의사 커패시터 기여를 나누기도 한다.
  formula: |
    랜들스-세브식(확산 지배, 25 °C): i_p = 2.69×10⁵ · n^(3/2) · A · D^(1/2) · C · v^(1/2)
    b값: i_p = a · v^b  (b≈0.5 확산, b≈1 표면)
  example: >-
    흑연 반쪽 셀의 첫 CV에서는 약 0.6~0.8 V에 두 번째 사이클부터 사라지는 환원 피크가 보이는데, 이것이 전해질 분해에 의한 SEI 형성 피크다.
  misconception: >-
    배터리 전극의 CV 피크 간격이 크다고 반응이 반드시 느린 것은 아니다. 전극 두께에 따른 저항, 상전이의 히스테리시스, 리튬 상대 전극의 과전압도 간격을 키운다.
  connection: >-
    CV 곡선 모양을 이미지나 1차원 신호로 보고 반응 메커니즘 종류(가역, 준가역, 촉매 반응 등)를 분류하는 딥러닝 모델이 보고된 바 있다.
  quiz:
    question: "log(피크 전류) 대 log(주사 속도) 기울기가 약 1이면 반응은 주로?"
    choices: ["확산 지배", "표면(용량성) 지배", "옴 저항 지배", "측정 오류"]
    answer_index: 1
    explanation: "표면 반응·용량성 전류는 주사 속도에 비례(b≈1)하고, 확산 지배 반응은 √v에 비례(b≈0.5)한다."
  keywords:
    - {ko: "순환 전압전류법", en: "cyclic voltammetry"}
    - {ko: "주사 속도", en: "scan rate"}
    - {ko: "피크 분리", en: "peak separation"}
  next_topics: ["전기화학 임피던스 분광법(EIS)과 등가회로", "타펠 식과 타펠 기울기"]
  references: ["N. Elgrishi et al., A practical beginner's guide to cyclic voltammetry, J. Chem. Educ., 2018"]

- concept: "전기화학 임피던스 분광법(EIS)과 등가회로"
  title: "EIS: 주파수를 바꿔 가며 저항을 분해한다"
  level: 중급
  one_liner: >-
    EIS는 작은 교류 신호를 여러 주파수로 가해 응답을 재고, 시간 상수가 다른 과정(옴 저항, 계면 반응, 확산)을 나이퀴스트 그래프 위에서 분리해 보여 준다.
  sections:
    - heading: "원리"
      body: >-
        평형 근처에서 수 mV의 작은 사인파 전압(또는 전류)을 가하고 전류(또는 전압)의 진폭과 위상차를 잰다. 주파수를 보통 수 MHz~수 mHz 범위에서 바꾸며 측정한다.
        빠른 과정은 높은 주파수에, 느린 과정은 낮은 주파수에 반응하므로 주파수별 응답이 과정별 정보를 담는다.
    - heading: "나이퀴스트 그래프"
      body: >-
        가로축 Z′(실수부), 세로축 −Z″(허수부)로 그린다. 고주파에서 실수축과 만나는 점이 옴 저항이고, 이어지는 반원(들)은 SEI와 전하전달처럼 저항과 정전용량이 병렬인 과정,
        저주파의 45° 직선은 확산(바르부르크 임피던스)이다. 반원 지름이 해당 저항 크기다.
    - heading: "등가회로 피팅"
      body: >-
        측정 데이터를 R, C, CPE(일정 위상 요소), 바르부르크 요소로 만든 회로에 맞춰 각 값을 구한다. 대표적인 것은 R_s − (R_ct ∥ CPE) − W 구조의 랜들스 회로다.
        다만 서로 다른 회로가 같은 데이터에 똑같이 잘 맞을 수 있어, 회로 선택은 물리적 근거와 함께 해야 한다. 측정 전 크라머스-크로니히 검사로 데이터 신뢰성을 확인한다.
  formula: |
    Z(ω) = V(ω)/I(ω),  RC 병렬: Z = R / (1 + jωRC)
    바르부르크: Z_W = σ·ω^(−1/2)·(1 − j)
    반원 정점 주파수: f = 1 / (2πRC)
  example: >-
    사이클 전후 EIS를 비교하면 옴 저항은 거의 그대로인데 중간 주파수 반원이 커지는 경우가 많다. 이는 전해질보다 계면(SEI·CEI, 전하전달) 저항이 늘었다는 신호다.
  misconception: >-
    등가회로 피팅 오차가 작다고 그 회로가 맞다는 뜻은 아니다. 소자 수를 늘리면 어떤 데이터도 잘 맞출 수 있으므로, 단순하고 해석 가능한 회로를 고르고 다른 측정으로 확인해야 한다.
  connection: >-
    EIS 스펙트럼은 SOH 추정용 머신러닝의 대표 입력이다. 스펙트럼 전체를 특징으로 써서 가우시안 프로세스로 남은 수명을 예측한 연구가 잘 알려져 있다.
  quiz:
    question: "나이퀴스트 그래프에서 고주파 쪽이 실수축과 만나는 값은?"
    choices: ["전하전달 저항", "옴(직렬) 저항", "바르부르크 계수", "이중층 정전용량"]
    answer_index: 1
    explanation: "고주파에서는 축전기가 단락처럼 행동해 직렬 옴 저항(전해질·접촉 등)만 남는다."
  keywords:
    - {ko: "전기화학 임피던스", en: "electrochemical impedance"}
    - {ko: "등가회로", en: "equivalent circuit"}
    - {ko: "바르부르크 임피던스", en: "Warburg impedance"}
  next_topics: ["DRT(완화 시간 분포) 분석", "계면 저항의 분리와 해석"]
  references: ["M. E. Orazem, B. Tribollet, Electrochemical Impedance Spectroscopy, 2nd ed., 2017", "Y. Zhang et al., Identifying degradation patterns of lithium ion batteries from impedance spectroscopy using machine learning, Nature Communications, 2020"]

- concept: "GITT로 확산 계수 구하기"
  title: "GITT: 짧게 충전하고 오래 쉬며 확산을 읽는다"
  level: 중급
  one_liner: >-
    GITT는 짧은 정전류 펄스와 긴 휴지를 반복하며, 펄스 중 전압 변화와 휴지 후 평형 전압 변화로 리튬 함량별 확산 계수와 OCV를 함께 얻는 방법이다.
  sections:
    - heading: "측정 절차"
      body: >-
        작은 전류(예: C/20 정도)를 짧은 시간(예: 10분) 흘린 뒤, 전압이 거의 평형에 이를 때까지(예: 1시간 이상) 쉰다. 이것을 전체 SOC 범위에 걸쳐 반복한다.
        각 휴지 끝 전압을 이으면 준평형 OCV 곡선이 되고, 각 펄스의 전압 응답으로 그 SOC의 확산 계수를 계산한다.
    - heading: "계산식"
      body: >-
        Weppner와 Huggins가 제시한 식은 펄스 시간이 확산 시간보다 충분히 짧고(τ ≪ L²/D), 전압이 √t에 대해 선형으로 변한다는 가정을 쓴다.
        펄스 중 전압 변화 ΔE_τ(옴 강하 제외)와 휴지 전후 평형 전압 변화 ΔE_s를 넣어 D를 구한다.
    - heading: "해석상 주의"
      body: >-
        식에 들어가는 확산 길이 L(입자 크기)과 몰 부피·면적 가정에 따라 값이 크게 달라진다. 2상 반응 구간에서는 ΔE_s가 거의 0이라 식이 성립하지 않고,
        확산 계수가 비정상적으로 작게 나온다. 그래서 GITT 확산 계수는 절대값보다 같은 셀 안 SOC에 따른 추세를 보는 데 더 의미가 있다.
  formula: |
    D = (4 / πτ) · (m_B·V_M / M_B·S)² · (ΔE_s / ΔE_τ)²   (τ ≪ L²/D)
    m_B, M_B: 활물질 질량·몰질량, V_M: 몰 부피, S: 계면 면적
  example: >-
    NCM 셀의 GITT 결과에서 높은 충전 상태로 갈수록 확산 계수가 몇 배 줄어드는 경향이 보고되는데, 층간 간격이 줄어드는 구조 변화와 연결해 해석한다.
  misconception: >-
    GITT 확산 계수를 문헌 값과 그대로 비교하면 안 된다. 면적과 길이를 어떻게 잡았는지에 따라 같은 소재라도 한두 자릿수 차이가 날 수 있다.
  connection: >-
    GITT는 시간이 매우 오래 걸린다. 짧은 펄스 데이터로 전체 OCV·확산 곡선을 추정하는 신경망이나 베이지안 추정 방법이 측정 시간을 줄이는 데 연구된다.
  quiz:
    question: "GITT 확산 계수 식이 2상 반응 구간에서 잘 맞지 않는 이유는?"
    choices: ["전류가 너무 커서", "평형 전압 변화 ΔE_s가 거의 0이라서", "옴 저항이 없어서", "온도가 일정해서"]
    answer_index: 1
    explanation: "2상 공존 구간은 전압이 평탄해 ΔE_s≈0이 되고, 식의 단일상 확산 가정도 깨진다."
  keywords:
    - {ko: "정전류 간헐 적정법", en: "galvanostatic intermittent titration technique"}
    - {ko: "준평형 OCV", en: "quasi-equilibrium OCV"}
    - {ko: "확산 계수", en: "chemical diffusion coefficient"}
  next_topics: ["Fick 확산과 고체 내 확산 계수", "OCV, 엔트로피 계수, 가역 발열"]
  references: ["W. Weppner, R. A. Huggins, Determination of the kinetic parameters of mixed-conducting electrodes and application to the system Li3Sb, J. Electrochem. Soc., 1977"]

- concept: "dQ/dV 미분 용량 분석"
  title: "dQ/dV: 평평한 곡선 속 상전이를 피크로 바꾸기"
  level: 중급
  one_liner: >-
    충방전 곡선의 전압-용량 관계를 미분하면 평탄 구간이 피크로 바뀌어, 상전이 위치와 크기를 보고 셀을 해체하지 않고도 열화 원인을 추정할 수 있다.
  sections:
    - heading: "원리"
      body: >-
        전압이 거의 변하지 않으면서 용량이 많이 들어가는 구간(2상 반응, 스테이징)은 dQ/dV가 크다. 그래서 전압 곡선의 평탄 구간이 dQ/dV 그래프에서는 날카로운 피크가 된다.
        반대 표현인 dV/dQ는 피크 사이 간격이 전극 용량과 연결되어 전극별 분석에 자주 쓰인다.
    - heading: "측정과 처리"
      body: >-
        과전압 영향을 줄이려고 아주 느린 전류(C/20~C/25)로 측정하는 것이 좋다. 데이터를 그대로 미분하면 잡음이 커지므로, 전압 간격으로 다시 샘플링하거나
        사비츠키-골레이 필터 같은 평활화를 쓴다. 평활화를 너무 세게 하면 피크가 뭉개진다.
    - heading: "열화 해석"
      body: >-
        피크가 전체적으로 이동하면 저항 증가(과전압)를, 특정 전극에 해당하는 피크가 작아지면 그 전극의 활물질 손실(LAM)을 의심한다. 피크가 이동하며 양쪽 끝 피크가 사라지면
        양극과 음극의 정렬이 어긋난 것으로 리튬 손실(LLI)을 뜻하는 경우가 많다.
  formula: |
    IC(V) = dQ/dV ≈ ΔQ / ΔV  (전압 간격으로 재샘플링 후)
    DV(Q) = dV/dQ
  example: >-
    NCM/흑연 셀의 방전 dQ/dV에는 흑연 스테이징에서 온 피크들이 뚜렷이 보인다. 사이클이 진행될수록 특정 피크가 줄어드는 양상으로 흑연 쪽 리튬 손실을 추적할 수 있다.
  misconception: >-
    dQ/dV 피크 하나가 꼭 소재 하나의 상전이에 대응하는 것은 아니다. 풀셀에서는 양극과 음극 신호가 겹쳐 나타나므로 반쪽 셀 기준 곡선과 함께 해석해야 한다.
  connection: >-
    dQ/dV 곡선의 피크 높이·위치·면적은 수명 예측 머신러닝의 대표 특징이다. 초기 사이클 사이의 방전 곡선 차이로 수명을 예측한 연구도 이 생각을 확장한 것이다.
  quiz:
    question: "전압 곡선의 평탄 구간은 dQ/dV 그래프에서 어떻게 보이나?"
    choices: ["0에 가까운 평평한 선", "날카로운 피크", "음의 값", "아무 변화 없음"]
    answer_index: 1
    explanation: "작은 전압 변화에 많은 용량이 들어가므로 dQ/dV가 커져 피크가 된다."
  keywords:
    - {ko: "미분 용량", en: "incremental capacity"}
    - {ko: "미분 전압", en: "differential voltage"}
    - {ko: "평활화", en: "smoothing"}
  next_topics: ["사이클 수명 시험과 열화 모드 분리(LLI, LAM)", "흑연 음극과 리튬 삽입(staging)"]
  references: ["M. Dubarry, C. Truchot, B. Y. Liaw, Synthesize battery degradation modes via a diagnostic and prognostic model, J. Power Sources, 2012"]

- concept: "DRT(완화 시간 분포) 분석"
  title: "DRT: 겹친 반원을 시간 상수별로 풀어 헤치기"
  level: 심화
  one_liner: >-
    DRT 분석은 임피던스를 무수히 많은 RC 요소의 합으로 보고 각 시간 상수에 얼마나 저항이 있는지 분포로 나타내, 등가회로를 미리 정하지 않고 과정을 분리한다.
  sections:
    - heading: "아이디어"
      body: >-
        EIS 반원은 과정마다 시간 상수 τ = RC를 갖는다. 실제 셀에서는 반원이 서로 겹치고 찌그러져 몇 개의 과정이 있는지조차 알기 어렵다. DRT는 임피던스를 τ의 연속 분포 g(τ)로 표현해,
        분포의 피크 위치(시간 상수)와 넓이(저항)를 읽는다.
    - heading: "계산"
      body: >-
        측정 임피던스에서 g(τ)를 구하는 것은 잡음에 매우 민감한 역문제다. 그래서 티호노프 정규화(릿지 회귀) 같은 방법으로 매끄러운 해를 구한다.
        정규화 강도를 너무 크게 하면 피크가 합쳐지고, 너무 작으면 가짜 피크가 생긴다. 가우시안 프로세스 같은 베이지안 방법으로 불확실성까지 구하는 접근도 있다.
    - heading: "해석"
      body: >-
        피크마다 어떤 물리 과정인지는 DRT가 알려 주지 않는다. 온도를 바꾸거나(활성화 에너지), SOC를 바꾸거나, 대칭 셀로 전극을 나누어 피크의 행동을 보고 SEI, 전하전달, 접촉 저항 등에 대응시킨다.
        확산처럼 RC로 잘 표현되지 않는 과정은 분포가 넓게 퍼져 해석이 어렵다.
  formula: |
    Z(ω) = R∞ + ∫ g(τ) / (1 + jωτ) d(ln τ)
    정규화: min ‖Z_meas − A·g‖² + λ‖L·g‖²
  example: >-
    풀셀 DRT에서 1~10 ms 부근 피크는 양극 전하전달, 더 빠른 피크는 SEI·접촉으로 해석하는 식으로 셀마다 대응 표를 만든다. 사이클에 따라 어느 피크가 커지는지로 열화 위치를 추정한다.
  misconception: >-
    DRT 피크 개수가 곧 물리 과정 개수라고 단정하기 쉽지만, 정규화 파라미터와 측정 잡음에 따라 피크가 생기거나 사라진다. 여러 조건에서 일관되게 나타나는 피크만 믿어야 한다.
  connection: >-
    DRT는 정규화가 들어간 회귀 문제이므로 머신러닝과 직접 닮았다. 정규화 강도를 교차검증으로 고르거나, 신경망으로 DRT를 바로 추정하는 연구도 있다.
  quiz:
    question: "DRT 계산에 정규화가 필요한 이유는?"
    choices: ["계산이 너무 빨라서", "잡음에 민감한 역문제라서", "임피던스가 실수라서", "등가회로를 먼저 정해야 해서"]
    answer_index: 1
    explanation: "임피던스에서 분포를 구하는 것은 불안정한 역문제여서, 정규화로 매끄럽고 안정된 해를 얻는다."
  keywords:
    - {ko: "완화 시간 분포", en: "distribution of relaxation times"}
    - {ko: "티호노프 정규화", en: "Tikhonov regularization"}
    - {ko: "역문제", en: "inverse problem"}
  next_topics: ["전기화학 임피던스 분광법(EIS)과 등가회로", "L1·L2 정규화", "가우시안 프로세스 회귀"]
  references: ["T. H. Wan, M. Saccoccio, C. Chen, F. Ciucci, Influence of the discretization methods on the distribution of relaxation times deconvolution, Electrochimica Acta, 2015"]

- concept: "XRD와 operando XRD"
  title: "XRD: 결정 구조의 변화를 실시간으로 보기"
  level: 중급
  one_liner: >-
    XRD는 결정면 간격에 따른 회절 피크로 상과 격자 상수를 알려 주며, 전지를 작동시키면서 측정하는 operando XRD는 충방전 중 구조 변화를 실시간으로 추적한다.
  sections:
    - heading: "원리"
      body: >-
        X선이 일정한 간격으로 배열된 원자면에서 반사될 때 경로 차이가 파장의 정수배이면 보강 간섭이 일어난다(브래그 법칙). 피크 위치로 면간 거리와 격자 상수를,
        피크 세기 비로 원자 배열(예: 양이온 혼합)을, 피크 폭으로 결정자 크기와 미세 변형을 알 수 있다.
    - heading: "ex situ와 operando"
      body: >-
        ex situ는 셀을 특정 상태에서 멈추고 해체해 전극을 따로 측정한다. 간단하지만 해체·세척 중 공기 노출과 이완으로 상태가 바뀔 수 있다. operando는 X선이 통과하는 창을 단 셀을
        작동시키며 연속 측정해, 상전이가 언제 어떤 순서로 일어나는지와 중간상을 볼 수 있다. 빠른 측정을 위해 방사광 가속기를 많이 쓴다.
    - heading: "배터리에서 보는 것"
      body: >-
        층상 양극의 c축·a축 변화, 고니켈 소재의 H2→H3 상전이, 흑연의 스테이징, LFP의 두 상 비율 변화 등을 추적한다. 리트벨트 정련으로 격자 상수와 상 분율을 정량한다.
        다만 비정질 물질(SEI 상당수)은 회절 피크가 없어 XRD로 보기 어렵다.
  formula: |
    브래그 법칙: nλ = 2d·sinθ
    셰러 식(결정자 크기): L = Kλ / (β·cosθ)
  example: >-
    NCM811 operando XRD에서 높은 충전 상태로 갈 때 (003) 피크가 높은 각도로 크게 이동하는 것이 보인다. 이는 c축 격자 상수가 급격히 줄어드는 것을 뜻하며 입자 균열과 연결된다.
  misconception: >-
    XRD 피크가 없다고 그 물질이 없다는 뜻은 아니다. 비정질이거나 양이 적거나 결정이 매우 작으면 보이지 않는다.
  connection: >-
    operando XRD는 수천 개의 패턴을 만든다. 비지도 학습(NMF, 군집화)으로 패턴을 상별로 자동 분해하거나, CNN으로 상을 식별하는 방법이 데이터 처리에 쓰인다.
  quiz:
    question: "XRD 피크가 높은 2θ 쪽으로 이동하면 면간 거리 d는?"
    choices: ["커진다", "작아진다", "변하지 않는다", "0이 된다"]
    answer_index: 1
    explanation: "nλ = 2d·sinθ에서 θ가 커지면 d는 작아진다. 즉 격자가 수축했다는 뜻이다."
  keywords:
    - {ko: "X선 회절", en: "X-ray diffraction"}
    - {ko: "브래그 법칙", en: "Bragg's law"}
    - {ko: "작동 중 측정", en: "operando measurement"}
  next_topics: ["양이온 혼합(cation mixing)", "X선 흡수 분광법(XANES/EXAFS)"]
  references: []

- concept: "XPS로 SEI 조성 분석하기"
  title: "XPS: 표면 수 nm의 화학 결합을 읽는다"
  level: 중급
  one_liner: >-
    XPS는 X선으로 튀어나온 광전자의 결합 에너지를 재서 표면 수 nm의 원소와 화학 상태를 알려 주며, SEI·CEI 조성 분석의 대표 도구다.
  sections:
    - heading: "원리"
      body: >-
        단색 X선을 쪼이면 원자의 내각 전자가 튀어나온다. 튀어나온 전자의 운동 에너지를 재면 결합 에너지를 알 수 있고, 이는 원소와 그 원소의 화학적 환경(산화 상태, 결합 상대)에 따라 조금씩 다르다.
        전자가 고체를 빠져나올 수 있는 깊이가 수 nm라서 매우 표면에 민감하다.
    - heading: "SEI에서 보는 피크"
      body: >-
        C 1s에서는 C–C/C–H, C–O, C=O, 탄산염(CO₃) 성분을, O 1s에서는 Li₂O와 탄산염·유기물을, F 1s에서는 LiF와 P–F(LiPF₆ 잔류·분해물)를, Li 1s와 P 2p도 함께 본다.
        각 스펙트럼을 여러 성분으로 피크 분리(피팅)해 비율을 구한다.
    - heading: "깊이 분석과 주의"
      body: >-
        아르곤 이온으로 표면을 조금씩 깎으며 측정하면 깊이별 조성(바깥은 유기물, 안쪽은 무기물 같은 구조)을 볼 수 있다. 하지만 이온 식각이 SEI 성분을 분해할 수 있고,
        시료를 공기에 노출하면 바로 변질되므로 비활성 분위기 이송이 필수다. 세척 용매도 결과를 바꿀 수 있다.
  formula: |
    E_binding = hν − E_kinetic − φ_spectrometer
    분석 깊이 ≈ 3λ (λ: 비탄성 평균 자유 행로, 수 nm)
  example: >-
    FEC를 넣은 셀과 넣지 않은 셀의 음극 F 1s 스펙트럼을 비교하면, FEC 셀에서 약 685 eV 부근 LiF 성분이 더 크게 나타나는 결과가 흔히 보고된다.
  misconception: >-
    XPS 피크 비율이 곧 SEI 전체의 조성이라고 보기 쉽지만, XPS는 맨 위 수 nm만 본다. SEI 두께보다 얕을 수 있어 깊이 분석이나 다른 기법과 함께 봐야 한다.
  connection: >-
    피크 분리는 사람마다 결과가 다를 수 있다. 참조 스펙트럼으로 학습한 신경망이나 베이지안 피팅으로 피크 분리를 자동화·객관화하려는 연구가 있다.
  quiz:
    question: "XPS가 표면에 매우 민감한 이유는?"
    choices: ["X선이 표면에서만 흡수되어서", "광전자가 빠져나올 수 있는 깊이가 수 nm라서", "시료가 항상 얇아서", "진공 때문에"]
    answer_index: 1
    explanation: "X선은 깊이 들어가지만, 튀어나온 전자가 에너지를 잃지 않고 빠져나올 수 있는 깊이가 수 nm뿐이다."
  keywords:
    - {ko: "X선 광전자 분광법", en: "X-ray photoelectron spectroscopy"}
    - {ko: "결합 에너지", en: "binding energy"}
    - {ko: "깊이 분석", en: "depth profiling"}
  next_topics: ["ToF-SIMS 깊이 분석", "SEI(고체 전해질 계면)의 형성과 조성"]
  references: []

- concept: "SEM·TEM 단면 분석"
  title: "SEM·TEM: 입자와 계면을 눈으로 본다"
  level: 입문
  one_liner: >-
    SEM은 표면과 단면의 형태를 수 nm 해상도로, TEM은 얇은 시편을 투과해 원자 배열과 수 nm 계면층까지 보여 주는 전자 현미경이다.
  sections:
    - heading: "SEM"
      body: >-
        주사 전자 현미경(SEM)은 전자빔으로 시료 표면을 훑으며 튀어나오는 이차전자·후방산란전자로 영상을 만든다. 입자 크기와 모양, 전극 다공 구조, 균열을 보는 데 쓰인다.
        EDS를 붙이면 원소 분포도 볼 수 있다. 전극 내부를 보려면 이온빔(FIB)이나 이온 밀링으로 깨끗한 단면을 만든다.
    - heading: "TEM"
      body: >-
        투과 전자 현미경(TEM)은 100 nm 이하로 얇게 만든 시편을 전자가 통과하게 해 영상을 얻는다. 고분해능 TEM이나 STEM으로 원자 배열을 볼 수 있어, 입자 표면의 암염층이나
        수 nm 코팅층을 확인할 수 있다. EELS로 원소의 산화 상태도 분석한다.
    - heading: "주의할 점"
      body: >-
        전자빔이 SEI 같은 민감한 물질을 손상시킬 수 있다. 리튬 금속과 SEI는 극저온(cryo) TEM으로 손상을 줄여 관찰하는 방법이 쓰인다. 또 현미경은 아주 작은 영역만 보므로,
        보이는 장면이 전체를 대표하는지 여러 위치에서 확인해야 한다.
  formula: |
    분해능 한계(대략): d ≈ 0.61λ / NA  (전자는 파장 λ가 매우 짧아 원자 수준 가능)
    가속 전압 200 kV 전자 λ ≈ 0.0025 nm
  example: >-
    수백 사이클 후 양극 단면을 FIB-SEM으로 보면 다결정 입자 내부에 균열이 보이고, 같은 입자를 TEM으로 보면 표면 수 nm가 암염 구조로 바뀐 것을 확인할 수 있다.
  misconception: >-
    고배율 영상 한 장이 소재 전체의 상태를 보여 준다고 생각하기 쉽지만, 측정 영역은 매우 작다. 통계적으로 의미 있는 결론에는 많은 영역의 분석이 필요하다.
  connection: >-
    수백 장의 SEM 영상에서 입자와 균열을 자동 분할하는 U-Net 같은 이미지 분할 모델을 쓰면 사람이 하던 정량 분석을 빠르고 객관적으로 할 수 있다.
  quiz:
    question: "입자 표면 수 nm의 원자 배열 변화를 직접 보기에 가장 알맞은 기법은?"
    choices: ["광학 현미경", "고분해능 TEM", "XRD", "CV"]
    answer_index: 1
    explanation: "고분해능 TEM·STEM은 원자 배열을 직접 영상화해 표면 상전이와 얇은 코팅층을 볼 수 있다."
  keywords:
    - {ko: "주사 전자 현미경", en: "scanning electron microscopy"}
    - {ko: "투과 전자 현미경", en: "transmission electron microscopy"}
    - {ko: "극저온 전자 현미경", en: "cryo-electron microscopy"}
  next_topics: ["단결정 양극재와 입자 미세균열", "고니켈 양극의 상전이와 산소 방출"]
  references: ["Y. Li et al., Atomic structure of sensitive battery materials and interfaces revealed by cryo-electron microscopy, Science, 2017"]

- concept: "ToF-SIMS 깊이 분석"
  title: "ToF-SIMS: 표면을 깎으며 분자 조각을 센다"
  level: 심화
  one_liner: >-
    ToF-SIMS는 이온빔으로 표면에서 튀어나온 이차 이온의 질량을 비행 시간으로 재서, 매우 높은 감도로 SEI 성분의 깊이와 면 분포를 보여 준다.
  sections:
    - heading: "원리"
      body: >-
        일차 이온빔(예: Bi⁺ 클러스터)이 표면을 때리면 원자와 분자 조각이 이온으로 튀어나온다. 이들을 같은 전압으로 가속해 비행관을 지나게 하면 가벼운 이온이 먼저 도착하므로,
        도착 시간으로 질량을 알 수 있다. ppm 이하 수준까지 검출할 만큼 감도가 높고 리튬 같은 가벼운 원소도 잘 본다.
    - heading: "깊이와 3차원 분석"
      body: >-
        분석용 빔과 별도로 식각용 빔(예: Cs⁺, Ar 클러스터)으로 표면을 조금씩 깎으며 반복 측정하면 깊이 분포를 얻는다. 면 분포를 쌓으면 3차원 성분 지도가 된다.
        LiF⁻, C₂HO⁻, PO₂⁻ 같은 조각 이온의 깊이 분포로 SEI의 층 구조를 추정한다.
    - heading: "한계"
      body: >-
        이온화 효율이 성분과 주변 환경에 따라 크게 달라(매트릭스 효과) 정량이 어렵다. 그래서 주로 상대 비교에 쓴다. 조각 이온이 원래 어떤 화합물에서 왔는지 해석이 필요하고,
        식각 속도가 물질마다 달라 깊이 눈금도 근사적이다. XPS와 함께 쓰는 경우가 많다.
  formula: |
    비행 시간: t = L · √(m / (2·z·e·U))  → t ∝ √(m/z)
    L: 비행 거리, U: 가속 전압
  example: >-
    사이클한 흑연 음극을 깊이 분석하면 표면 쪽에는 유기 조각 이온이, 더 깊은 곳에는 LiF⁻·Li₂O 관련 이온이 많아, 바깥 유기층과 안쪽 무기층의 SEI 구조와 맞는 결과가 나온다.
  misconception: >-
    이온 세기가 크면 그 성분이 많다고 보기 쉽지만, 매트릭스 효과 때문에 다른 성분과의 세기 비교로 양을 바로 말할 수는 없다.
  connection: >-
    ToF-SIMS 스펙트럼은 수백 개 질량 채널을 가진 고차원 데이터라 PCA나 NMF 같은 차원 축소로 성분을 분리하는 것이 사실상 표준 분석 방법이다.
  quiz:
    question: "ToF-SIMS에서 이온의 질량을 구분하는 원리는?"
    choices: ["빛의 파장", "비행 시간 차이", "자기장 세기만", "온도 변화"]
    answer_index: 1
    explanation: "같은 에너지로 가속하면 무거운 이온일수록 느려 비행 시간이 길어진다(t ∝ √(m/z))."
  keywords:
    - {ko: "비행시간형 이차이온 질량분석", en: "time-of-flight secondary ion mass spectrometry"}
    - {ko: "매트릭스 효과", en: "matrix effect"}
    - {ko: "깊이 분포", en: "depth profile"}
  next_topics: ["XPS로 SEI 조성 분석하기", "주성분 분석(PCA)"]
  references: []

- concept: "라만 분광법"
  title: "라만 분광법: 빛의 미세한 색 변화로 결합을 본다"
  level: 중급
  one_liner: >-
    라만 분광법은 레이저 빛이 분자·격자 진동과 에너지를 주고받아 생기는 산란광의 파수 변화를 측정해, 탄소의 질서도와 전해질 용매화 구조 등을 알려 준다.
  sections:
    - heading: "원리"
      body: >-
        단색 레이저를 쪼이면 대부분은 같은 에너지로 산란(레일리 산란)되지만, 아주 일부는 분자 진동 에너지만큼 에너지를 잃거나 얻고 산란된다. 이 에너지 차이(라만 이동, cm⁻¹)는
        결합 종류와 대칭성에 따라 정해져 물질의 지문 역할을 한다. 적외선 분광과 상보적인 정보를 준다.
    - heading: "탄소 소재"
      body: >-
        탄소에는 약 1580 cm⁻¹의 G 밴드(흑연 결정의 면내 진동)와 약 1350 cm⁻¹의 D 밴드(결함·가장자리에서 활성화)가 나타난다. I_D/I_G 비로 탄소의 무질서도를 비교하며,
        흑연과 하드카본, 탄소 코팅의 품질 평가에 쓴다. 리튬 삽입 중에는 G 밴드가 갈라지거나 이동해 스테이징을 볼 수 있다.
    - heading: "전해질과 그 밖"
      body: >-
        용매 분자의 특정 진동 피크는 리튬과 결합하면 위치가 바뀐다. 이를 이용해 자유 용매와 리튬에 결합한 용매, 음이온의 접촉 이온쌍 비율을 구한다. 양극 산화물의 금속-산소 진동도 볼 수 있다.
        다만 형광이 강하거나 레이저 가열로 시료가 손상될 수 있어 출력과 파장 선택이 중요하다.
  formula: |
    라만 이동: Δν̃ = 1/λ_incident − 1/λ_scattered  [cm⁻¹]
    탄소 무질서도 지표: I_D / I_G
  example: >-
    고농도 전해질의 라만 스펙트럼에서 농도를 높일수록 자유 용매 피크가 줄고 리튬 결합 용매 피크가 커지는 것을 피크 분리로 정량해 용매화 수를 구한다.
  misconception: >-
    I_D/I_G 값만으로 서로 다른 장비나 레이저 파장의 결과를 비교하면 안 된다. 이 비는 레이저 파장에 따라 달라진다.
  connection: >-
    라만 스펙트럼으로 물질을 식별하는 데 1D CNN 분류기가 잘 작동하며, 작동 중 측정한 스펙트럼 시계열을 군집화해 반응 단계를 자동으로 나누는 연구도 있다.
  quiz:
    question: "탄소 라만 스펙트럼에서 결함·무질서와 관련된 밴드는?"
    choices: ["G 밴드", "D 밴드", "레일리 피크", "2D 밴드만"]
    answer_index: 1
    explanation: "D 밴드(약 1350 cm⁻¹)는 결함·가장자리에서 활성화되어 무질서도가 클수록 커진다."
  keywords:
    - {ko: "라만 분광법", en: "Raman spectroscopy"}
    - {ko: "라만 이동", en: "Raman shift"}
    - {ko: "D/G 밴드", en: "D and G bands"}
  next_topics: ["용매화 구조와 고농도·국부고농도 전해질", "흑연 음극과 리튬 삽입(staging)"]
  references: []

- concept: "X선 흡수 분광법(XANES/EXAFS)"
  title: "XAS: 원소별 산화수와 주변 구조를 골라 본다"
  level: 심화
  one_liner: >-
    XAS는 특정 원소의 흡수단 근처 X선 흡수를 측정해, XANES로 산화 상태를, EXAFS로 주변 원자까지의 거리와 개수를 원소별로 알려 준다.
  sections:
    - heading: "원리"
      body: >-
        X선 에너지를 바꾸며 시료의 흡수를 재면 특정 원소의 내각 전자를 떼어낼 수 있는 에너지(흡수단)에서 흡수가 급격히 커진다. 흡수단 에너지는 원소마다 달라
        Ni, Co, Mn을 하나씩 골라 볼 수 있다. 에너지를 연속으로 바꿔야 해서 주로 방사광 가속기에서 측정한다.
    - heading: "XANES"
      body: >-
        흡수단 근처(대략 수십 eV 범위)의 모양과 위치를 본다. 산화수가 높을수록 흡수단이 높은 에너지 쪽으로 이동하므로, 기준 시료와 비교해 충방전 중 어떤 금속이 얼마나 산화·환원되는지 알 수 있다.
        예를 들어 NCM에서 충전 중 Ni K-흡수단이 크게 이동하는 것은 니켈이 주된 산화환원 원소라는 증거다.
    - heading: "EXAFS"
      body: >-
        흡수단 위 수백 eV에 나타나는 진동은 튀어나간 광전자파가 주변 원자에 산란되어 생긴다. 이를 푸리에 변환하고 피팅하면 중심 원자 주위 원자까지의 거리, 배위수, 무질서도를 얻는다.
        결정성이 낮거나 비정질인 물질의 국소 구조도 볼 수 있어 XRD를 보완한다.
  formula: |
    EXAFS 식(개략): χ(k) = Σ_j N_j·S0²·F_j(k)·e^(−2k²σ_j²)·e^(−2R_j/λ) / (k·R_j²) · sin(2kR_j + δ_j(k))
    N: 배위수, R: 거리, σ²: 무질서도
  example: >-
    operando XAS로 NCM 셀을 충전하면 처음에는 Ni 흡수단이 크게 이동하고, 높은 충전 상태에서는 이동이 둔해지며 산소의 기여(산소 산화환원)가 논의된다.
  misconception: >-
    투과 모드 XAS는 시료 전체의 평균을 보므로 표면 변화는 잘 드러나지 않는다. 표면을 보려면 전자 수율 모드나 연 X선(soft X-ray) 측정이 필요하다.
  connection: >-
    시뮬레이션한 XANES 스펙트럼으로 신경망을 학습시켜 실험 스펙트럼에서 산화수와 배위 구조를 바로 예측하는 연구가 활발하다.
  quiz:
    question: "XANES에서 흡수단이 높은 에너지 쪽으로 이동하면 보통 그 원소의 산화수는?"
    choices: ["낮아졌다", "높아졌다", "변하지 않았다", "0이 되었다"]
    answer_index: 1
    explanation: "산화수가 높을수록 내각 전자가 더 강하게 묶여 흡수단이 높은 에너지로 이동한다."
  keywords:
    - {ko: "X선 흡수 분광법", en: "X-ray absorption spectroscopy"}
    - {ko: "흡수단", en: "absorption edge"}
    - {ko: "배위수", en: "coordination number"}
  next_topics: ["XRD와 operando XRD", "층상 양극재 NCM의 구조와 니켈 함량"]
  references: []

- concept: "고체 NMR"
  title: "고체 NMR: 리튬 원자의 주변을 직접 듣는다"
  level: 심화
  one_liner: >-
    고체 NMR은 ⁷Li·⁶Li·¹⁹F 같은 핵의 공명 주파수 변화로 리튬의 국소 환경과 움직임을 알려 주며, 죽은 리튬이나 SEI 성분, 확산을 정량하는 데 쓰인다.
  sections:
    - heading: "원리"
      body: >-
        자기장 안에서 핵스핀은 특정 주파수(라모어 주파수)의 전파에 공명한다. 주변 전자 구조에 따라 공명 주파수가 조금씩 달라지는데(화학적 이동), 이것으로 핵의 환경을 구분한다.
        고체에서는 방향에 따른 상호작용 때문에 신호가 넓어지므로, 시료를 54.7°(매직각)로 빠르게 회전시키는 MAS로 선폭을 줄인다.
    - heading: "배터리에서"
      body: >-
        ⁷Li NMR에서 리튬 금속은 전도 전자에 의한 나이트 이동으로 약 260 ppm 부근에 신호가 나타나, 이온 상태 리튬(0 ppm 근처)과 쉽게 구분된다. 이를 이용해 죽은 리튬이나 도금된 리튬을 정량한다.
        상자성 양극 소재는 전이금속의 홀전자 때문에 큰 이동이 생겨 해석이 어렵지만 리튬 자리 정보를 준다.
    - heading: "움직임 측정"
      body: >-
        온도에 따른 선폭 좁아짐이나 이완 시간으로 리튬의 도약 속도를 구하고, 자기장 기울기를 쓰는 PFG-NMR로 전해질 속 리튬·음이온의 자기 확산 계수를 각각 잴 수 있다.
        이 값으로 전이수를 추정하기도 한다. 감도가 낮아 시료가 꽤 많이 필요하다는 것이 단점이다.
  formula: |
    라모어 주파수: ω0 = γ·B0
    화학적 이동: δ(ppm) = (ν − ν_ref) / ν_ref × 10⁶
  example: >-
    리튬 금속 셀을 여러 사이클 돌린 뒤 operando ⁷Li NMR로 금속 리튬 신호의 크기 변화를 추적하면, 매끄러운 리튬과 이끼 모양 리튬의 비율 변화를 정량할 수 있다.
  misconception: >-
    NMR은 액체 분석용이라 고체 전극에는 못 쓴다고 생각하기 쉽지만, MAS와 전용 셀을 쓰면 고체 전극과 작동 중인 셀도 측정할 수 있다.
  connection: >-
    상자성 소재의 복잡한 NMR 스펙트럼을 DFT 계산과 비교해 해석하는데, 계산량을 줄이려고 머신러닝으로 화학적 이동을 예측하는 방법이 연구된다.
  quiz:
    question: "⁷Li NMR에서 금속 리튬 신호가 이온 리튬과 크게 떨어져 나타나는 원인은?"
    choices: ["매직각 회전", "전도 전자에 의한 나이트 이동", "XRD 회절", "온도 상승"]
    answer_index: 1
    explanation: "금속 리튬의 전도 전자가 큰 나이트 이동(약 260 ppm)을 만들어 이온 리튬 신호와 구분된다."
  keywords:
    - {ko: "고체 핵자기공명", en: "solid-state NMR"}
    - {ko: "매직각 회전", en: "magic angle spinning"}
    - {ko: "나이트 이동", en: "Knight shift"}
  next_topics: ["리튬 금속 음극과 덴드라이트", "이온 전도도와 리튬 이온 전이수"]
  references: ["R. Bhattacharyya et al., In situ NMR observation of the formation of metallic lithium microstructures in lithium batteries, Nature Materials, 2010"]

- concept: "DEMS/OEMS 가스 분석"
  title: "DEMS: 전지가 내뿜는 가스를 실시간으로 잰다"
  level: 중급
  one_liner: >-
    DEMS·OEMS는 작동 중인 셀에서 나오는 가스를 질량 분석기로 실시간 측정해, 어떤 전위에서 어떤 반응이 가스를 만드는지 정량한다.
  sections:
    - heading: "구성"
      body: >-
        셀 위 공간(헤드스페이스)을 운반 기체로 계속 흘려 질량 분석기로 보내거나, 일정 시간마다 기체를 뽑아 분석한다. 질량 대 전하 비(m/z)로 H₂(2), C₂H₄(26·27·28), CO₂(44), O₂(32) 같은
        가스를 구분한다. 기준 가스로 보정하면 생성량을 μmol 단위로 정량할 수 있다.
    - heading: "전기화학과 동시 측정"
      body: >-
        가스 신호를 전압·전류와 시간축으로 맞추면 가스가 생기기 시작하는 전위를 알 수 있다. 예를 들어 고니켈 양극에서 O₂와 CO₂가 함께 늘어나는 전위는 격자 산소 방출과 전해질 산화가
        시작되는 지점을 알려 준다. 첨가제나 코팅의 효과를 가스 생성량으로 비교할 수 있다.
    - heading: "주의할 점"
      body: >-
        CO와 C₂H₄, N₂는 m/z 28이 겹쳐 조각 이온 패턴을 함께 보고 분리해야 한다. 생성된 가스 일부가 전해질에 녹거나 다른 전극에서 소비되어 실제보다 적게 측정될 수 있다.
        셀 구조가 일반 셀과 달라 결과를 실제 셀에 옮길 때 주의가 필요하다.
  formula: |
    정량: n_gas = (I_m/z − I_background) / k_cal  (보정 계수 k_cal)
    전하-가스 비: z_eff = Q / (F · n_gas)  → 반응 전자 수 추정
  example: >-
    잔류 리튬이 많은 고니켈 양극은 첫 충전 고전압 구간에서 CO₂가 많이 나온다. 표면을 세척하거나 코팅한 소재는 이 피크가 줄어든다.
  misconception: >-
    가스가 측정되지 않으면 부반응이 없다고 생각하기 쉽지만, 부반응 생성물이 고체나 용해된 물질로 남을 수도 있다.
  connection: >-
    가스 생성량, 전압, 온도 시계열을 함께 써서 열폭주 직전의 전조 신호를 학습하는 조기 경보 모델이 안전 연구에서 시도된다.
  quiz:
    question: "DEMS에서 m/z 44 신호는 주로 어떤 가스인가?"
    choices: ["H₂", "O₂", "CO₂", "C₂H₄"]
    answer_index: 2
    explanation: "CO₂의 분자량이 44로, 전해질 산화나 탄산염 분해의 대표 신호다."
  keywords:
    - {ko: "미분 전기화학 질량분석", en: "differential electrochemical mass spectrometry"}
    - {ko: "온라인 전기화학 질량분석", en: "online electrochemical mass spectrometry"}
    - {ko: "가스 정량", en: "gas quantification"}
  next_topics: ["가스 발생 메커니즘", "고니켈 양극의 상전이와 산소 방출"]
  references: []

- concept: "DSC·ARC 열안전성 평가"
  title: "DSC·ARC: 열폭주가 언제 시작되는지 재기"
  level: 중급
  one_liner: >-
    DSC는 소량 시료의 발열 반응 온도와 열량을, ARC는 셀이 스스로 데워지기 시작하는 온도와 열폭주 진행을 단열 조건에서 측정한다.
  sections:
    - heading: "DSC"
      body: >-
        시차 주사 열량계(DSC)는 시료와 기준을 같은 속도로 가열하며 들어가거나 나오는 열 흐름 차이를 잰다. 충전된 전극 조각과 전해질을 밀폐 팬에 넣어 측정하면,
        SEI 분해, 음극과 전해질의 반응, 양극 산소 방출에 따른 발열이 각각 어느 온도에서 얼마나 일어나는지 볼 수 있다. 시료가 수 mg이라 소재 비교에 좋다.
    - heading: "ARC"
      body: >-
        가속 속도 열량계(ARC)는 셀을 단열 상태로 두고 '가열-대기-탐색'을 반복한다. 셀이 스스로 일정 속도 이상(예: 0.02 °C/min) 데워지면 그때부터 주변 온도를 셀 온도에 맞춰 따라가며,
        열이 빠져나가지 않는 최악의 상황에서 온도가 어떻게 치솟는지 기록한다.
    - heading: "읽는 지표"
      body: >-
        ARC에서는 자가 발열 시작 온도(T1), 열폭주 시작 온도(T2), 최고 온도(T3)를 본다. 대체로 SEI 분해가 가장 먼저(대략 80~120 °C) 시작되고, 분리막 녹음, 양극 분해와 산소 방출,
        전해질 연소가 이어진다. 충전 상태가 높고 니켈 함량이 높을수록 시작 온도가 낮고 발열이 크다.
  formula: |
    DSC: 발열량 ΔH = ∫ (dQ/dt) dt
    단열 온도 상승: ΔT_ad = Q_total / (m · c_p)
  example: >-
    같은 셀을 SOC 30%와 100%에서 ARC로 시험하면, 100% 셀은 자가 발열과 열폭주 시작 온도가 더 낮고 최고 온도가 훨씬 높다. 운송 시 셀을 낮은 SOC로 두는 이유다.
  misconception: >-
    소재 DSC 결과가 좋으면 셀도 안전하다고 단정하기 쉽지만, 셀에서는 크기, 열 방출, 내부 단락 방식, 전해질 양이 결과를 크게 바꾼다. 셀 수준 시험이 따로 필요하다.
  connection: >-
    ARC·열폭주 시험은 비싸고 위험해 데이터가 적다. 소재 조성과 셀 설계 변수로 열폭주 특성을 예측하는 모델과, 적은 데이터를 다루는 전이 학습이 연구된다.
  quiz:
    question: "ARC 시험이 열폭주 연구에 쓰이는 주된 이유는?"
    choices: ["셀을 빠르게 냉각해서", "단열 조건에서 최악의 자가 발열을 재현해서", "전압만 측정해서", "가스를 분석해서"]
    answer_index: 1
    explanation: "ARC는 열이 빠져나가지 않는 단열 조건을 만들어 자가 발열이 열폭주로 이어지는 과정을 측정한다."
  keywords:
    - {ko: "시차 주사 열량계", en: "differential scanning calorimetry"}
    - {ko: "가속 속도 열량계", en: "accelerating rate calorimetry"}
    - {ko: "열폭주", en: "thermal runaway"}
  next_topics: ["분리막의 역할과 셧다운 기능", "고니켈 양극의 상전이와 산소 방출"]
  references: ["X. Feng et al., Thermal runaway mechanism of lithium ion battery for electric vehicles: A review, Energy Storage Materials, 2018"]

- concept: "사이클 수명 시험과 열화 모드 분리(LLI, LAM)"
  title: "열화 모드: 리튬을 잃었나, 활물질을 잃었나"
  level: 중급
  one_liner: >-
    용량 감소의 원인은 크게 쓸 수 있는 리튬의 손실(LLI)과 양극·음극 활물질 손실(LAM)로 나뉘며, 저율 충방전 곡선 분석으로 셀을 열지 않고도 그 비율을 추정할 수 있다.
  sections:
    - heading: "수명 시험"
      body: >-
        정해진 C-rate, 전압 범위, 온도로 충방전을 반복하며 용량과 저항을 추적한다(사이클 수명). 충방전 없이 특정 SOC와 온도로 보관하며 열화를 보는 것이 캘린더 수명이다.
        주기적으로 아주 느린 충방전(예: C/20)과 펄스 시험을 끼워 넣어 진단 데이터를 얻는다(RPT, 기준 성능 시험).
    - heading: "열화 모드"
      body: >-
        LLI(loss of lithium inventory)는 SEI 성장, 리튬 도금 같은 부반응으로 양·음극 사이를 오갈 리튬이 줄어든 것이다. LAM(loss of active material)은 입자 균열, 접촉 손실,
        구조 붕괴로 리튬을 받아 줄 활물질이 줄어든 것으로 양극(LAM_PE)과 음극(LAM_NE)을 나눈다. 저항 증가는 용량을 직접 줄이지 않지만 높은 C-rate에서 쓸 수 있는 용량을 줄인다.
    - heading: "분리하는 방법"
      body: >-
        반쪽 셀로 측정한 양극·음극 OCV 곡선을 늘이고 옮겨 풀셀 저율 곡선에 맞추면(전극 정렬, 차분 전압 분석) 각 전극의 용량과 상대 위치가 나온다. 전극 용량 감소는 LAM을,
        두 전극 곡선의 상대 위치 이동은 LLI를 뜻한다. dQ/dV·dV/dQ 피크 변화를 함께 본다.
  formula: |
    풀셀 OCV(Q) = U_PE((Q − δ_PE)/C_PE) − U_NE((Q − δ_NE)/C_NE)
    C_PE·C_NE 감소 → LAM,  δ(전극 간 오프셋) 변화 → LLI
  example: >-
    NCM/흑연 셀을 고온에서 사이클하면 초기에는 LLI가 주된 열화이다가, 어느 순간 음극 LAM과 리튬 도금이 겹치며 용량이 급격히 떨어지는 '무릎(knee)'이 나타나기도 한다.
  misconception: >-
    용량 유지율 곡선만 보면 열화 원인을 알 수 있다고 생각하기 쉽지만, 같은 용량 감소라도 LLI와 LAM의 조합은 여러 가지일 수 있다. 진단 시험이 따로 필요하다.
  connection: >-
    시뮬레이션으로 LLI·LAM 조합별 dQ/dV 곡선을 대량 생성해 학습한 모델로 실제 셀의 열화 모드를 추정하는 방법이 연구된다. 초기 사이클로 수명을 예측한 Severson 등의 연구도 유명하다.
  quiz:
    question: "SEI가 계속 자라며 리튬이 소모되는 열화는 어떤 모드에 해당하나?"
    choices: ["LAM_PE", "LAM_NE", "LLI", "옴 저항 감소"]
    answer_index: 2
    explanation: "SEI 성장은 양·음극 사이를 오갈 리튬을 소모하므로 리튬 재고 손실(LLI)이다."
  keywords:
    - {ko: "리튬 재고 손실", en: "loss of lithium inventory"}
    - {ko: "활물질 손실", en: "loss of active material"}
    - {ko: "기준 성능 시험", en: "reference performance test"}
  next_topics: ["dQ/dV 미분 용량 분석", "쿨롱 효율과 에너지 효율", "그래디언트 부스팅(XGBoost, LightGBM)"]
  references: ["C. R. Birkl, M. R. Roberts, E. McTurk, P. G. Bruce, D. A. Howey, Degradation diagnostics for lithium ion cells, J. Power Sources, 2017", "K. A. Severson et al., Data-driven prediction of battery cycle life before capacity degradation, Nature Energy, 2019"]
