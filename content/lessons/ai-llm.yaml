# AI › LLM 공부 노트

- concept: "토크나이저(BPE)"
  title: "토크나이저: LLM이 글자를 읽는 단위"
  level: 입문
  one_liner: >-
    LLM은 글자나 단어가 아니라 토큰 단위로 글을 읽고 쓰며, BPE는 자주 붙어 나오는 문자 조각을 반복해 합쳐 적당한 크기의 토큰 사전을 만드는 방법이다.
  sections:
    - heading: "왜 토큰인가"
      body: >-
        단어 단위로 사전을 만들면 처음 보는 단어를 처리할 수 없고 사전이 너무 커진다. 글자 단위면 사전은 작지만 문장이 너무 길어진다. 그 중간인 하위 단어(subword) 토큰을 쓰면 자주 쓰는 단어는 한 토큰,
        드문 단어는 여러 조각으로 나누어 어떤 글이든 표현할 수 있다. 보통 사전 크기는 수만~수십만 개다.
    - heading: "BPE 알고리즘"
      body: >-
        바이트 쌍 인코딩(BPE)은 처음에 모든 글자(또는 바이트)를 토큰으로 두고, 학습 말뭉치에서 가장 자주 이웃하는 토큰 쌍을 찾아 하나의 새 토큰으로 합친다. 이를 원하는 사전 크기가 될 때까지 반복한다.
        바이트 단위 BPE는 어떤 언어·기호든 바이트로 표현할 수 있어 '모르는 글자'가 없다. WordPiece, Unigram(SentencePiece)도 비슷한 목적의 방법이다.
    - heading: "토큰화가 만드는 차이"
      body: >-
        사전이 주로 영어로 학습되면 한국어는 같은 내용이라도 토큰이 더 많이 쓰여 비용이 늘고 컨텍스트를 더 차지한다. 숫자가 이상하게 쪼개지면 산술이 어려워지고, 글자 수 세기 같은 과제를 틀리기도 한다.
        모델의 가격, 길이 제한, 속도가 모두 토큰 수로 정해진다.
  formula: |
    BPE 반복: (a, b) = argmax count(a, b) → 새 토큰 'ab' 추가
    대략: 영어 1토큰 ≈ 4글자 내외 (언어·토크나이저마다 다름)
  example: >-
    'LiNi0.8Co0.1Mn0.1O2' 같은 화학식은 흔한 단어가 아니라 여러 조각으로 쪼개진다. 그래서 LLM이 화학식의 숫자나 원소를 다룰 때 실수할 여지가 생긴다.
  misconception: >-
    LLM이 글자 하나하나를 본다고 생각하기 쉽지만, 실제로는 토큰 단위로 본다. 그래서 '이 단어에 r이 몇 개 있나' 같은 질문을 틀리기도 한다.
  connection: >-
    배터리 논문에서 소재 정보를 추출할 때 화학식, 단위, 숫자가 토큰으로 어떻게 쪼개지는지가 정확도에 영향을 준다. 그래서 화학 전용 토크나이저를 쓴 언어 모델도 연구된다.
  quiz:
    question: "BPE가 사전을 만들 때 매 단계에서 하는 일은?"
    choices: ["가장 드문 단어를 지운다", "가장 자주 이웃하는 토큰 쌍을 하나로 합친다", "문장을 무작위로 자른다", "모든 단어를 한 글자로 나눈다"]
    answer_index: 1
    explanation: "BPE는 말뭉치에서 가장 빈번한 인접 토큰 쌍을 합쳐 새 토큰으로 추가하는 것을 반복한다."
  keywords:
    - {ko: "토크나이저", en: "tokenizer"}
    - {ko: "바이트 쌍 인코딩", en: "byte pair encoding"}
    - {ko: "하위 단어", en: "subword"}
  next_topics: ["임베딩과 의미 공간", "컨텍스트 윈도와 KV 캐시"]
  references: ["R. Sennrich, B. Haddow, A. Birch, Neural machine translation of rare words with subword units, ACL, 2016"]

- concept: "임베딩과 의미 공간"
  title: "임베딩: 의미를 벡터 공간의 위치로 바꾼다"
  level: 입문
  one_liner: >-
    임베딩은 토큰이나 문장을 수백~수천 차원 벡터로 바꾼 것으로, 비슷한 의미를 가진 것들이 공간에서 가까이 놓이도록 학습되어 검색과 군집화의 바탕이 된다.
  sections:
    - heading: "토큰 임베딩"
      body: >-
        LLM의 첫 층은 토큰 번호를 벡터로 바꾸는 표(임베딩 행렬)다. 학습 초기에는 무작위지만, 다음 토큰 예측을 학습하면서 비슷한 문맥에 나오는 토큰들이 비슷한 벡터를 갖게 된다(분포 가설).
        word2vec 시절에는 '왕 − 남자 + 여자 ≈ 여왕' 같은 벡터 연산이 잘 알려졌다.
    - heading: "문장·문서 임베딩"
      body: >-
        검색과 RAG에서는 문장이나 문단 전체를 하나의 벡터로 만든 임베딩을 쓴다. 대조 학습으로 의미가 같은 문장 쌍은 가깝게, 다른 쌍은 멀게 만들도록 학습한다. 질문과 문서를 같은 공간에 놓고
        코사인 유사도로 가장 가까운 문서를 찾는다.
    - heading: "한계"
      body: >-
        임베딩은 '주제가 비슷한가'는 잘 잡지만 부정, 숫자, 세부 조건 차이에는 둔감할 수 있다. 예를 들어 '고온에서 수명이 늘었다'와 '고온에서 수명이 줄었다'가 가깝게 나올 수 있다.
        그래서 검색 결과를 다시 정밀하게 정렬하는 재순위(reranker) 모델이나 키워드 검색을 함께 쓴다.
  formula: |
    코사인 유사도: cos(u, v) = (u·v) / (‖u‖·‖v‖)
    대조 손실(InfoNCE): L = −log [exp(s(q, d⁺)/τ) / Σ_j exp(s(q, d_j)/τ)]
  example: >-
    배터리 논문 초록 수천 개를 임베딩해 2차원으로 투영하면 고체 전해질, 실리콘 음극, 수명 예측 같은 주제별 군집이 나타나, 분야 지도를 만들 수 있다.
  misconception: >-
    임베딩 공간의 각 차원이 특정 의미(예: 3번 차원 = 온도)를 가진다고 생각하기 쉽지만, 의미는 보통 여러 차원에 분산되어 있다.
  connection: >-
    소재 이름의 임베딩만으로 아직 연구되지 않은 열전 소재 후보를 예측한 연구처럼, 문헌 임베딩은 배터리 소재의 숨은 관계를 찾는 데도 쓰인다.
  quiz:
    question: "검색에서 두 임베딩의 가까움을 재는 데 흔히 쓰는 척도는?"
    choices: ["코사인 유사도", "토큰 개수", "학습률", "드롭아웃 비율"]
    answer_index: 0
    explanation: "벡터 방향의 유사성을 보는 코사인 유사도가 의미 검색에서 가장 널리 쓰인다."
  keywords:
    - {ko: "임베딩", en: "embedding"}
    - {ko: "분포 가설", en: "distributional hypothesis"}
    - {ko: "대조 학습", en: "contrastive learning"}
  next_topics: ["RAG(검색 증강 생성)", "지식 그래프 임베딩(TransE 등)"]
  references: ["T. Mikolov et al., Efficient estimation of word representations in vector space, arXiv:1301.3781, 2013", "V. Tshitoyan et al., Unsupervised word embeddings capture latent knowledge from materials science literature, Nature, 2019"]

- concept: "다음 토큰 예측과 사전학습"
  title: "사전학습: 다음 토큰 하나를 맞히는 단순한 목표의 힘"
  level: 입문
  one_liner: >-
    LLM은 방대한 텍스트에서 앞 토큰들을 보고 다음 토큰의 확률을 맞히도록 학습되며, 이 단순한 목표를 극단적인 규모로 풀면서 문법, 사실, 추론 패턴까지 함께 배운다.
  sections:
    - heading: "학습 목표"
      body: >-
        문장을 토큰 x₁, x₂, …로 나누고, 각 위치에서 앞 토큰들만 보고 다음 토큰의 확률 분포를 출력한다. 손실은 실제 다음 토큰의 음의 로그 확률(교차 엔트로피)이다. 정답 레이블을 사람이 붙일 필요가 없어
        인터넷 규모의 텍스트를 그대로 쓸 수 있는 자기 지도 학습이다.
    - heading: "왜 많은 것을 배우나"
      body: >-
        다음 토큰을 잘 맞히려면 문법뿐 아니라 '파리는 프랑스의 수도다' 같은 사실, 코드의 규칙, 수식의 흐름, 글쓴이의 의도까지 모델링해야 한다. 그래서 다음 토큰 예측을 아주 잘하는 모델은
        결과적으로 넓은 지식과 일반적인 언어 능력을 갖게 된다.
    - heading: "사전학습 이후"
      body: >-
        사전학습만 마친 모델(기반 모델)은 질문에 답하기보다 그럴듯한 다음 글을 이어 쓴다. 그래서 인스트럭션 튜닝과 선호 학습(RLHF 등)으로 대화 비서처럼 행동하게 만든다. 사전학습에는 엄청난 계산이 들고,
        데이터의 질과 구성이 모델 능력을 크게 좌우한다.
  formula: |
    L = −Σ_t log p_θ(x_t | x_<t)
    퍼플렉서티 = exp(L / T)
  example: >-
    배터리 논문으로 추가 사전학습(도메인 적응 사전학습)한 언어 모델은 일반 모델보다 전해질·전극 용어를 더 정확히 다루고, 소재 정보 추출 과제에서 성능이 오르는 경우가 보고된다.
  misconception: >-
    다음 토큰 예측만 하니 LLM은 '그저 통계적 자동완성'일 뿐이라고 단정하기 쉽지만, 그 목표를 잘 풀기 위해 내부에 상당히 구조화된 표현이 생긴다는 연구들도 있다. 반대로 사실 정확성을 보장하지도 않는다.
  connection: >-
    배터리 연구 문헌과 실험 노트로 추가 학습한 도메인 언어 모델이 소재 정보 추출, 실험 기록 요약, 문헌 검색 보조에 쓰인다.
  quiz:
    question: "LLM 사전학습이 자기 지도 학습인 이유는?"
    choices: ["사람이 모든 문장에 정답을 달아서", "텍스트 자체의 다음 토큰이 정답 역할을 해서", "강화학습을 써서", "이미지를 써서"]
    answer_index: 1
    explanation: "텍스트의 다음 토큰이 곧 정답이므로 별도 레이블 없이 대량의 텍스트로 학습할 수 있다."
  keywords:
    - {ko: "사전학습", en: "pretraining"}
    - {ko: "자기 지도 학습", en: "self-supervised learning"}
    - {ko: "기반 모델", en: "foundation model"}
  next_topics: ["스케일링 법칙", "인스트럭션 튜닝", "토크나이저(BPE)"]
  references: ["A. Radford et al., Language models are unsupervised multitask learners, OpenAI, 2019", "T. Brown et al., Language models are few-shot learners, NeurIPS, 2020"]

- concept: "스케일링 법칙"
  title: "스케일링 법칙: 크기·데이터·계산을 늘리면 손실이 예측 가능하게 준다"
  level: 중급
  one_liner: >-
    언어 모델의 손실은 파라미터 수, 데이터 양, 계산량에 대해 거듭제곱 법칙으로 줄어들며, 이 관계로 정해진 계산 예산에서 모델 크기와 데이터 양을 어떻게 나눌지 정할 수 있다.
  sections:
    - heading: "거듭제곱 법칙"
      body: >-
        2020년 무렵 연구에서 모델 크기(N), 데이터 양(D), 계산량(C)을 몇 자릿수에 걸쳐 바꾸며 학습하자 손실이 로그-로그 그래프에서 직선처럼 줄어드는 것이 관찰되었다. 즉 L ∝ N^(−α) 같은 관계다.
        작은 모델 실험으로 큰 모델의 성능을 미리 예측할 수 있어 대규모 학습 계획에 큰 영향을 주었다.
    - heading: "계산 최적 배분"
      body: >-
        학습 계산량은 대략 6·N·D FLOPs다. 정해진 계산 예산에서 모델을 크게 하고 데이터를 적게 쓸지, 반대로 할지가 문제다. Chinchilla 연구는 둘을 비슷한 비율로 함께 늘려야 하며,
        파라미터 1개당 대략 20토큰 정도의 데이터가 계산 최적이라고 제안했다. 그 전의 많은 큰 모델은 데이터에 비해 너무 컸다.
    - heading: "한계와 최근 흐름"
      body: >-
        손실 감소가 곧 특정 능력 향상으로 이어지는 방식은 단순하지 않다. 실제로는 추론 비용 때문에 계산 최적보다 작은 모델을 더 많은 데이터로 오래 학습하는 경우가 많다. 고품질 데이터가 부족해지는 문제,
        추론 시간에 더 많이 계산해 성능을 올리는 '추론 시간 스케일링'도 중요한 주제가 되었다.
  formula: |
    L(N, D) ≈ E + A / N^α + B / D^β
    학습 계산량 C ≈ 6·N·D,  계산 최적: D ≈ 20·N (Chinchilla 추정)
  example: >-
    700억 파라미터 모델을 계산 최적으로 학습하려면 대략 1.4조 토큰이 필요하다는 계산이 Chinchilla 추정에서 나온다.
  misconception: >-
    스케일링 법칙이 '크기만 키우면 모든 문제가 풀린다'는 뜻은 아니다. 법칙은 평균 손실에 대한 경험적 관계일 뿐이고, 데이터 질과 구조 선택이 기울기와 절편을 바꾼다.
  connection: >-
    배터리 데이터처럼 작은 과학 데이터셋에서는 모델을 키우는 것보다 데이터를 늘리거나 물리 지식을 넣는 편이 효과적인 경우가 많다. 스케일링 사고방식은 '무엇이 병목인가'를 묻는 도구로 유용하다.
  quiz:
    question: "Chinchilla 연구가 제안한 계산 최적 학습의 대략적 비율은?"
    choices: ["파라미터 1개당 약 1토큰", "파라미터 1개당 약 20토큰", "파라미터 1개당 약 1000토큰", "데이터는 상관없다"]
    answer_index: 1
    explanation: "Chinchilla는 모델 크기와 데이터를 함께 늘려야 하며 파라미터당 약 20토큰이 계산 최적이라고 추정했다."
  keywords:
    - {ko: "스케일링 법칙", en: "scaling law"}
    - {ko: "계산 최적", en: "compute-optimal"}
    - {ko: "거듭제곱 법칙", en: "power law"}
  next_topics: ["전문가 혼합(MoE)", "LLM 평가와 벤치마크"]
  references: ["J. Kaplan et al., Scaling laws for neural language models, arXiv:2001.08361, 2020", "J. Hoffmann et al., Training compute-optimal large language models, NeurIPS, 2022"]

- concept: "인스트럭션 튜닝"
  title: "인스트럭션 튜닝: 이어 쓰는 모델을 지시를 따르는 모델로"
  level: 입문
  one_liner: >-
    인스트럭션 튜닝은 '지시문-좋은 응답' 쌍으로 사전학습 모델을 지도 학습해, 텍스트를 이어 쓰던 모델이 사람의 요청을 이해하고 그에 맞게 답하도록 만드는 단계다.
  sections:
    - heading: "왜 필요한가"
      body: >-
        기반 모델에 '리튬 도금을 설명해 줘'라고 넣으면 설명 대신 비슷한 질문 목록을 이어 쓸 수도 있다. 사전학습 데이터에서 그런 형식이 흔했기 때문이다. 인스트럭션 튜닝은 지시와 그에 맞는 응답의 예를 보여 주어
        '요청이 오면 답한다'는 행동 방식을 가르친다.
    - heading: "데이터와 학습"
      body: >-
        요약, 번역, 질의응답, 코드 작성 등 다양한 과제를 지시문 형식으로 바꾼 데이터나, 사람이 직접 쓴 고품질 대화 예시를 쓴다. 학습은 응답 부분의 토큰에 대해서만 다음 토큰 예측 손실을 계산하는
        지도 파인튜닝(SFT)이다. 적은 양이라도 질이 높은 데이터가 효과적이라는 결과가 많다.
    - heading: "효과와 한계"
      body: >-
        다양한 과제로 인스트럭션 튜닝하면 학습에 없던 새 과제의 지시도 더 잘 따르게 된다(일반화). 다만 SFT만으로는 '좋은 답'과 '그럴듯한 답'을 세밀하게 구분하기 어렵고, 데이터에 있는 잘못된 내용도 따라 배운다.
        그래서 보통 선호 학습(RLHF, DPO 등)이 뒤따른다.
  formula: |
    L_SFT = −Σ_{t∈응답} log p_θ(y_t | 지시, y_<t)
    (지시 부분 토큰은 손실에서 제외)
  example: >-
    실험실 프로토콜을 '목표·시료·조건 → 절차 요약' 형식으로 수백 개 만들어 작은 모델을 인스트럭션 튜닝하면, 새 실험 기록도 같은 형식으로 정리해 주는 도우미를 만들 수 있다.
  misconception: >-
    인스트럭션 튜닝으로 모델이 새 지식을 많이 배운다고 생각하기 쉽지만, 주된 효과는 형식과 행동을 가르치는 것이다. 지식은 대부분 사전학습에서 온다.
  connection: >-
    연구실 고유의 데이터 형식(실험 노트, 측정 보고서)에 맞춘 작은 인스트럭션 튜닝 모델은 큰 범용 모델보다 싸고 일관된 결과를 낼 수 있다.
  quiz:
    question: "SFT 손실을 계산할 때 보통 제외하는 부분은?"
    choices: ["응답 토큰", "지시문(프롬프트) 토큰", "마지막 토큰", "아무것도 제외하지 않음"]
    answer_index: 1
    explanation: "모델이 배워야 할 것은 응답이므로, 지시문 토큰은 입력으로만 쓰고 손실에서 뺀다."
  keywords:
    - {ko: "인스트럭션 튜닝", en: "instruction tuning"}
    - {ko: "지도 파인튜닝", en: "supervised fine-tuning"}
    - {ko: "과제 일반화", en: "task generalization"}
  next_topics: ["RLHF와 DPO", "LoRA와 파라미터 효율적 파인튜닝"]
  references: ["J. Wei et al., Finetuned language models are zero-shot learners, ICLR, 2022", "L. Ouyang et al., Training language models to follow instructions with human feedback, NeurIPS, 2022"]

- concept: "RLHF와 DPO"
  title: "RLHF와 DPO: 사람이 더 좋아하는 답 쪽으로 모델을 민다"
  level: 중급
  one_liner: >-
    RLHF는 사람이 고른 선호 쌍으로 보상 모델을 학습한 뒤 강화학습으로 언어 모델을 최적화하고, DPO는 보상 모델 없이 선호 쌍에서 바로 언어 모델을 학습해 같은 목표를 더 간단히 이룬다.
  sections:
    - heading: "선호 데이터"
      body: >-
        같은 질문에 대한 두 응답을 보여 주고 사람(또는 AI)이 더 나은 쪽을 고른다. '좋은 답'을 직접 쓰기보다 둘 중 나은 것을 고르는 편이 쉽고 일관적이다. 이 선호 쌍에는 정확성, 유용성, 안전성, 문체 같은
        미묘한 기준이 담긴다.
    - heading: "RLHF"
      body: >-
        (1) 선호 쌍으로 응답에 점수를 매기는 보상 모델을 학습한다(브래들리-테리 모델). (2) 언어 모델이 응답을 생성하면 보상 모델이 점수를 주고, PPO 같은 강화학습으로 점수를 높이도록 언어 모델을 갱신한다.
        이때 원래 모델에서 너무 멀어지지 않도록 KL 벌점을 둔다. 보상 모델의 허점을 파고드는 '보상 해킹'이 주의할 점이다.
    - heading: "DPO"
      body: >-
        DPO는 KL 제약이 있는 보상 최대화 문제의 최적해를 수식으로 풀어, 보상 모델과 강화학습 없이 선호 쌍에 대한 분류 손실 하나로 언어 모델을 직접 학습한다. 구현이 간단하고 안정적이어서
        널리 쓰인다. 사람 대신 AI가 원칙에 따라 피드백을 주는 RLAIF·헌법적 AI 같은 방법도 있다.
  formula: |
    보상 모델: P(y_w ≻ y_l) = σ(r(x, y_w) − r(x, y_l))
    RLHF 목표: max E[r(x, y)] − β·KL(π_θ ‖ π_ref)
    DPO: L = −log σ(β·[log π_θ(y_w|x)/π_ref(y_w|x) − log π_θ(y_l|x)/π_ref(y_l|x)])
  example: >-
    연구 보조용 모델을 만들 때 '근거를 밝히고 불확실하면 그렇다고 말하는 답'을 선호하도록 선호 데이터를 모으면, 자신 없는 수치를 지어내는 경향을 줄이는 데 도움이 된다.
  misconception: >-
    RLHF가 모델을 '정직하게' 만든다고 단정하기 쉽지만, 실제로는 평가자가 선호하는 방향으로 민다. 평가자가 그럴듯한 오답을 좋아하면 그런 답이 강화될 수 있다(아첨 경향).
  connection: >-
    과학 분야에서는 전문가 선호 데이터가 비싸서, 도메인 전문가 몇 명의 비교 판단을 효율적으로 모으는 방법과 AI 피드백을 결합하는 방식이 연구된다.
  quiz:
    question: "DPO가 RLHF와 다른 가장 큰 점은?"
    choices: ["선호 데이터를 쓰지 않는다", "별도 보상 모델과 강화학습 없이 직접 학습한다", "사전학습을 다시 한다", "KL 제약을 완전히 무시한다"]
    answer_index: 1
    explanation: "DPO는 최적해의 형태를 이용해 선호 쌍에 대한 분류형 손실로 언어 모델을 바로 학습한다."
  keywords:
    - {ko: "인간 피드백 강화학습", en: "reinforcement learning from human feedback"}
    - {ko: "직접 선호 최적화", en: "direct preference optimization"}
    - {ko: "보상 해킹", en: "reward hacking"}
  next_topics: ["환각(hallucination)과 그 원인", "LLM 평가와 벤치마크"]
  references: ["L. Ouyang et al., Training language models to follow instructions with human feedback, NeurIPS, 2022", "R. Rafailov et al., Direct preference optimization: your language model is secretly a reward model, NeurIPS, 2023"]

- concept: "LoRA와 파라미터 효율적 파인튜닝"
  title: "LoRA: 거대한 가중치는 그대로 두고 작은 보정만 학습한다"
  level: 중급
  one_liner: >-
    LoRA는 사전학습 가중치를 고정하고, 가중치 변화량을 두 개의 작은 저랭크 행렬 곱으로 표현해 그것만 학습함으로써 적은 메모리로 큰 모델을 파인튜닝한다.
  sections:
    - heading: "아이디어"
      body: >-
        큰 모델 전체를 파인튜닝하면 모든 파라미터의 기울기와 최적화기 상태를 저장해야 해 메모리가 매우 많이 든다. LoRA는 파인튜닝으로 생기는 가중치 변화 ΔW가 낮은 랭크로 잘 근사된다고 보고,
        ΔW = B·A(B는 d×r, A는 r×k, r은 4~64 정도)로 둔다. 학습하는 것은 A와 B뿐이라 파라미터 수가 원래의 1% 미만이 되기도 한다.
    - heading: "장점"
      body: >-
        메모리와 저장 공간이 크게 준다. 과제마다 작은 LoRA 가중치만 따로 저장하고 같은 기반 모델에 바꿔 끼울 수 있다. 학습 후 BA를 원래 가중치에 더해 합치면 추론 속도 손해도 없다.
        기반 모델을 4비트로 양자화한 채 LoRA를 학습하는 QLoRA는 일반 GPU에서도 큰 모델 파인튜닝을 가능하게 했다.
    - heading: "고려할 점"
      body: >-
        랭크 r, 적용할 층(어텐션의 Q·V만, 또는 MLP까지), 스케일 α를 정해야 한다. 지식을 많이 새로 넣는 과제에서는 전체 파인튜닝보다 성능이 낮을 수 있다. 그 밖에 어댑터, 프롬프트 튜닝 같은
        파라미터 효율적 파인튜닝(PEFT) 방법들이 있다.
  formula: |
    W' = W₀ + ΔW = W₀ + (α / r) · B·A
    학습 파라미터 수: r·(d + k)  vs  전체 d·k
  example: >-
    d = k = 4096인 행렬 하나를 전체 학습하면 약 1,670만 개 파라미터지만, r = 8 LoRA는 8 × (4096 + 4096) ≈ 6.6만 개만 학습한다.
  misconception: >-
    LoRA를 쓰면 성능이 항상 전체 파인튜닝과 같다고 생각하기 쉽지만, 과제와 랭크 설정에 따라 차이가 날 수 있다. 특히 새 도메인 지식을 대량으로 학습시키는 데는 한계가 있다.
  connection: >-
    연구실 규모의 GPU로 공개 LLM을 배터리 문헌 질의응답이나 실험 데이터 서식 변환에 맞게 파인튜닝할 때 LoRA·QLoRA가 사실상 기본 선택이다.
  quiz:
    question: "LoRA에서 학습하는 파라미터는?"
    choices: ["원래 가중치 W₀ 전체", "저랭크 행렬 A와 B", "토크나이저", "임베딩 행렬만"]
    answer_index: 1
    explanation: "W₀는 고정하고 ΔW = B·A의 작은 두 행렬만 학습해 메모리를 크게 줄인다."
  keywords:
    - {ko: "저랭크 적응", en: "low-rank adaptation"}
    - {ko: "파라미터 효율적 파인튜닝", en: "parameter-efficient fine-tuning"}
    - {ko: "QLoRA", en: "QLoRA"}
  next_topics: ["양자화(quantization)", "전이 학습과 파인튜닝"]
  references: ["E. J. Hu et al., LoRA: Low-rank adaptation of large language models, ICLR, 2022", "T. Dettmers et al., QLoRA: Efficient finetuning of quantized LLMs, NeurIPS, 2023"]

- concept: "RAG(검색 증강 생성)"
  title: "RAG: 답하기 전에 먼저 찾아본다"
  level: 중급
  one_liner: >-
    RAG는 질문과 관련된 문서를 먼저 검색해 프롬프트에 넣고 그 내용을 근거로 답하게 해, 모델이 모르는 최신·내부 지식을 쓰고 출처를 밝히며 환각을 줄이는 방법이다.
  sections:
    - heading: "기본 흐름"
      body: >-
        (1) 문서를 적당한 크기의 조각(청크)으로 나누고 임베딩해 벡터 데이터베이스에 넣는다. (2) 질문이 오면 질문을 임베딩해 가까운 조각 몇 개를 찾는다. (3) 찾은 조각을 질문과 함께 LLM에 넣고
        '아래 자료를 근거로 답하라'고 지시한다. 모델을 다시 학습하지 않아도 지식을 갱신할 수 있다.
    - heading: "품질을 좌우하는 것"
      body: >-
        대부분의 실패는 검색 단계에서 생긴다. 청크 크기(너무 작으면 문맥 손실, 너무 크면 잡음), 임베딩 모델의 품질, 키워드 검색(BM25)과 벡터 검색을 섞는 하이브리드 검색, 검색 결과를 다시 정렬하는 재순위,
        표·그림처럼 텍스트가 아닌 정보의 처리가 중요하다.
    - heading: "한계와 평가"
      body: >-
        검색된 문서에 답이 없으면 모델이 지어낼 수 있고, 서로 모순되는 문서가 섞이면 혼란이 생긴다. 그래서 '자료에 없으면 모른다고 말하라'는 지시와 출처 인용을 요구한다. 평가는 검색 정확도(관련 문서를 찾았나)와
        생성 충실도(답이 자료에 근거하나)를 나눠서 한다. 질문을 나누어 여러 번 검색하는 에이전트형 RAG도 쓰인다.
  formula: |
    p(y | x) ≈ LLM(y | x, Retrieve_k(x))
    Retrieve_k(x) = top-k_d cos(E(x), E(d))
  example: >-
    연구실의 과거 실험 보고서와 논문 PDF로 RAG를 만들면 '지난해 고온 사이클에서 FEC 2% 조건 결과가 어땠지?' 같은 질문에 해당 보고서를 인용하며 답하게 할 수 있다.
  misconception: >-
    RAG를 쓰면 환각이 사라진다고 생각하기 쉽지만, 검색이 틀리거나 모델이 자료를 잘못 읽으면 여전히 틀린 답이 나온다. 출처를 직접 확인하는 습관이 필요하다.
  connection: >-
    소재 물성 데이터베이스, 실험 기록, 논문을 묶은 RAG는 배터리 연구실에서 가장 현실적인 LLM 활용법 중 하나다. 수치 데이터는 텍스트보다 표·데이터베이스 질의로 다루는 편이 정확하다.
  quiz:
    question: "RAG 시스템 실패의 가장 흔한 원인은?"
    choices: ["GPU 부족", "관련 문서를 제대로 찾지 못하는 검색 단계", "토큰 수가 너무 적음", "모델이 너무 작음"]
    answer_index: 1
    explanation: "필요한 자료를 찾지 못하면 아무리 좋은 모델도 근거 있는 답을 할 수 없어, 검색 품질이 핵심이다."
  keywords:
    - {ko: "검색 증강 생성", en: "retrieval-augmented generation"}
    - {ko: "벡터 데이터베이스", en: "vector database"}
    - {ko: "재순위", en: "reranking"}
  next_topics: ["임베딩과 의미 공간", "환각(hallucination)과 그 원인", "LLM과 지식 그래프의 결합(GraphRAG)"]
  references: ["P. Lewis et al., Retrieval-augmented generation for knowledge-intensive NLP tasks, NeurIPS, 2020"]

- concept: "디코딩 전략(temperature, top-p)"
  title: "디코딩 전략: 확률 분포에서 다음 토큰을 고르는 방법"
  level: 입문
  one_liner: >-
    LLM은 다음 토큰의 확률 분포를 낼 뿐이고, 실제 문장은 그 분포에서 토큰을 어떻게 고르느냐(탐욕, 온도 샘플링, top-k, top-p)에 따라 정확하고 단조롭거나 다양하고 엉뚱해진다.
  sections:
    - heading: "탐욕 디코딩과 빔 탐색"
      body: >-
        탐욕 디코딩은 매번 확률이 가장 높은 토큰을 고른다. 결정적이고 재현 가능하지만 반복에 빠지기 쉽다. 빔 탐색은 확률이 높은 후보 문장 여러 개를 동시에 유지해 전체 확률이 높은 문장을 찾는다.
        번역처럼 정답이 비교적 정해진 과제에 쓰였다.
    - heading: "온도"
      body: >-
        로짓을 온도 T로 나눈 뒤 소프트맥스를 하고 샘플링한다. T < 1이면 분포가 뾰족해져 높은 확률 토큰이 더 자주 뽑히고, T > 1이면 평평해져 다양한 토큰이 나온다. T → 0은 탐욕 디코딩과 같다.
        사실 질의나 코드는 낮은 온도, 아이디어 발산은 높은 온도가 어울린다.
    - heading: "top-k와 top-p"
      body: >-
        top-k는 확률 상위 k개 토큰만 남기고 샘플링한다. top-p(핵 샘플링)는 확률을 큰 순서로 더해 누적 p(예: 0.9)가 될 때까지의 토큰만 남긴다. 분포가 뾰족하면 몇 개만, 평평하면 많이 남아
        상황에 맞게 후보 수가 바뀐다. 아주 낮은 확률의 이상한 토큰이 뽑히는 것을 막는 효과가 있다.
  formula: |
    p_i = exp(z_i / T) / Σ_j exp(z_j / T)
    top-p: 최소 집합 V_p s.t. Σ_{i∈V_p} p_i ≥ p
  example: >-
    실험 데이터 표를 JSON으로 바꾸는 작업은 온도를 0에 가깝게 두는 것이 좋고, 새로운 전해질 첨가제 아이디어를 브레인스토밍할 때는 온도를 높여 다양한 후보를 받는 것이 좋다.
  misconception: >-
    온도를 0으로 하면 답이 '정확'해진다고 생각하기 쉽지만, 가장 확률이 높은 답일 뿐 사실이라는 보장은 없다. 또 같은 설정이어도 시스템에 따라 결과가 완전히 같지 않을 수 있다.
  connection: >-
    LLM으로 실험 후보를 여러 개 생성할 때는 샘플링 다양성이, 측정 데이터를 구조화할 때는 결정적 출력과 구조화된 출력 형식 지정이 중요하다.
  quiz:
    question: "온도 T를 1보다 크게 하면 출력은?"
    choices: ["더 결정적이 된다", "더 다양해진다(무작위성 증가)", "항상 같은 답이 나온다", "길이가 0이 된다"]
    answer_index: 1
    explanation: "T > 1이면 확률 분포가 평평해져 확률이 낮은 토큰도 자주 뽑혀 다양성이 늘어난다."
  keywords:
    - {ko: "온도 샘플링", en: "temperature sampling"}
    - {ko: "핵 샘플링", en: "nucleus sampling"}
    - {ko: "빔 탐색", en: "beam search"}
  next_topics: ["환각(hallucination)과 그 원인", "컨텍스트 윈도와 KV 캐시"]
  references: ["A. Holtzman et al., The curious case of neural text degeneration, ICLR, 2020"]

- concept: "컨텍스트 윈도와 KV 캐시"
  title: "컨텍스트 윈도와 KV 캐시: LLM이 한 번에 보는 범위와 그 비용"
  level: 중급
  one_liner: >-
    컨텍스트 윈도는 모델이 한 번에 볼 수 있는 토큰 수이고, KV 캐시는 이미 처리한 토큰의 키·값을 저장해 다음 토큰을 만들 때마다 다시 계산하지 않게 하는 기법이다.
  sections:
    - heading: "컨텍스트 윈도"
      body: >-
        입력 프롬프트와 지금까지 생성한 출력을 합친 길이가 컨텍스트 윈도 안에 들어가야 한다. 초기 모델은 수천 토큰이었지만 최근에는 수십만~백만 토큰까지 늘었다. 하지만 길이가 길어질수록 계산과 메모리가 늘고,
        중간에 있는 정보를 놓치는 '가운데 소실(lost in the middle)' 현상이 보고되기도 했다.
    - heading: "KV 캐시"
      body: >-
        디코더는 토큰을 하나씩 만든다. 새 토큰의 어텐션을 계산할 때 이전 모든 토큰의 키(K)와 값(V)이 필요한데, 이것들은 이미 계산된 값이라 바뀌지 않는다. 그래서 저장해 두고 새 토큰 것만 추가한다.
        덕분에 매 단계 계산이 크게 줄지만, 캐시 메모리는 층 수 × 길이 × 차원에 비례해 커진다.
    - heading: "메모리를 줄이는 방법"
      body: >-
        여러 질의 헤드가 키·값 헤드를 공유하는 MQA·GQA는 KV 캐시 크기를 크게 줄인다. 캐시를 페이지 단위로 관리하는 방식, 캐시 양자화, 앞부분이 같은 프롬프트의 캐시를 재사용하는 프롬프트 캐싱도 쓰인다.
        프롬프트 캐싱은 긴 문서를 반복해 질문할 때 비용과 지연을 크게 줄인다.
  formula: |
    KV 캐시 크기 ≈ 2 × L(층) × n(토큰) × h_kv × d_head × (바이트/값)
    단계당 어텐션 계산: 캐시 사용 시 O(n), 미사용 시 O(n²)
  example: >-
    긴 배터리 리뷰 논문 하나를 컨텍스트에 넣고 여러 질문을 연속으로 할 때, 앞부분(논문 본문)이 같으면 프롬프트 캐싱으로 두 번째 질문부터 처리 비용과 대기 시간이 줄어든다.
  misconception: >-
    컨텍스트에 넣기만 하면 모델이 그 내용을 모두 똑같이 잘 활용한다고 생각하기 쉽지만, 길이가 길수록 특정 위치의 정보를 덜 활용하는 경향이 있어 중요한 내용은 명확히 표시하는 것이 좋다.
  connection: >-
    수백 쪽짜리 실험 기록이나 여러 논문을 통째로 넣는 대신, RAG로 필요한 부분만 넣거나 요약을 단계적으로 쌓는 것이 비용과 정확성 면에서 유리한 경우가 많다.
  quiz:
    question: "KV 캐시가 저장하는 것은?"
    choices: ["모델 가중치", "이미 처리한 토큰들의 키와 값", "정답 레이블", "토크나이저 사전"]
    answer_index: 1
    explanation: "이전 토큰의 K, V는 바뀌지 않으므로 저장해 두고 새 토큰을 만들 때 재사용한다."
  keywords:
    - {ko: "컨텍스트 윈도", en: "context window"}
    - {ko: "KV 캐시", en: "KV cache"}
    - {ko: "그룹 질의 어텐션", en: "grouped-query attention"}
  next_topics: ["양자화(quantization)", "RAG(검색 증강 생성)"]
  references: ["N. F. Liu et al., Lost in the middle: how language models use long contexts, TACL, 2024"]

- concept: "환각(hallucination)과 그 원인"
  title: "환각: 그럴듯하지만 사실이 아닌 답"
  level: 입문
  one_liner: >-
    환각은 LLM이 근거 없이 그럴듯한 내용을 자신 있게 만들어 내는 현상으로, 다음 토큰을 그럴듯하게 이어 가도록 학습된 방식, 지식의 빈틈, 모르면 모른다고 하지 않는 습관에서 생긴다.
  sections:
    - heading: "어떤 모습인가"
      body: >-
        존재하지 않는 논문 제목과 저자, 틀린 수치, 실제로 없는 함수 이름, 입력 문서에 없는 내용을 지어낸다. 문장은 매끄럽고 자신감 있어 보여 알아차리기 어렵다. 입력 자료와 모순되는 경우(충실성 오류)와
        세상의 사실과 모순되는 경우(사실성 오류)로 나눠 보기도 한다.
    - heading: "왜 생기나"
      body: >-
        사전학습은 '사실인 문장'이 아니라 '그럴듯한 다음 토큰'을 학습한다. 학습 데이터에 드물게 나온 사실은 정확히 기억하지 못하고, 비슷한 패턴으로 빈칸을 채운다. 평가 과정이 '모른다'보다 '어떻게든 답한 것'을
        더 높게 쳐 주면 추측하는 습관이 강화된다는 분석도 있다. 디코딩 무작위성도 일부 영향을 준다.
    - heading: "줄이는 방법"
      body: >-
        RAG로 근거 자료를 주고 인용을 요구하기, '확실하지 않으면 모른다고 말하라'는 지시, 도구(계산기, 데이터베이스, 검색)로 직접 확인하게 하기, 여러 번 생성해 일관성을 보기, 사람이 출처를 확인하기가 있다.
        중요한 숫자와 인용은 반드시 원문으로 확인해야 한다.
  formula: |
    학습 목표: max log p(다음 토큰 | 문맥)  ≠  max P(진술이 사실)
    → 그럴듯함과 사실성은 일치하지 않을 수 있음
  example: >-
    LLM에게 '실리콘 음극 수명에 관한 2019년 리뷰 논문 3편'을 물으면 실제 저자 이름과 그럴듯한 제목을 조합한 가짜 참고문헌을 만들어 내는 경우가 있다. 반드시 DOI로 확인해야 한다.
  misconception: >-
    모델이 자신 있게 말하면 맞을 가능성이 높다고 생각하기 쉽지만, 말투의 자신감과 실제 정확도는 잘 일치하지 않을 수 있다.
  connection: >-
    배터리 연구에서 LLM으로 문헌 값을 추출하거나 요약할 때는 원문 인용 위치를 함께 출력하게 하고, 수치는 원문 표와 대조하는 검증 단계를 반드시 둬야 한다.
  quiz:
    question: "환각을 줄이는 방법으로 가장 알맞은 것은?"
    choices: ["온도를 크게 높인다", "근거 자료를 주고 인용과 '모름' 응답을 허용한다", "질문을 더 모호하게 한다", "출처 확인을 생략한다"]
    answer_index: 1
    explanation: "근거 자료(RAG)와 인용 요구, 모를 때 모른다고 말하게 하는 지시가 환각을 줄이는 데 효과적이다."
  keywords:
    - {ko: "환각", en: "hallucination"}
    - {ko: "사실성", en: "factuality"}
    - {ko: "충실성", en: "faithfulness"}
  next_topics: ["RAG(검색 증강 생성)", "LLM 평가와 벤치마크"]
  references: ["Z. Ji et al., Survey of hallucination in natural language generation, ACM Computing Surveys, 2023"]

- concept: "LLM 평가와 벤치마크"
  title: "LLM 평가: 점수표를 믿기 전에 확인할 것"
  level: 중급
  one_liner: >-
    LLM은 지식·추론·코딩 벤치마크, 사람이나 다른 모델의 비교 평가, 실제 과제 기반 평가로 측정하며, 데이터 오염과 과제 불일치 때문에 공개 점수만으로 판단하기는 어렵다.
  sections:
    - heading: "평가의 종류"
      body: >-
        객관식·단답형 벤치마크(지식, 수학, 과학 문제)는 자동 채점이 쉽다. 코딩은 테스트를 통과하는지로 채점한다. 열린 답변은 사람이 두 모델의 답을 비교하거나, 강한 LLM을 채점자로 쓰는 'LLM-as-a-judge'로 평가한다.
        최근에는 여러 단계 도구 사용이 필요한 에이전트 과제 평가도 늘었다.
    - heading: "조심할 점"
      body: >-
        벤치마크 문제가 학습 데이터에 섞이면(데이터 오염) 점수가 부풀려진다. 많은 모델이 같은 벤치마크로 경쟁하면 그 벤치마크에만 맞춰지고, 문제가 쉬워 점수가 포화되기도 한다. 프롬프트 형식, 예시 수, 채점 방식이
        조금만 달라도 순위가 바뀐다. LLM 채점자는 긴 답, 자기 스타일 답, 앞에 놓인 답을 선호하는 편향이 있을 수 있다.
    - heading: "내 과제를 위한 평가"
      body: >-
        가장 믿을 만한 평가는 실제로 쓸 과제와 비슷한 문제 수십~수백 개로 만든 자체 평가 세트다. 정답이나 채점 기준을 미리 정하고, 모델·프롬프트를 바꿀 때마다 같은 세트로 돌려 비교한다.
        평가 세트는 학습·프롬프트 개발에 쓰지 않도록 분리해 둔다.
  formula: |
    정확도 = 맞힌 문제 / 전체 문제
    표준오차(이항) ≈ √(p(1−p)/n)  → n=100, p=0.8이면 ±0.04
  example: >-
    배터리 문헌 정보 추출용 모델을 고를 때, 실제 논문 50편에서 '양극 소재·용량·사이클 수·온도'를 사람이 직접 뽑아 정답표를 만들고 각 모델의 추출 정확도를 비교하면 공개 순위보다 훨씬 쓸모 있는 판단을 할 수 있다.
  misconception: >-
    벤치마크 점수가 1~2점 높은 모델이 항상 더 좋다고 생각하기 쉽지만, 문제 수가 적으면 그 정도 차이는 통계적 오차 안에 들 수 있다.
  connection: >-
    머신러닝의 교차검증·데이터 누수 원칙이 LLM 평가에도 그대로 적용된다. 평가 세트를 프롬프트 개발에 반복 사용하면 그 세트에 과적합한다.
  quiz:
    question: "벤치마크 문제가 학습 데이터에 섞여 점수가 부풀려지는 현상은?"
    choices: ["데이터 오염", "과소적합", "양자화", "토큰화"]
    answer_index: 0
    explanation: "평가 문제가 학습 데이터에 포함되면 모델이 답을 기억할 수 있어 실제 능력보다 점수가 높게 나온다."
  keywords:
    - {ko: "벤치마크", en: "benchmark"}
    - {ko: "데이터 오염", en: "data contamination"}
    - {ko: "LLM 채점자", en: "LLM-as-a-judge"}
  next_topics: ["교차검증과 데이터 누수", "도구 사용과 LLM 에이전트"]
  references: ["L. Zheng et al., Judging LLM-as-a-judge with MT-Bench and Chatbot Arena, NeurIPS, 2023"]

- concept: "도구 사용과 LLM 에이전트"
  title: "LLM 에이전트: 생각하고, 도구를 쓰고, 결과를 보고 다시 생각한다"
  level: 중급
  one_liner: >-
    도구 사용은 LLM이 계산기·검색·코드 실행·API 같은 외부 기능을 호출하게 하는 것이고, 에이전트는 이를 반복하며 목표를 이룰 때까지 스스로 계획하고 행동하는 시스템이다.
  sections:
    - heading: "도구 호출"
      body: >-
        개발자가 도구의 이름, 설명, 입력 형식(JSON 스키마)을 알려 주면 모델은 필요할 때 '이 도구를 이 인자로 호출'하는 구조화된 출력을 낸다. 프로그램이 실제로 도구를 실행하고 결과를 다시 모델에 넣으면
        모델이 그 결과를 보고 답하거나 다음 도구를 호출한다. 계산, 최신 정보, 데이터베이스 조회처럼 모델 혼자 하기 어려운 일을 맡길 수 있다.
    - heading: "에이전트 고리"
      body: >-
        에이전트는 '관찰 → 생각 → 행동(도구 호출) → 결과 관찰'을 반복한다(ReAct 방식). 코드를 작성하고 실행해 보고 오류를 고치거나, 여러 자료를 찾아 비교해 보고서를 쓰는 등 여러 단계 작업을 할 수 있다.
        모델 컨텍스트 프로토콜(MCP) 같은 표준은 여러 도구를 같은 방식으로 연결하게 해 준다.
    - heading: "설계할 때 생각할 것"
      body: >-
        단계가 길어질수록 작은 실수가 쌓인다. 도구 설명을 명확히 하고, 결과를 검증하는 단계를 넣고, 위험한 행동(파일 삭제, 결제, 장비 제어)에는 사람의 승인을 받게 해야 한다. 외부 문서에 숨은 지시로 에이전트를 조종하는
        프롬프트 주입도 주의해야 한다. 간단한 고정 절차로 충분한 일이라면 에이전트보다 정해진 워크플로가 더 안정적이다.
  formula: |
    반복: thought_t → action_t = (tool, args) → observation_t
    종료: 목표 달성 판단 또는 단계 한도 도달
  example: >-
    '이 폴더의 사이클 데이터 파일들로 셀별 용량 유지율 그래프를 그리고 80%에 도달한 사이클을 표로 정리해 줘'라고 하면, 에이전트는 파일을 읽는 코드를 쓰고 실행하고 오류를 고치며 그래프와 표를 만든다.
  misconception: >-
    에이전트가 알아서 하니 결과를 확인할 필요가 없다고 생각하기 쉽지만, 중간에 잘못된 가정(단위 착오, 잘못된 파일)을 하고도 그럴듯한 결과를 낼 수 있어 검증이 필수다.
  connection: >-
    실험 장비 제어 API, 데이터 분석 코드, 문헌 검색을 도구로 연결한 LLM 에이전트가 자율 실험실의 '계획 수립'을 맡는 연구가 진행되고 있다. 장비 제어에는 반드시 안전 장치와 사람 승인이 필요하다.
  quiz:
    question: "LLM 에이전트에서 프롬프트 주입이 위험한 이유는?"
    choices: ["토큰이 늘어서", "외부 문서에 숨은 지시가 에이전트의 행동을 바꿀 수 있어서", "온도가 바뀌어서", "학습이 다시 시작되어서"]
    answer_index: 1
    explanation: "에이전트가 읽은 웹페이지나 문서 속 지시를 사용자 지시로 착각해 원치 않는 행동을 할 수 있다."
  keywords:
    - {ko: "도구 사용", en: "tool use"}
    - {ko: "LLM 에이전트", en: "LLM agent"}
    - {ko: "프롬프트 주입", en: "prompt injection"}
  next_topics: ["LLM 평가와 벤치마크", "베이지안 최적화"]
  references: ["S. Yao et al., ReAct: synergizing reasoning and acting in language models, ICLR, 2023", "T. Schick et al., Toolformer: language models can teach themselves to use tools, NeurIPS, 2023"]

- concept: "양자화(quantization)"
  title: "양자화: 숫자의 정밀도를 낮춰 모델을 가볍게"
  level: 중급
  one_liner: >-
    양자화는 모델 가중치(와 활성값)를 16비트 부동소수점 대신 8비트·4비트 정수 같은 낮은 정밀도로 표현해, 메모리와 계산을 줄이면서 성능 손실을 최소화하는 기법이다.
  sections:
    - heading: "원리"
      body: >-
        실수 값의 범위를 정해진 개수의 단계로 나누고, 각 값을 가장 가까운 단계의 정수로 저장한다. 원래 값으로 되돌릴 때는 저장해 둔 배율(scale)과 영점(zero point)을 쓴다.
        16비트에서 4비트로 줄이면 가중치 메모리가 약 4분의 1이 되어, 큰 모델을 작은 GPU나 노트북에서 돌릴 수 있다.
    - heading: "방법들"
      body: >-
        학습이 끝난 모델을 바로 양자화하는 학습 후 양자화(PTQ)가 가장 흔하다. 작은 보정 데이터로 오차를 줄이는 GPTQ, 중요한 가중치를 보호하는 AWQ 같은 방법이 있다. 학습 중에 양자화 효과를 흉내 내는
        양자화 인식 학습(QAT)은 더 정확하지만 비용이 든다. 텐서 전체 대신 작은 그룹마다 배율을 두면 정확도가 좋아진다.
    - heading: "어려움"
      body: >-
        LLM의 활성값에는 소수의 매우 큰 이상치가 있어, 단순히 범위를 나누면 나머지 값의 정밀도가 크게 떨어진다. 그래서 이상치를 따로 처리하는 기법이 필요하다. 4비트 이하로 내리면 추론·수학 같은
        어려운 과제에서 성능 저하가 더 두드러질 수 있어, 쓰려는 과제로 직접 확인해야 한다.
  formula: |
    q = round(x / s) + z,   x̂ = s · (q − z)
    s = (x_max − x_min) / (2^b − 1)   (b: 비트 수)
  example: >-
    70억 파라미터 모델은 16비트로 약 14 GB가 필요하지만, 4비트로 양자화하면 약 4 GB 안팎이 되어 일반 노트북 GPU에서도 돌릴 수 있다. 실험실 내부 데이터를 외부로 보내지 않고 로컬에서 쓰고 싶을 때 유용하다.
  misconception: >-
    비트 수를 반으로 줄이면 속도도 항상 두 배가 된다고 생각하기 쉽지만, 실제 속도 향상은 하드웨어가 그 정밀도 연산을 지원하는지와 메모리 대역폭 병목인지에 따라 달라진다.
  connection: >-
    BMS 같은 임베디드 장치에 수명·상태 추정 신경망을 올릴 때도 8비트 정수 양자화가 흔히 쓰인다. LLM만의 기술이 아니다.
  quiz:
    question: "16비트 가중치를 4비트로 양자화하면 가중치 메모리는 대략?"
    choices: ["2배", "1/2", "1/4", "변하지 않음"]
    answer_index: 2
    explanation: "값 하나당 비트 수가 16에서 4로 줄어 가중치 메모리가 약 4분의 1이 된다(배율 등 부가 정보 제외)."
  keywords:
    - {ko: "양자화", en: "quantization"}
    - {ko: "학습 후 양자화", en: "post-training quantization"}
    - {ko: "이상치 활성값", en: "activation outliers"}
  next_topics: ["LoRA와 파라미터 효율적 파인튜닝", "컨텍스트 윈도와 KV 캐시"]
  references: ["E. Frantar et al., GPTQ: accurate post-training quantization for generative pre-trained transformers, ICLR, 2023", "T. Dettmers et al., LLM.int8(): 8-bit matrix multiplication for transformers at scale, NeurIPS, 2022"]

- concept: "전문가 혼합(MoE)"
  title: "MoE: 파라미터는 많이, 계산은 조금만"
  level: 심화
  one_liner: >-
    전문가 혼합(MoE)은 피드포워드 층을 여러 '전문가' 망으로 나누고 라우터가 토큰마다 몇 개만 골라 쓰게 해, 전체 파라미터는 크게 늘리면서 토큰당 계산량은 거의 늘리지 않는 구조다.
  sections:
    - heading: "구조"
      body: >-
        트랜스포머 블록의 MLP 자리에 같은 모양의 전문가 MLP를 여러 개(예: 8~수백 개) 둔다. 작은 라우터 망이 각 토큰의 표현을 보고 전문가별 점수를 매겨 상위 k개(보통 1~2개)만 활성화한다.
        출력은 선택된 전문가 출력의 가중합이다. 그래서 전체 파라미터 수와 토큰당 실제로 쓰는 '활성 파라미터 수'가 다르다.
    - heading: "장점"
      body: >-
        같은 계산 예산에서 더 많은 파라미터(더 많은 지식 저장 공간)를 쓸 수 있어, 비슷한 계산량의 밀집 모델보다 성능이 좋은 경우가 많다. 많은 최신 대형 모델이 MoE 구조를 쓰는 것으로 알려져 있다.
    - heading: "어려움"
      body: >-
        라우터가 몇몇 전문가에만 토큰을 몰아주면 다른 전문가는 학습되지 않는다. 그래서 부하 균형을 위한 보조 손실이나 용량 제한을 둔다. 계산은 적어도 모든 전문가의 가중치를 메모리에 올려야 해서 메모리 요구가 크고,
        여러 장치에 전문가를 나누면 통신 비용이 생긴다. 전문가가 사람이 이해하는 주제별로 깔끔하게 나뉘는 것은 아니다.
  formula: |
    y = Σ_{i∈TopK(g(x))} g_i(x) · E_i(x),   g(x) = softmax(W_r · x)
    활성 파라미터 ≈ 공유 부분 + k × (전문가 1개 크기)
  example: >-
    전문가 8개 중 2개를 쓰는 MoE 모델은 전체 파라미터가 밀집 모델의 몇 배여도 토큰당 계산은 전문가 2개 분량이라, 비슷한 계산의 밀집 모델보다 많은 지식을 담을 수 있다.
  misconception: >-
    MoE의 각 전문가가 '화학 전문가', '코딩 전문가'처럼 주제별로 나뉜다고 생각하기 쉽지만, 분석해 보면 주로 토큰 종류나 문법적 패턴 같은 더 낮은 수준의 특징으로 나뉘는 경우가 많다.
  connection: >-
    '전문가 혼합'이라는 아이디어는 원래 고전적 머신러닝에서 나왔으며, 배터리처럼 운전 조건(온도, C-rate)에 따라 거동이 달라지는 시스템에 조건별 하위 모델을 두는 혼합 모델로도 응용된다.
  quiz:
    question: "MoE 모델에서 토큰마다 어떤 전문가를 쓸지 정하는 부분은?"
    choices: ["토크나이저", "라우터(게이트) 망", "임베딩 행렬", "출력 소프트맥스"]
    answer_index: 1
    explanation: "라우터가 토큰 표현을 보고 전문가별 점수를 매겨 상위 k개 전문가만 활성화한다."
  keywords:
    - {ko: "전문가 혼합", en: "mixture of experts"}
    - {ko: "희소 활성화", en: "sparse activation"}
    - {ko: "부하 균형", en: "load balancing"}
  next_topics: ["스케일링 법칙", "트랜스포머 구조"]
  references: ["N. Shazeer et al., Outrageously large neural networks: the sparsely-gated mixture-of-experts layer, ICLR, 2017", "W. Fedus, B. Zoph, N. Shazeer, Switch Transformers, JMLR, 2022"]
