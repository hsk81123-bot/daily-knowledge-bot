# AI › 머신러닝 공부 노트

- concept: "편향-분산 트레이드오프"
  title: "편향-분산 트레이드오프: 너무 단순해도, 너무 복잡해도 틀린다"
  level: 입문
  one_liner: >-
    모델의 예측 오차는 편향(단순해서 생기는 체계적 오차), 분산(데이터에 너무 민감해서 생기는 흔들림), 줄일 수 없는 잡음으로 나뉘며, 모델 복잡도를 바꾸면 앞의 둘이 서로 반대로 움직인다.
  sections:
    - heading: "두 종류의 오차"
      body: >-
        편향은 모델이 실제 관계를 표현하지 못해 생기는 오차다. 곡선 관계를 직선으로 맞추면 데이터를 아무리 많이 모아도 틀린다(과소적합). 분산은 학습 데이터가 조금만 바뀌어도
        모델이 크게 달라지는 정도다. 아주 유연한 모델은 학습 데이터의 잡음까지 외워 새 데이터에서 틀린다(과적합).
    - heading: "트레이드오프"
      body: >-
        모델을 복잡하게 만들면 편향은 줄고 분산은 늘어난다. 그래서 검증 오차는 복잡도에 따라 U자 모양이 되고, 그 바닥이 적절한 복잡도다. 정규화, 앙상블, 데이터 추가는
        이 균형을 바꾸는 도구다. 데이터가 많아지면 분산이 줄어 더 복잡한 모델을 쓸 수 있다.
    - heading: "현대 딥러닝과의 관계"
      body: >-
        매개변수가 데이터보다 훨씬 많은 신경망은 고전적 설명과 달리 학습 데이터를 완벽히 맞추고도 잘 일반화하는 경우가 많다. 복잡도를 더 늘리면 검증 오차가 다시 내려가는
        '이중 하강(double descent)' 현상도 보고되었다. 그래도 데이터가 적은 과학 문제에서는 고전적 트레이드오프가 여전히 중요하다.
  formula: |
    E[(y − f̂(x))²] = Bias[f̂(x)]² + Var[f̂(x)] + σ²
    σ²: 줄일 수 없는 잡음
  example: >-
    배터리 50개 셀의 수명을 예측할 때 특징 수백 개로 복잡한 모델을 쓰면 학습 오차는 0에 가깝지만 새 셀에서 크게 틀린다. 특징을 줄이거나 정규화한 선형 모델이 오히려 더 잘 맞는 경우가 많다.
  misconception: >-
    학습 오차가 작으면 좋은 모델이라고 보기 쉽지만, 일반화 성능은 반드시 학습에 쓰지 않은 데이터로 평가해야 한다.
  connection: >-
    배터리 실험 데이터는 비싸서 표본이 적다. 그래서 분산을 줄이는 정규화·물리 지식 반영·앙상블이 배터리 머신러닝에서 특히 중요하다.
  quiz:
    question: "학습 오차는 매우 작은데 검증 오차가 큰 상태는?"
    choices: ["과소적합(고편향)", "과적합(고분산)", "잡음이 0인 상태", "정상적인 상태"]
    answer_index: 1
    explanation: "학습 데이터의 잡음까지 외워 새 데이터에서 틀리는 과적합, 즉 분산이 큰 상태다."
  keywords:
    - {ko: "편향", en: "bias"}
    - {ko: "분산", en: "variance"}
    - {ko: "과적합", en: "overfitting"}
  next_topics: ["L1·L2 정규화", "교차검증과 데이터 누수", "결정 트리와 랜덤 포레스트"]
  references: ["T. Hastie, R. Tibshirani, J. Friedman, The Elements of Statistical Learning, 2nd ed., 2009"]

- concept: "L1·L2 정규화"
  title: "L1·L2 정규화: 가중치에 벌점을 매겨 과적합을 막는다"
  level: 입문
  one_liner: >-
    정규화는 손실 함수에 가중치 크기에 대한 벌점을 더해 모델을 단순하게 만들며, L2(릿지)는 가중치를 고르게 줄이고 L1(라쏘)은 일부를 정확히 0으로 만들어 특징을 고른다.
  sections:
    - heading: "L2 정규화(릿지)"
      body: >-
        손실에 가중치 제곱합 λΣw²를 더한다. 큰 가중치를 강하게 벌주므로 모든 가중치가 0 쪽으로 작아지지만 정확히 0이 되지는 않는다. 서로 상관된 특징이 있을 때 가중치를 나눠 갖게 해 안정적이다.
        신경망에서는 가중치 감쇠(weight decay)라는 이름으로 쓰인다.
    - heading: "L1 정규화(라쏘)"
      body: >-
        손실에 가중치 절댓값 합 λΣ|w|를 더한다. 0 근처에서도 벌점의 기울기가 일정해 작은 가중치를 정확히 0으로 만든다. 그래서 중요하지 않은 특징을 자동으로 빼는 특징 선택 효과가 있다.
        상관된 특징 중 하나만 남기는 경향이 있어, 두 방식을 섞은 엘라스틱 넷을 쓰기도 한다.
    - heading: "λ 고르기와 해석"
      body: >-
        λ가 크면 모델이 너무 단순해지고(편향↑), 작으면 과적합한다(분산↑). λ는 교차검증으로 고른다. 확률적으로 보면 L2는 가중치에 가우시안 사전분포를, L1은 라플라스 사전분포를 둔 것과 같다.
        정규화 전에는 특징의 크기를 표준화해야 벌점이 공평하게 적용된다.
  formula: |
    릿지: min Σ(y − Xw)² + λ‖w‖₂²
    라쏘: min Σ(y − Xw)² + λ‖w‖₁
    엘라스틱 넷: λ1‖w‖₁ + λ2‖w‖₂²
  example: >-
    초기 사이클 데이터에서 뽑은 특징 수십 개로 셀 수명을 예측할 때, 엘라스틱 넷 선형 모델이 적은 데이터에서도 좋은 성능을 내고 어떤 특징이 중요한지 보여 준 연구가 있다.
  misconception: >-
    L1이 0으로 만든 특징은 결과와 관계없다는 뜻이 아니다. 다른 상관된 특징이 그 정보를 대신 담고 있을 수 있다.
  connection: >-
    EIS를 DRT로 바꾸는 계산도 티호노프(L2) 정규화를 쓴 회귀 문제다. 머신러닝의 정규화와 전기화학 역문제는 같은 수학을 공유한다.
  quiz:
    question: "일부 가중치를 정확히 0으로 만들어 특징 선택 효과를 내는 정규화는?"
    choices: ["L2(릿지)", "L1(라쏘)", "드롭아웃", "배치 정규화"]
    answer_index: 1
    explanation: "L1 벌점은 0 근처에서도 기울기가 일정해 작은 가중치를 정확히 0으로 만든다."
  keywords:
    - {ko: "릿지 회귀", en: "ridge regression"}
    - {ko: "라쏘", en: "lasso"}
    - {ko: "엘라스틱 넷", en: "elastic net"}
  next_topics: ["교차검증과 데이터 누수", "DRT(완화 시간 분포) 분석"]
  references: ["R. Tibshirani, Regression shrinkage and selection via the lasso, J. Royal Statistical Society B, 1996"]

- concept: "교차검증과 데이터 누수"
  title: "교차검증과 데이터 누수: 시험지를 미리 보면 안 된다"
  level: 입문
  one_liner: >-
    교차검증은 데이터를 여러 번 나눠 학습과 검증을 반복해 일반화 성능을 안정적으로 추정하는 방법이고, 데이터 누수는 검증 데이터의 정보가 학습에 새어 들어가 성능을 부풀리는 실수다.
  sections:
    - heading: "k-겹 교차검증"
      body: >-
        데이터를 k개 묶음으로 나누고, 한 묶음은 검증에, 나머지는 학습에 쓰기를 k번 반복해 평균 성능을 낸다. 한 번 나눈 검증보다 운에 덜 좌우된다. 하이퍼파라미터를 고르는 데 교차검증을 썼다면,
        최종 성능은 그 과정에 전혀 쓰지 않은 별도 시험 세트로 보고해야 한다(중첩 교차검증).
    - heading: "데이터 누수의 흔한 형태"
      body: >-
        (1) 전체 데이터로 정규화·특징 선택을 한 뒤 나누기, (2) 같은 셀이나 같은 배치에서 나온 측정이 학습과 검증에 함께 들어가기, (3) 시계열에서 미래 데이터로 과거를 예측하기,
        (4) 정답과 사실상 같은 정보를 담은 특징 쓰기. 모두 검증 성능을 실제보다 좋게 만든다.
    - heading: "올바른 분할"
      body: >-
        전처리는 학습 묶음에서만 맞추고(fit) 검증 묶음에는 적용만(transform) 해야 한다. 같은 실험 단위에서 나온 데이터는 같은 묶음에 넣는 그룹 k-겹을 쓰고, 시계열은 시간 순서를 지키는 분할을 쓴다.
        분할 방식이 실제로 모델을 쓸 상황(새 셀, 새 소재, 미래 시점)을 흉내 내야 한다.
  formula: |
    CV 추정치 = (1/k) Σ_{i=1..k} L(f̂^(−i), D_i)
    f̂^(−i): i번째 묶음을 뺀 데이터로 학습한 모델
  example: >-
    한 셀의 사이클 데이터를 무작위로 섞어 나누면, 같은 셀의 이웃 사이클이 학습과 검증에 함께 들어가 거의 완벽한 예측이 나온다. 셀 단위로 나누면 성능이 크게 떨어지는데, 이쪽이 실제 성능에 가깝다.
  misconception: >-
    교차검증만 하면 누수가 없다고 생각하기 쉽지만, 분할 단위가 잘못되면 교차검증 결과 자체가 부풀려진다.
  connection: >-
    소재 탐색에서는 화학적으로 비슷한 소재가 학습·검증에 섞이는 것도 누수다. 그래서 조성 군집 단위로 나누는 'leave-cluster-out' 검증이 권장된다.
  quiz:
    question: "다음 중 데이터 누수에 해당하는 것은?"
    choices: ["학습 묶음으로만 표준화 기준을 맞춤", "같은 셀의 사이클을 학습·검증에 나눠 넣음", "시간 순서를 지켜 분할함", "별도 시험 세트를 남겨 둠"]
    answer_index: 1
    explanation: "같은 셀의 데이터는 서로 매우 닮아 검증 성능을 부풀린다. 셀 단위(그룹)로 나눠야 한다."
  keywords:
    - {ko: "교차검증", en: "cross-validation"}
    - {ko: "데이터 누수", en: "data leakage"}
    - {ko: "그룹 k-겹", en: "group k-fold"}
  next_topics: ["하이퍼파라미터 튜닝 전략", "편향-분산 트레이드오프"]
  references: ["S. Kaufman, S. Rosset, C. Perlich, O. Stitelman, Leakage in data mining: formulation, detection, and avoidance, ACM TKDD, 2012"]

- concept: "결정 트리와 랜덤 포레스트"
  title: "결정 트리와 랜덤 포레스트: 질문을 이어 가며 나누고, 여러 나무로 투표한다"
  level: 입문
  one_liner: >-
    결정 트리는 특징에 대한 예/아니오 질문으로 데이터를 반복해 나누는 모델이고, 랜덤 포레스트는 서로 다른 데이터와 특징으로 키운 나무 여러 그루의 평균으로 분산을 줄인다.
  sections:
    - heading: "결정 트리"
      body: >-
        각 노드에서 '특징 j가 임계값 t보다 작은가'를 기준으로 데이터를 둘로 나눈다. 분류에서는 지니 불순도나 엔트로피가, 회귀에서는 제곱 오차가 가장 많이 줄어드는 분할을 고른다.
        해석이 쉽고 특징 크기 조정이 필요 없지만, 깊게 키우면 데이터에 아주 민감해 과적합한다.
    - heading: "배깅과 랜덤 포레스트"
      body: >-
        배깅은 부트스트랩(중복 허용 무작위 추출)으로 만든 여러 데이터셋에 각각 나무를 키워 평균한다. 랜덤 포레스트는 여기에 더해 각 분할에서 특징 일부만 무작위로 후보로 쓴다.
        그래서 나무들이 서로 덜 닮고, 평균했을 때 분산이 더 크게 줄어든다.
    - heading: "장점과 한계"
      body: >-
        하이퍼파라미터에 덜 민감해 '먼저 써 보는' 기준 모델로 좋다. 부트스트랩에서 빠진 표본(OOB)으로 별도 검증 없이 성능을 추정할 수 있다. 하지만 학습 데이터 범위 밖으로는 외삽하지 못해,
        새 조성이나 더 긴 수명을 예측할 때 학습 데이터의 최대·최소값에 갇힌다.
  formula: |
    지니 불순도: G = 1 − Σ p_k²
    배깅 분산(상관 ρ, 나무 B개): ρσ² + (1−ρ)σ²/B
  example: >-
    전극 공정 변수(슬러리 점도, 건조 온도, 압연 밀도)로 전극 저항을 예측할 때 랜덤 포레스트는 적은 튜닝으로 괜찮은 성능을 내고, 특징 중요도로 어떤 공정 변수가 중요한지 대략 알려 준다.
  misconception: >-
    랜덤 포레스트의 불순도 기반 특징 중요도는 값의 종류가 많은 특징을 과대평가하는 경향이 있다. 순열 중요도나 SHAP로 확인하는 것이 좋다.
  connection: >-
    배터리 수명 예측처럼 표본이 수십~수백 개인 문제에서 랜덤 포레스트는 신경망보다 안정적인 기준선(baseline) 역할을 하는 경우가 많다.
  quiz:
    question: "랜덤 포레스트가 단일 결정 트리보다 분산이 작은 주된 이유는?"
    choices: ["나무를 더 깊게 키워서", "서로 덜 닮은 여러 나무를 평균해서", "특징을 표준화해서", "경사 하강법을 써서"]
    answer_index: 1
    explanation: "부트스트랩과 무작위 특징 선택으로 나무 간 상관을 낮춘 뒤 평균하므로 분산이 줄어든다."
  keywords:
    - {ko: "결정 트리", en: "decision tree"}
    - {ko: "배깅", en: "bagging"}
    - {ko: "OOB 오차", en: "out-of-bag error"}
  next_topics: ["그래디언트 부스팅(XGBoost, LightGBM)", "특성 공학과 특성 중요도(SHAP)"]
  references: ["L. Breiman, Random forests, Machine Learning, 2001"]

- concept: "그래디언트 부스팅(XGBoost, LightGBM)"
  title: "그래디언트 부스팅: 앞 모델의 실수를 다음 모델이 고친다"
  level: 중급
  one_liner: >-
    그래디언트 부스팅은 얕은 나무를 하나씩 더해 가며 매번 이전까지의 예측이 틀린 방향(손실의 기울기)을 맞추는 방식으로, 표 형식 데이터에서 가장 강력한 방법 중 하나다.
  sections:
    - heading: "아이디어"
      body: >-
        처음에는 단순한 예측(평균)으로 시작한다. 그다음 각 표본에서 손실을 줄이는 방향, 즉 음의 기울기(제곱 오차라면 잔차)를 계산하고, 이를 맞추는 작은 나무를 하나 학습해 학습률만큼 더한다.
        이것을 수백~수천 번 반복한다. 랜덤 포레스트가 독립적인 나무를 평균한다면, 부스팅은 나무를 순차적으로 쌓는다.
    - heading: "XGBoost와 LightGBM"
      body: >-
        XGBoost는 손실의 2차 근사와 나무 복잡도에 대한 정규화 항을 쓰고, 결측값 처리와 병렬화를 잘 구현해 널리 쓰였다. LightGBM은 특징 값을 구간으로 묶는 히스토그램 방식과
        잎 단위 성장(leaf-wise)으로 큰 데이터에서 매우 빠르다. CatBoost는 범주형 특징 처리에 강하다.
    - heading: "튜닝 포인트"
      body: >-
        학습률, 나무 수, 나무 깊이(또는 잎 수), 표본·특징 부분 추출 비율, 정규화 계수가 주요 하이퍼파라미터다. 학습률을 낮추고 나무를 늘리면 대체로 성능이 좋아지지만 느려진다.
        검증 손실이 더 줄지 않으면 멈추는 조기 종료(early stopping)가 필수다.
  formula: |
    F_m(x) = F_{m−1}(x) + η · h_m(x)
    h_m ≈ argmin_h Σ [ −∂L(y_i, F_{m−1}(x_i))/∂F − h(x_i) ]²
  example: >-
    공개 배터리 사이클 데이터셋으로 초기 100사이클 특징에서 수명을 예측하는 과제에서, 그래디언트 부스팅은 적은 노력으로 강한 기준 성능을 내는 경우가 많다.
  misconception: >-
    부스팅은 항상 랜덤 포레스트보다 낫다고 보기 쉽지만, 데이터가 아주 적거나 잡음이 크면 과적합하기 쉬워 랜덤 포레스트가 더 안정적일 수 있다.
  connection: >-
    표 형식인 공정·조성 데이터에서는 아직도 딥러닝보다 그래디언트 부스팅이 우세한 경우가 많아, 배터리 소재·공정 최적화의 실무 기본 도구다.
  quiz:
    question: "그래디언트 부스팅에서 새 나무가 학습하는 목표는?"
    choices: ["원래 정답 y 그대로", "이전 예측의 손실 기울기(잔차)", "무작위 잡음", "특징의 평균"]
    answer_index: 1
    explanation: "새 나무는 현재 예측이 틀린 방향, 즉 손실의 음의 기울기(제곱 오차라면 잔차)를 맞춘다."
  keywords:
    - {ko: "그래디언트 부스팅", en: "gradient boosting"}
    - {ko: "조기 종료", en: "early stopping"}
    - {ko: "학습률", en: "learning rate"}
  next_topics: ["특성 공학과 특성 중요도(SHAP)", "하이퍼파라미터 튜닝 전략"]
  references: ["T. Chen, C. Guestrin, XGBoost: A scalable tree boosting system, KDD, 2016", "J. H. Friedman, Greedy function approximation: a gradient boosting machine, Annals of Statistics, 2001"]

- concept: "서포트 벡터 머신과 커널 트릭"
  title: "SVM과 커널 트릭: 가장 넓은 길로 나누기"
  level: 중급
  one_liner: >-
    SVM은 두 클래스 사이의 여백(margin)이 가장 넓은 경계를 찾고, 커널 트릭으로 데이터를 고차원으로 직접 옮기지 않고도 비선형 경계를 만든다.
  sections:
    - heading: "최대 여백"
      body: >-
        선형으로 나눌 수 있는 두 클래스를 가르는 직선(초평면)은 무수히 많다. SVM은 경계에서 가장 가까운 점까지의 거리, 즉 여백이 최대인 경계를 고른다. 경계를 정하는 데는
        가장 가까운 점들(서포트 벡터)만 쓰이므로, 멀리 있는 점에는 둔감하다. 완전히 나눌 수 없는 경우 C 값으로 오분류를 얼마나 허용할지 정한다(소프트 마진).
    - heading: "커널 트릭"
      body: >-
        SVM의 최적화는 데이터 점들 사이의 내적만 필요로 한다. 내적을 커널 함수 k(x, x′)로 바꾸면, 데이터를 고차원 특징 공간으로 옮긴 뒤 내적한 것과 같은 효과를 얻는다.
        RBF(가우시안) 커널은 무한 차원 공간에 대응해 매우 유연한 경계를 만든다.
    - heading: "쓰임과 한계"
      body: >-
        중간 크기의 고차원 데이터(예: 스펙트럼)에서 강하다. 회귀 버전(SVR)도 있다. 하지만 표본 수가 많으면 커널 행렬 계산이 무거워지고(대략 n²~n³), 특징 크기 조정과 C·γ 튜닝에 민감하다.
        확률 출력을 바로 주지 않는다는 점도 단점이다.
  formula: |
    min ½‖w‖² + C Σ ξ_i   s.t. y_i(w·x_i + b) ≥ 1 − ξ_i
    RBF 커널: k(x, x′) = exp(−γ‖x − x′‖²)
  example: >-
    라만이나 XRD 스펙트럼을 입력으로 시료가 어느 상(phase)에 속하는지 분류할 때, 데이터가 수백 개 수준이면 RBF 커널 SVM이 좋은 성능을 내는 경우가 많다.
  misconception: >-
    커널을 쓰면 데이터를 실제로 고차원 벡터로 바꿔 계산한다고 생각하기 쉽지만, 커널 트릭의 핵심은 그 변환을 명시적으로 하지 않는다는 것이다.
  connection: >-
    SVM의 커널 개념은 가우시안 프로세스와 같은 뿌리를 가진다. 배터리 데이터 회귀에서 SVR과 GP는 비슷한 커널을 쓰지만 GP는 불확실성까지 준다.
  quiz:
    question: "SVM에서 결정 경계를 실제로 정하는 데이터 점은?"
    choices: ["모든 점", "경계에서 가장 가까운 서포트 벡터", "가장 먼 점", "무작위로 뽑은 점"]
    answer_index: 1
    explanation: "여백에 걸리거나 그 안에 있는 서포트 벡터만 해에 기여하고, 멀리 있는 점은 경계에 영향을 주지 않는다."
  keywords:
    - {ko: "서포트 벡터 머신", en: "support vector machine"}
    - {ko: "커널 트릭", en: "kernel trick"}
    - {ko: "최대 여백", en: "maximum margin"}
  next_topics: ["가우시안 프로세스 회귀", "주성분 분석(PCA)"]
  references: ["C. Cortes, V. Vapnik, Support-vector networks, Machine Learning, 1995"]

- concept: "주성분 분석(PCA)"
  title: "PCA: 데이터가 가장 많이 퍼진 방향 찾기"
  level: 입문
  one_liner: >-
    PCA는 서로 상관된 많은 변수를 분산이 큰 순서의 서로 직교하는 새 축(주성분)으로 바꿔, 정보 손실을 최소로 하면서 차원을 줄인다.
  sections:
    - heading: "원리"
      body: >-
        데이터를 평균이 0이 되게 맞춘 뒤 공분산 행렬을 구한다. 공분산 행렬의 고유벡터가 주성분 방향이고, 고유값이 그 방향의 분산이다. 고유값이 큰 순서대로 몇 개의 축만 남기면
        데이터를 적은 수의 좌표로 요약할 수 있다. 실제 계산은 보통 특잇값 분해(SVD)로 한다.
    - heading: "몇 개를 남기나"
      body: >-
        누적 설명 분산 비율이 예를 들어 90~95%가 되는 지점이나, 고유값 그래프가 꺾이는 지점(scree plot의 팔꿈치)을 보고 정한다. 남긴 주성분으로 데이터를 다시 만들어
        재구성 오차를 확인하기도 한다.
    - heading: "주의할 점"
      body: >-
        PCA는 선형 변환이라 곡선 구조는 잘 잡지 못한다. 변수의 단위가 다르면 큰 값을 가진 변수가 주성분을 지배하므로 보통 표준화한 뒤 쓴다. 분산이 큰 방향이 꼭 예측에 중요한 방향은 아니라는 점도
        기억해야 한다. 비선형 차원 축소에는 커널 PCA, t-SNE, UMAP, 오토인코더가 쓰인다.
  formula: |
    공분산: Σ = (1/n) XᵀX  (X: 평균 중심화)
    Σ v_k = λ_k v_k,  설명 분산 비율 = λ_k / Σλ
  example: >-
    수백 개 전압 점으로 된 방전 곡선 데이터에 PCA를 적용하면 처음 2~3개 주성분만으로 대부분의 변화를 설명할 수 있고, 주성분 점수 그래프에서 열화된 셀이 한쪽으로 모이는 것을 볼 수 있다.
  misconception: >-
    주성분 하나가 특정 물리 원인 하나에 대응한다고 해석하기 쉽지만, 주성분은 수학적으로 직교하도록 만든 축이라 여러 원인이 섞여 있을 수 있다.
  connection: >-
    XPS·ToF-SIMS·operando XRD처럼 채널이 많은 분석 데이터를 정리하는 첫 단계로 PCA가 널리 쓰인다. 음수가 없는 스펙트럼에는 NMF가 더 해석하기 쉬운 성분을 주기도 한다.
  quiz:
    question: "PCA의 첫 번째 주성분 방향은?"
    choices: ["분산이 가장 작은 방향", "분산이 가장 큰 방향", "정답 y와 가장 상관이 큰 방향", "무작위 방향"]
    answer_index: 1
    explanation: "첫 주성분은 데이터가 가장 넓게 퍼진(분산이 최대인) 방향, 즉 공분산 행렬의 최대 고유값 고유벡터다."
  keywords:
    - {ko: "주성분 분석", en: "principal component analysis"}
    - {ko: "고유값 분해", en: "eigendecomposition"}
    - {ko: "차원 축소", en: "dimensionality reduction"}
  next_topics: ["k-means와 군집 평가", "오토인코더와 VAE", "ToF-SIMS 깊이 분석"]
  references: ["I. T. Jolliffe, J. Cadima, Principal component analysis: a review and recent developments, Phil. Trans. R. Soc. A, 2016"]

- concept: "k-means와 군집 평가"
  title: "k-means: 가장 가까운 중심으로 묶기"
  level: 입문
  one_liner: >-
    k-means는 데이터를 k개의 묶음으로 나누어 각 점이 가장 가까운 중심에 속하도록 반복 갱신하는 군집화 방법이며, 정답이 없으므로 군집 품질은 실루엣 점수 같은 지표로 따로 평가한다.
  sections:
    - heading: "알고리즘"
      body: >-
        (1) 중심 k개를 고른다. (2) 각 점을 가장 가까운 중심의 군집에 넣는다. (3) 각 군집의 평균으로 중심을 옮긴다. 이것을 바뀌는 점이 없을 때까지 반복한다. 군집 내 제곱 거리 합을 줄이는 방향으로
        움직이지만 지역 최적해에 빠질 수 있어, 초기값을 잘 고르는 k-means++와 여러 번 실행해 가장 좋은 결과를 쓰는 방법을 쓴다.
    - heading: "k 정하기와 평가"
      body: >-
        k를 늘리면 군집 내 거리 합은 항상 줄어들므로, 줄어드는 속도가 꺾이는 팔꿈치를 본다. 실루엣 점수는 각 점이 자기 군집과 얼마나 가깝고 다른 군집과 얼마나 먼지를 −1~1로 나타내며 클수록 좋다.
        정답 레이블이 일부 있다면 ARI 같은 외부 지표도 쓴다.
    - heading: "한계"
      body: >-
        k-means는 군집이 둥글고 크기가 비슷하다고 가정한다. 길쭉하거나 밀도가 다른 군집, 이상치에 약하다. 이런 경우 가우시안 혼합 모델(GMM), 밀도 기반 DBSCAN, 계층적 군집이 낫다.
        거리 기반이므로 특징 표준화가 필요하다.
  formula: |
    목적: min Σ_k Σ_{x∈C_k} ‖x − μ_k‖²
    실루엣: s(i) = (b(i) − a(i)) / max(a(i), b(i))
  example: >-
    수백 개 셀의 초기 특성(용량, 저항, 자가 방전)을 군집화하면 성능이 비슷한 셀끼리 묶을 수 있어, 모듈을 만들 때 셀 편차를 줄이는 '셀 선별(sorting)'에 쓰인다.
  misconception: >-
    군집 결과가 깔끔하게 나왔다고 실제로 의미 있는 집단이 있다는 뜻은 아니다. k-means는 구조가 없는 데이터도 억지로 k개로 나눈다.
  connection: >-
    operando XRD나 라만 스펙트럼 시계열을 군집화하면 반응 단계(상전이 구간)를 자동으로 나눌 수 있어, 많은 데이터를 빠르게 훑어보는 데 유용하다.
  quiz:
    question: "k-means의 각 반복에서 중심은 어떻게 갱신되나?"
    choices: ["가장 먼 점으로", "군집에 속한 점들의 평균으로", "무작위로", "중앙값으로만"]
    answer_index: 1
    explanation: "각 군집에 속한 점들의 평균으로 중심을 옮기는 것이 군집 내 제곱 거리 합을 줄이는 갱신이다."
  keywords:
    - {ko: "k-평균 군집화", en: "k-means clustering"}
    - {ko: "실루엣 점수", en: "silhouette score"}
    - {ko: "가우시안 혼합 모델", en: "Gaussian mixture model"}
  next_topics: ["주성분 분석(PCA)", "불균형 데이터 다루기"]
  references: ["D. Arthur, S. Vassilvitskii, k-means++: the advantages of careful seeding, SODA, 2007"]

- concept: "가우시안 프로세스 회귀"
  title: "가우시안 프로세스: 예측과 함께 '모르는 정도'를 알려 준다"
  level: 중급
  one_liner: >-
    가우시안 프로세스(GP) 회귀는 함수 자체에 확률 분포를 두고 데이터로 갱신해, 각 입력에서 예측 평균과 불확실성(분산)을 함께 주는 비모수 베이지안 모델이다.
  sections:
    - heading: "함수 위의 분포"
      body: >-
        GP는 어떤 입력 점들을 고르든 그 점들에서의 함수값이 다변량 정규분포를 따른다고 가정한다. 두 점의 함수값이 얼마나 비슷한지는 커널(공분산 함수)이 정한다. RBF 커널은 가까운 입력일수록
        출력이 비슷하다는 '매끄러움'을 표현하고, 길이 척도(length scale)가 얼마나 멀리까지 비슷한지를 정한다.
    - heading: "예측"
      body: >-
        학습 데이터가 주어지면 새 입력에서의 함수값 분포를 닫힌 식으로 구할 수 있다. 데이터가 많은 곳에서는 분산이 작고, 데이터가 없는 곳에서는 분산이 커진다. 커널 하이퍼파라미터는
        주변 우도(marginal likelihood)를 최대화해 데이터에서 직접 고른다.
    - heading: "장단점"
      body: >-
        표본이 수십~수천 개인 문제에서 잘 작동하고, 불확실성이 자연스럽게 나와 실험 설계에 바로 쓸 수 있다. 하지만 n×n 행렬의 역행렬이 필요해 계산량이 n³으로 커지므로 큰 데이터에는 근사 방법이 필요하다.
        고차원 입력에서는 커널 선택이 어렵다.
  formula: |
    f ~ GP(m(x), k(x, x′))
    예측 평균: μ* = k*ᵀ (K + σ²I)⁻¹ y
    예측 분산: σ*² = k(x*, x*) − k*ᵀ (K + σ²I)⁻¹ k*
  example: >-
    EIS 특징으로 배터리 잔존 용량을 예측한 연구에서 GP는 예측값과 함께 신뢰 구간을 주어, 예측이 믿을 만한지 함께 판단할 수 있게 했다.
  misconception: >-
    GP의 불확실성이 항상 정확하다고 믿기 쉽지만, 커널 가정이 틀리면 불확실성도 틀린다. 특히 학습 범위 밖 외삽에서는 커널이 정한 형태로 평균에 수렴할 뿐이다.
  connection: >-
    실험이 비싼 배터리 소재·공정 최적화에서 GP는 베이지안 최적화의 대리 모델로 가장 많이 쓰인다. 수명 예측에도 불확실성을 함께 주는 장점 때문에 자주 쓰인다.
  quiz:
    question: "GP 회귀에서 데이터가 없는 영역의 예측 분산은 보통?"
    choices: ["0이 된다", "커진다", "음수가 된다", "학습 영역과 같다"]
    answer_index: 1
    explanation: "관측이 없는 곳에서는 커널로 연결된 정보가 적어 사전 분산에 가까운 큰 불확실성이 남는다."
  keywords:
    - {ko: "가우시안 프로세스", en: "Gaussian process"}
    - {ko: "커널 함수", en: "kernel function"}
    - {ko: "주변 우도", en: "marginal likelihood"}
  next_topics: ["베이지안 최적화", "능동 학습(active learning)"]
  references: ["C. E. Rasmussen, C. K. I. Williams, Gaussian Processes for Machine Learning, MIT Press, 2006"]

- concept: "베이지안 최적화"
  title: "베이지안 최적화: 비싼 실험을 적게 하며 최적점 찾기"
  level: 중급
  one_liner: >-
    베이지안 최적화는 지금까지의 실험 결과로 대리 모델(주로 GP)을 만들고, 기대 개선량 같은 획득 함수로 다음에 해 볼 조건을 골라, 적은 시도로 최적값을 찾는다.
  sections:
    - heading: "언제 쓰나"
      body: >-
        목적 함수가 블랙박스이고 한 번 평가하는 데 비용이 크며(실험 하루, 시뮬레이션 몇 시간) 기울기를 모를 때 쓴다. 변수는 보통 수 개~20개 안팎일 때 잘 작동한다.
        머신러닝 하이퍼파라미터 튜닝과 실험 조건 최적화에 널리 쓰인다.
    - heading: "반복 과정"
      body: >-
        (1) 초기 몇 점을 실험한다. (2) 결과로 대리 모델을 학습해 모든 후보 조건에서 예측 평균과 불확실성을 얻는다. (3) 획득 함수가 가장 큰 조건을 다음 실험으로 고른다.
        (4) 결과를 추가하고 반복한다. 획득 함수로는 기대 개선량(EI), 상한 신뢰 구간(UCB), 개선 확률(PI) 등이 있다.
    - heading: "탐색과 활용의 균형"
      body: >-
        예측이 좋은 곳만 고르면(활용) 지역 최적에 갇히고, 불확실한 곳만 고르면(탐색) 효율이 떨어진다. 획득 함수는 두 가지를 자동으로 섞는다. 여러 조건을 동시에 실험할 수 있으면
        배치 베이지안 최적화를, 목표가 여러 개면 다목적 최적화(파레토 전선)를 쓴다.
  formula: |
    EI(x) = E[max(f(x) − f⁺, 0)]
    UCB(x) = μ(x) + κ·σ(x)   (κ: 탐색 정도)
  example: >-
    급속 충전 프로토콜 224가지 후보 중 최적을 찾는 연구에서, 초기 사이클로 수명을 예측하는 모델과 베이지안 최적화를 결합해 전체를 다 시험하는 것보다 훨씬 짧은 기간에 좋은 프로토콜을 찾았다.
  misconception: >-
    베이지안 최적화가 전역 최적을 보장한다고 생각하기 쉽지만, 정해진 예산 안에서 효율적으로 좋은 해를 찾는 방법일 뿐이다. 변수가 매우 많으면 효율이 크게 떨어진다.
  connection: >-
    로봇 실험 장치와 결합한 자율 실험실(self-driving lab)에서 전해질 조성, 합성 온도, 코팅 조건을 사람 개입 없이 최적화하는 핵심 알고리즘이다.
  quiz:
    question: "UCB 획득 함수에서 κ를 크게 하면?"
    choices: ["활용을 더 중시한다", "탐색을 더 중시한다", "대리 모델이 필요 없어진다", "실험 수가 늘어난다"]
    answer_index: 1
    explanation: "UCB = μ + κσ이므로 κ가 클수록 불확실성(σ)이 큰 곳을 더 선호해 탐색이 늘어난다."
  keywords:
    - {ko: "베이지안 최적화", en: "Bayesian optimization"}
    - {ko: "획득 함수", en: "acquisition function"}
    - {ko: "자율 실험실", en: "self-driving laboratory"}
  next_topics: ["능동 학습(active learning)", "하이퍼파라미터 튜닝 전략", "C-rate와 율속 특성"]
  references: ["P. M. Attia et al., Closed-loop optimization of fast-charging protocols for batteries with machine learning, Nature, 2020", "B. Shahriari et al., Taking the human out of the loop: a review of Bayesian optimization, Proceedings of the IEEE, 2016"]

- concept: "분류 평가지표(정밀도, 재현율, ROC-AUC)"
  title: "정밀도·재현율·ROC-AUC: 정확도만 보면 속는다"
  level: 입문
  one_liner: >-
    분류 모델은 혼동 행렬에서 계산한 정밀도(맞다고 한 것 중 실제로 맞은 비율)와 재현율(실제 맞는 것 중 찾아낸 비율), 임계값 전체를 보는 ROC-AUC로 평가한다.
  sections:
    - heading: "혼동 행렬"
      body: >-
        양성을 양성으로 맞힌 TP, 음성을 양성으로 틀린 FP, 양성을 음성으로 놓친 FN, 음성을 음성으로 맞힌 TN으로 나눈다. 정확도는 (TP+TN)/전체인데, 불량이 1%인 데이터에서
        모두 정상이라고 하면 정확도 99%가 나온다. 그래서 정확도만으로는 부족하다.
    - heading: "정밀도와 재현율"
      body: >-
        정밀도 = TP/(TP+FP)는 '불량이라고 경고한 것 중 진짜 불량 비율', 재현율 = TP/(TP+FN)은 '진짜 불량 중 잡아낸 비율'이다. 임계값을 낮추면 재현율은 오르고 정밀도는 내려간다.
        둘의 조화 평균이 F1 점수다. 무엇을 우선할지는 오경보와 놓침의 비용으로 정한다.
    - heading: "ROC와 PR 곡선"
      body: >-
        ROC 곡선은 임계값을 바꾸며 FPR(가로)과 TPR=재현율(세로)을 그린 것이고, 그 아래 넓이 AUC는 무작위 양성 하나가 무작위 음성 하나보다 높은 점수를 받을 확률이다(0.5는 무작위, 1은 완벽).
        양성이 매우 드물면 ROC-AUC가 좋아 보여도 실제 정밀도는 낮을 수 있어, 정밀도-재현율(PR) 곡선을 함께 본다.
  formula: |
    Precision = TP / (TP + FP),  Recall = TP / (TP + FN)
    F1 = 2·P·R / (P + R),  FPR = FP / (FP + TN)
  example: >-
    생산 라인에서 내부 단락 위험 셀을 찾는 모델이라면, 위험 셀을 놓치는 비용이 매우 크므로 재현율을 높게 유지하는 임계값을 고르고, 늘어난 오경보는 추가 검사로 거른다.
  misconception: >-
    AUC가 높으면 어떤 임계값에서도 잘 작동한다고 생각하기 쉽지만, 실제 운영에서는 정해진 하나의 임계값에서의 정밀도·재현율이 중요하다.
  connection: >-
    배터리 불량·이상 탐지 데이터는 양성이 매우 드물어, PR 곡선과 재현율 기준 평가가 특히 중요하다.
  quiz:
    question: "불량이 매우 드문 데이터에서 '모두 정상'이라고 예측하는 모델의 재현율은?"
    choices: ["100%", "0%", "50%", "정확도와 같다"]
    answer_index: 1
    explanation: "불량을 하나도 양성으로 예측하지 않으므로 TP=0, 재현율 = 0이다. 정확도는 높게 나와도 쓸모가 없다."
  keywords:
    - {ko: "정밀도", en: "precision"}
    - {ko: "재현율", en: "recall"}
    - {ko: "ROC 곡선", en: "ROC curve"}
  next_topics: ["불균형 데이터 다루기", "교차검증과 데이터 누수"]
  references: ["T. Saito, M. Rehmsmeier, The precision-recall plot is more informative than the ROC plot when evaluating binary classifiers on imbalanced datasets, PLOS ONE, 2015"]

- concept: "특성 공학과 특성 중요도(SHAP)"
  title: "특성 공학과 SHAP: 좋은 입력을 만들고, 모델의 판단을 나눠 보기"
  level: 중급
  one_liner: >-
    특성 공학은 도메인 지식으로 원시 데이터를 모델이 쓰기 좋은 입력으로 바꾸는 일이고, SHAP은 게임 이론의 섀플리 값으로 각 예측을 특성별 기여로 공정하게 나눠 보여 준다.
  sections:
    - heading: "특성 공학"
      body: >-
        원시 신호(전압 곡선 수천 점)를 그대로 쓰기보다 물리적 의미가 있는 값(dQ/dV 피크 위치, 사이클 간 방전 곡선 차이의 분산, 내부 저항)으로 요약하면 적은 데이터로도 잘 학습된다.
        좋은 특성은 대개 모델 종류를 바꾸는 것보다 성능을 더 크게 올린다. 반대로 정답 정보를 몰래 담은 특성은 누수를 일으킨다.
    - heading: "SHAP"
      body: >-
        섀플리 값은 협력 게임에서 각 참여자의 공헌을 모든 참여 순서에 대해 평균한 값이다. SHAP은 특성을 참여자로, 예측값을 보상으로 보고 각 특성의 기여를 계산한다. 모든 특성의 SHAP 값을 더하면
        (예측 − 평균 예측)이 정확히 된다. 나무 모델에는 빠른 TreeSHAP이 있다.
    - heading: "해석의 한계"
      body: >-
        SHAP은 '모델이 어떻게 판단했는가'를 보여 줄 뿐 인과관계를 보여 주지 않는다. 특성끼리 상관이 크면 기여가 엉뚱하게 나뉠 수 있다. 전역 중요도(평균 |SHAP|)와 개별 예측 설명을 구분해 써야 한다.
  formula: |
    φ_i = Σ_{S⊆F\{i}} [|S|!(|F|−|S|−1)! / |F|!] · [f(S∪{i}) − f(S)]
    f(x) = φ_0 + Σ φ_i  (φ_0: 평균 예측)
  example: >-
    초기 100사이클 데이터로 수명을 예측한 대표 연구에서는 10번째와 100번째 사이클의 방전 곡선 차이 ΔQ(V)의 분산이라는 특성 하나가 수명과 매우 강한 상관을 보였다. 도메인 지식에서 나온 특성의 힘을 보여 준 예다.
  misconception: >-
    SHAP 값이 큰 특성을 바꾸면 결과도 그만큼 바뀐다고 해석하기 쉽지만, 이는 모델 안에서의 기여일 뿐 실제 물리 시스템에서 그 변수를 조작한 효과와는 다르다.
  connection: >-
    공정·조성 변수에 대한 SHAP 분석은 실험 연구자에게 '어떤 변수부터 조사할지' 가설을 주는 도구로 쓰인다. 다만 확인은 통제 실험으로 해야 한다.
  quiz:
    question: "어떤 표본의 모든 특성 SHAP 값을 더하면?"
    choices: ["항상 0", "그 표본의 예측값 − 평균 예측값", "정답 y", "특성 개수"]
    answer_index: 1
    explanation: "SHAP은 가산성을 만족해 φ_0(평균 예측)에 모든 φ_i를 더하면 그 표본의 예측값이 된다."
  keywords:
    - {ko: "특성 공학", en: "feature engineering"}
    - {ko: "섀플리 값", en: "Shapley value"}
    - {ko: "설명 가능한 AI", en: "explainable AI"}
  next_topics: ["그래디언트 부스팅(XGBoost, LightGBM)", "dQ/dV 미분 용량 분석"]
  references: ["S. M. Lundberg, S.-I. Lee, A unified approach to interpreting model predictions, NeurIPS, 2017", "K. A. Severson et al., Data-driven prediction of battery cycle life before capacity degradation, Nature Energy, 2019"]

- concept: "불균형 데이터 다루기"
  title: "불균형 데이터: 드문 사건을 놓치지 않으려면"
  level: 중급
  one_liner: >-
    한 클래스가 매우 드문 데이터에서는 모델이 다수 클래스만 맞히도록 기울기 쉬워, 표본 재조정, 손실 가중치, 임계값 조정과 알맞은 평가지표가 필요하다.
  sections:
    - heading: "무엇이 문제인가"
      body: >-
        불량 셀이 0.1%인 데이터로 학습하면 모델은 거의 항상 '정상'이라고 해도 손실이 작다. 그래서 드문 클래스의 경계를 제대로 배우지 못한다. 또 정확도가 높게 나와 문제를 숨긴다.
        드문 클래스의 표본 수 자체가 적어 그 클래스의 다양성을 충분히 보지 못하는 것도 근본 문제다.
    - heading: "데이터 쪽 해결"
      body: >-
        다수 클래스를 줄이는 언더샘플링, 소수 클래스를 늘리는 오버샘플링이 있다. SMOTE는 소수 클래스 이웃 사이를 보간해 가상 표본을 만든다. 재샘플링은 반드시 학습 묶음 안에서만 해야 하며,
        검증 데이터까지 섞으면 누수가 된다.
    - heading: "모델·평가 쪽 해결"
      body: >-
        손실에서 소수 클래스 오차에 더 큰 가중치를 주거나(class weight), 쉬운 표본의 손실을 줄이는 포컬 손실을 쓴다. 학습 후에는 확률 임계값을 0.5가 아니라 비용에 맞게 조정한다.
        평가에는 정확도 대신 재현율, 정밀도, PR-AUC를 쓴다. 정상만으로 학습하는 이상 탐지 방식도 대안이다.
  formula: |
    가중 교차 엔트로피: L = −Σ w_c · y_c · log p_c,  w_c ∝ 1 / n_c
    포컬 손실: FL = −α(1 − p_t)^γ · log p_t
  example: >-
    생산 데이터로 내부 단락 셀을 예측할 때, 정상 셀만으로 오토인코더를 학습하고 재구성 오차가 큰 셀을 이상으로 표시하면 불량 표본이 거의 없어도 탐지 모델을 만들 수 있다.
  misconception: >-
    오버샘플링으로 클래스 비율을 50:50으로 맞추면 항상 좋아진다고 생각하기 쉽지만, 예측 확률이 실제 발생 확률과 어긋나 보정(calibration)이 필요해질 수 있다.
  connection: >-
    배터리 안전 사고, 조기 수명 종료 셀, 공정 불량은 모두 드문 사건이라 불균형 데이터 기법이 배터리 품질 관리 머신러닝의 기본이다.
  quiz:
    question: "SMOTE 같은 오버샘플링을 적용할 때 지켜야 할 것은?"
    choices: ["전체 데이터에 먼저 적용", "학습 묶음 안에서만 적용", "검증 묶음에만 적용", "시험 세트에도 적용"]
    answer_index: 1
    explanation: "검증·시험 데이터까지 재샘플링하면 가상 표본 정보가 새어 성능이 부풀려진다."
  keywords:
    - {ko: "클래스 불균형", en: "class imbalance"}
    - {ko: "오버샘플링", en: "oversampling"}
    - {ko: "포컬 손실", en: "focal loss"}
  next_topics: ["분류 평가지표(정밀도, 재현율, ROC-AUC)", "오토인코더와 VAE"]
  references: ["N. V. Chawla et al., SMOTE: synthetic minority over-sampling technique, JAIR, 2002"]

- concept: "하이퍼파라미터 튜닝 전략"
  title: "하이퍼파라미터 튜닝: 격자보다 무작위, 무작위보다 똑똑하게"
  level: 중급
  one_liner: >-
    학습 전에 정하는 설정값(학습률, 나무 깊이 등)은 격자 탐색보다 무작위 탐색이 효율적이고, 베이지안 최적화나 조기 중단 기반 방법(Hyperband)은 더 적은 시도로 좋은 값을 찾는다.
  sections:
    - heading: "격자 vs 무작위"
      body: >-
        격자 탐색은 각 하이퍼파라미터의 후보값을 모두 조합해 시험한다. 조합 수가 기하급수적으로 늘고, 중요하지 않은 변수에 시도를 낭비한다. 무작위 탐색은 같은 예산에서 중요한 변수의 값을
        더 다양하게 시험하게 되어 대개 더 효율적이다. 학습률처럼 범위가 넓은 값은 로그 척도로 뽑는다.
    - heading: "똑똑한 탐색"
      body: >-
        베이지안 최적화(예: TPE, GP)는 지금까지의 결과로 좋은 영역을 추정해 다음 시도를 고른다. Hyperband·ASHA는 많은 설정을 짧게 학습시킨 뒤 성능이 나쁜 것을 일찍 버리고
        좋은 것에 자원을 몰아준다. Optuna 같은 라이브러리가 이 방법들을 함께 제공한다.
    - heading: "실무 원칙"
      body: >-
        튜닝은 반드시 검증 데이터(또는 교차검증)로 하고 최종 성능은 별도 시험 세트로 보고한다. 데이터가 적을 때 너무 많이 튜닝하면 검증 세트에 과적합한다. 먼저 영향이 큰 하이퍼파라미터
        (학습률, 정규화 강도, 모델 크기)부터 조정하고, 기본값이 좋은 모델로 기준선을 잡는 것이 좋다.
  formula: |
    목표: λ* = argmin_λ L_val(f_λ)
    로그 균등 샘플링: log10(η) ~ U(−5, −1)
  example: >-
    수명 예측용 그래디언트 부스팅을 튜닝할 때 학습률(0.01~0.3, 로그), 깊이(3~10), 표본 추출 비율(0.5~1)을 무작위로 50번 시도하면, 같은 수의 격자 탐색보다 좋은 결과를 얻는 경우가 많다.
  misconception: >-
    튜닝에 쓴 검증 점수를 그대로 최종 성능으로 보고하는 실수가 흔하다. 여러 번 골라낸 최고 점수는 낙관적으로 편향되어 있다.
  connection: >-
    실험 조건 최적화와 하이퍼파라미터 튜닝은 같은 문제 구조(비싼 블랙박스 함수)여서, 배터리 연구자가 쓰는 베이지안 최적화 도구를 그대로 모델 튜닝에도 쓸 수 있다.
  quiz:
    question: "무작위 탐색이 격자 탐색보다 효율적인 경우가 많은 이유는?"
    choices: ["항상 전역 최적을 찾아서", "중요한 변수의 값을 더 다양하게 시험해서", "계산이 필요 없어서", "검증 세트가 필요 없어서"]
    answer_index: 1
    explanation: "격자는 중요하지 않은 변수 조합에 시도를 낭비하지만, 무작위는 각 시도마다 중요한 변수도 새 값을 시험한다."
  keywords:
    - {ko: "하이퍼파라미터", en: "hyperparameter"}
    - {ko: "무작위 탐색", en: "random search"}
    - {ko: "하이퍼밴드", en: "Hyperband"}
  next_topics: ["베이지안 최적화", "교차검증과 데이터 누수"]
  references: ["J. Bergstra, Y. Bengio, Random search for hyper-parameter optimization, JMLR, 2012"]

- concept: "능동 학습(active learning)"
  title: "능동 학습: 모델이 다음에 무엇을 측정할지 고른다"
  level: 중급
  one_liner: >-
    능동 학습은 레이블(측정·계산 결과)을 얻는 비용이 클 때, 모델이 가장 배울 것이 많은 표본을 골라 측정을 요청해 적은 데이터로 좋은 모델을 만드는 방법이다.
  sections:
    - heading: "기본 고리"
      body: >-
        (1) 적은 레이블 데이터로 모델을 학습한다. (2) 아직 측정하지 않은 후보들에 대해 '정보가 많은 정도'를 계산한다. (3) 점수가 높은 표본을 실험·계산해 레이블을 얻는다. (4) 데이터에 추가하고 다시 학습한다.
        베이지안 최적화와 비슷하지만, 목표가 최적값 찾기가 아니라 모델 전체의 정확도 높이기다.
    - heading: "무엇을 고르나"
      body: >-
        가장 흔한 기준은 불확실성이다. 예측 분산이 큰 표본(GP, 앙상블 간 불일치)을 고른다. 여러 모델이 의견이 갈리는 표본을 고르는 위원회 질의, 모델 변화가 가장 클 표본을 고르는 기준도 있다.
        불확실한 표본만 고르면 비슷한 표본이 몰릴 수 있어 다양성도 함께 고려한다.
    - heading: "주의할 점"
      body: >-
        모델이 고른 데이터는 원래 분포와 달라 편향된 데이터셋이 된다. 그래서 성능 평가는 무작위로 뽑은 별도 시험 세트로 해야 한다. 초기 모델이 너무 나쁘면 엉뚱한 표본만 고르는
        '차가운 시작' 문제가 있다.
  formula: |
    불확실성 샘플링: x* = argmax_{x∈U} σ(x)
    위원회 질의: x* = argmax Var_m[f_m(x)]
  example: >-
    기계학습 원자간 퍼텐셜을 만들 때, 분자동역학 중 여러 모델의 힘 예측이 크게 갈리는 원자 구조만 골라 DFT 계산을 추가하면 훨씬 적은 계산으로 정확한 퍼텐셜을 얻을 수 있다.
  misconception: >-
    능동 학습이 항상 무작위 샘플링보다 낫다고 생각하기 쉽지만, 모델이 부정확한 초기 단계나 데이터 분포가 단순한 경우에는 큰 차이가 없거나 오히려 나쁠 수 있다.
  connection: >-
    전해질 조성 탐색, 고체 전해질 후보 계산, 분자동역학 퍼텐셜 학습 등 '측정 하나가 비싼' 배터리 연구 전반에서 능동 학습이 실험·계산 횟수를 줄이는 데 쓰인다.
  quiz:
    question: "능동 학습이 베이지안 최적화와 다른 주된 목표는?"
    choices: ["최적값 하나를 찾는 것", "모델 전체의 예측 정확도를 높이는 것", "데이터를 지우는 것", "하이퍼파라미터를 없애는 것"]
    answer_index: 1
    explanation: "베이지안 최적화는 최적점 찾기가, 능동 학습은 적은 레이블로 정확한 모델 만들기가 목표다."
  keywords:
    - {ko: "능동 학습", en: "active learning"}
    - {ko: "불확실성 샘플링", en: "uncertainty sampling"}
    - {ko: "위원회 질의", en: "query by committee"}
  next_topics: ["가우시안 프로세스 회귀", "베이지안 최적화"]
  references: ["B. Settles, Active Learning Literature Survey, University of Wisconsin–Madison Technical Report, 2009"]
