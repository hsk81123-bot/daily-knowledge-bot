# AI › 온톨로지 공부 노트

- concept: "온톨로지란 무엇인가(개념화의 명세)"
  title: "온톨로지: 한 분야의 개념과 관계를 컴퓨터가 읽게 정리한 것"
  level: 입문
  one_liner: >-
    정보과학에서 온톨로지는 한 분야에 어떤 종류의 것들이 있고 그것들이 어떻게 관계되는지를 명시적이고 형식적으로 정의한 공유 개념 모델이다.
  sections:
    - heading: "정의"
      body: >-
        Gruber는 온톨로지를 '개념화의 명시적 명세(explicit specification of a conceptualization)'라고 했고, 이후 '공유된' 개념화의 '형식적' 명세로 다듬어졌다.
        즉 사람들이 합의한 개념(클래스), 그 사이의 관계(속성), 지켜야 할 규칙(공리)을 컴퓨터가 처리할 수 있는 언어로 적은 것이다. 철학의 존재론(ontology)에서 이름을 빌려 왔다.
    - heading: "무엇이 들어가나"
      body: >-
        클래스(예: 전극, 양극, 전해질), 클래스 사이 계층(양극은 전극의 하위 클래스), 속성(전극은 활물질을 가진다), 제약(모든 셀은 정확히 하나의 양극을 가진다), 그리고 실제 개체(셀 A의 양극)가 들어간다.
        단순한 용어집이나 분류표보다 관계와 규칙이 풍부하고, 논리적으로 추론할 수 있다는 점이 다르다.
    - heading: "왜 쓰나"
      body: >-
        같은 것을 연구실마다 다른 이름으로 부르면 데이터를 합치기 어렵다. 온톨로지는 용어의 뜻을 고정해 서로 다른 데이터베이스와 소프트웨어가 같은 의미로 데이터를 주고받게 한다(상호 운용성). 또 명시된 규칙으로
        새로운 사실을 추론하고 모순을 찾을 수 있다. FAIR 데이터 원칙(찾을 수 있고, 접근 가능하고, 상호 운용되고, 재사용 가능한)을 실현하는 핵심 수단이다.
  formula: |
    온톨로지 ≈ 클래스 + 속성(관계) + 공리(규칙) + (개체)
    예) 양극 ⊑ 전극,  셀 ⊑ ∃hasPart.양극
  example: >-
    한 연구실은 '용량 유지율', 다른 곳은 'capacity retention', 또 다른 곳은 'SOH'라고 기록한 열을 같은 온톨로지 개념에 연결해 두면, 세 데이터를 자동으로 합쳐 비교할 수 있다.
  misconception: >-
    온톨로지가 단순히 용어 목록이나 폴더 분류 체계라고 생각하기 쉽지만, 핵심은 관계와 논리 규칙을 명시해 컴퓨터가 추론할 수 있게 한다는 데 있다.
  connection: >-
    배터리 데이터는 소재·공정·셀·시험 조건이 얽혀 있어, 온톨로지로 의미를 맞춰 두어야 여러 출처의 데이터를 모아 머신러닝 학습 데이터로 쓸 수 있다.
  quiz:
    question: "온톨로지가 단순한 용어집과 다른 핵심은?"
    choices: ["단어 수가 많다", "개념 사이 관계와 논리 규칙을 형식적으로 정의한다", "그림이 들어간다", "영어로만 쓴다"]
    answer_index: 1
    explanation: "온톨로지는 관계와 공리를 형식 언어로 명시해 컴퓨터가 추론·검증할 수 있게 한다."
  keywords:
    - {ko: "온톨로지", en: "ontology"}
    - {ko: "개념화", en: "conceptualization"}
    - {ko: "상호 운용성", en: "interoperability"}
  next_topics: ["RDF 트리플과 URI", "클래스·속성·개체(TBox와 ABox)", "배터리 도메인 온톨로지(EMMO, BattINFO)"]
  references: ["T. R. Gruber, A translation approach to portable ontology specifications, Knowledge Acquisition, 1993", "M. D. Wilkinson et al., The FAIR Guiding Principles for scientific data management and stewardship, Scientific Data, 2016"]

- concept: "RDF 트리플과 URI"
  title: "RDF 트리플: 모든 사실을 '주어-술어-목적어'로"
  level: 입문
  one_liner: >-
    RDF는 모든 정보를 주어-술어-목적어 세 쌍(트리플)으로 표현하는 데이터 모델이며, 각 요소를 전 세계에서 유일한 URI로 이름 붙여 서로 다른 출처의 데이터를 그대로 이어 붙일 수 있게 한다.
  sections:
    - heading: "트리플"
      body: >-
        '셀A는 양극으로 NCM811을 가진다'는 (셀A, hasCathode, NCM811)이라는 트리플이다. 트리플이 모이면 주어와 목적어는 점, 술어는 화살표인 방향 그래프가 된다. 표처럼 열을 미리 정하지 않아도
        새 종류의 정보를 트리플로 계속 추가할 수 있어 유연하다.
    - heading: "URI와 리터럴"
      body: >-
        주어와 술어는 URI(IRI)로 쓴다. 예를 들어 http://example.org/cell/A 같은 주소다. 같은 URI는 어디서 쓰든 같은 것을 가리키므로, 두 데이터셋이 같은 URI를 쓰면 자동으로 연결된다.
        목적어는 URI이거나 숫자·문자열 같은 리터럴일 수 있고, 리터럴에는 자료형(xsd:double 등)과 언어 태그를 붙일 수 있다.
    - heading: "직렬화 형식"
      body: >-
        RDF는 데이터 모델이고, 파일로 쓰는 방법은 여러 가지다. 사람이 읽기 쉬운 Turtle, 웹 개발에 친숙한 JSON-LD, 오래된 RDF/XML 등이 있다. 긴 URI는 접두사(prefix)로 줄여 쓴다.
        단위가 있는 값은 QUDT 같은 단위 온톨로지로 숫자와 단위를 함께 표현하는 것이 좋다.
  formula: |
    @prefix ex: <http://example.org/> .
    ex:cellA  ex:hasCathode  ex:NCM811 .
    ex:cellA  ex:nominalCapacity  "3.0"^^xsd:double .
  example: >-
    시험 장비가 내보낸 결과를 JSON-LD로 저장하면, 일반 JSON처럼 읽히면서도 각 키가 온톨로지 URI에 연결되어 다른 연구실 데이터와 의미가 맞춰진다.
  misconception: >-
    URI가 웹 주소처럼 보이니 반드시 접속 가능한 페이지가 있어야 한다고 생각하기 쉽지만, URI는 이름(식별자)이 본질이다. 다만 접속하면 설명이 나오게 하는 것이 링크드 데이터의 좋은 관행이다.
  connection: >-
    셀 제조 이력, 시험 조건, 측정 결과를 트리플로 쌓아 두면 'NCM811 양극을 쓰고 45 °C에서 시험한 셀의 수명'처럼 여러 표를 가로지르는 질문에 바로 답할 수 있다.
  quiz:
    question: "RDF 트리플의 세 구성 요소는?"
    choices: ["행-열-값", "주어-술어-목적어", "키-값-타입", "노드-층-가중치"]
    answer_index: 1
    explanation: "RDF는 모든 사실을 주어(subject)-술어(predicate)-목적어(object)의 트리플로 표현한다."
  keywords:
    - {ko: "자원 기술 프레임워크", en: "Resource Description Framework"}
    - {ko: "트리플", en: "triple"}
    - {ko: "국제화 자원 식별자", en: "IRI"}
  next_topics: ["RDFS와 OWL", "SPARQL 질의", "지식 그래프"]
  references: ["W3C, RDF 1.1 Concepts and Abstract Syntax, W3C Recommendation, 2014"]

- concept: "RDFS와 OWL"
  title: "RDFS와 OWL: 트리플에 의미 규칙을 더하는 언어"
  level: 중급
  one_liner: >-
    RDFS는 클래스·하위 클래스·속성의 정의역과 치역 같은 기본 어휘를 주고, OWL은 여기에 동치, 서로소, 개수 제약, 속성 특성 같은 풍부한 논리 표현을 더해 추론할 수 있는 온톨로지를 만든다.
  sections:
    - heading: "RDFS"
      body: >-
        RDF 스키마(RDFS)는 rdfs:Class, rdfs:subClassOf, rdfs:subPropertyOf, rdfs:domain, rdfs:range 같은 어휘를 제공한다. '양극은 전극의 하위 클래스'와 'hasCathode의 치역은 양극'을 선언하면,
        (셀A hasCathode X)에서 X가 양극이고 따라서 전극이라는 것을 추론할 수 있다. 표현력은 작지만 단순하고 가볍다.
    - heading: "OWL"
      body: >-
        웹 온톨로지 언어(OWL 2)는 클래스 동치(equivalentClass), 서로소(disjointWith), 합집합·교집합·여집합, '적어도 하나의 양극을 가진다' 같은 존재 제약, 개수 제약(정확히 1개),
        속성의 역관계·추이성·함수성 등을 표현한다. 이 표현은 기술 논리에 바탕을 두어 추론기가 자동으로 분류하고 모순을 찾을 수 있다.
    - heading: "열린 세계 가정"
      body: >-
        OWL은 '말하지 않은 것은 모른다'는 열린 세계 가정을 따른다. 셀에 양극이 기록되지 않았다고 '양극이 없다'고 결론 내리지 않는다. 이 때문에 데이터 검증(필수 값 누락 찾기)에는 맞지 않아 SHACL을 함께 쓴다.
        또 OWL은 이름이 다르면 다른 개체라고 가정하지 않는다(고유 이름 가정 없음).
  formula: |
    :Cathode rdfs:subClassOf :Electrode .
    :hasCathode rdfs:range :Cathode .
    :Cell rdfs:subClassOf [ a owl:Restriction ;
        owl:onProperty :hasCathode ; owl:cardinality 1 ] .
  example: >-
    :Anode와 :Cathode를 owl:disjointWith로 선언해 두면, 데이터 실수로 어떤 전극이 양극이자 음극으로 기록되었을 때 추론기가 모순을 알려 준다.
  misconception: >-
    rdfs:range를 '이 속성에는 이 클래스 값만 넣어야 한다'는 검증 규칙으로 생각하기 쉽지만, 실제 의미는 '이 속성의 값은 그 클래스로 추론된다'이다. 잘못된 값을 넣으면 오류 대신 엉뚱한 추론이 생긴다.
  connection: >-
    배터리 온톨로지(EMMO 기반)는 OWL로 작성되어 있어, 전극·전해질·시험 방법 같은 개념의 계층과 관계를 추론기로 확인하며 확장할 수 있다.
  quiz:
    question: "OWL이 따르는 '기록되지 않은 사실은 거짓이 아니라 알 수 없다'는 가정은?"
    choices: ["닫힌 세계 가정", "열린 세계 가정", "고유 이름 가정", "독립 가정"]
    answer_index: 1
    explanation: "OWL은 열린 세계 가정을 따라, 기록이 없다는 것만으로 부정하지 않는다."
  keywords:
    - {ko: "RDF 스키마", en: "RDF Schema"}
    - {ko: "웹 온톨로지 언어", en: "Web Ontology Language"}
    - {ko: "열린 세계 가정", en: "open-world assumption"}
  next_topics: ["기술 논리(description logic)", "SHACL로 데이터 검증하기", "추론기(reasoner)와 일관성 검사"]
  references: ["W3C, OWL 2 Web Ontology Language Document Overview (Second Edition), W3C Recommendation, 2012"]

- concept: "클래스·속성·개체(TBox와 ABox)"
  title: "TBox와 ABox: 개념의 규칙과 실제 데이터를 나눈다"
  level: 입문
  one_liner: >-
    온톨로지 지식은 개념과 그 관계의 일반 규칙(TBox)과, 특정 개체에 대한 사실(ABox)로 나뉘며, 이 구분이 설계와 재사용의 기본 틀이 된다.
  sections:
    - heading: "클래스·속성·개체"
      body: >-
        클래스는 같은 성질을 가진 것들의 집합(예: 양극)이다. 개체(인스턴스)는 그 집합의 구체적인 원소(예: 셀 A의 양극)다. 속성은 둘 사이의 관계다. 개체와 개체를 잇는 객체 속성(hasCathode)과
        개체와 값(숫자, 문자열)을 잇는 데이터 속성(hasThickness)으로 나뉜다.
    - heading: "TBox"
      body: >-
        용어 상자(Terminological Box)는 '양극은 전극이다', '셀은 정확히 하나의 양극을 가진다'처럼 개념 수준의 규칙을 담는다. 분야 전문가들이 합의해 천천히 바뀌며, 여러 프로젝트가 공유해 재사용한다.
    - heading: "ABox"
      body: >-
        단언 상자(Assertional Box)는 '셀A는 양극P1을 가진다', '양극P1의 두께는 60 μm다'처럼 특정 개체에 대한 사실이다. 실험마다 계속 늘어나는 실제 데이터다. TBox와 ABox를 분리하면
        같은 온톨로지로 여러 연구실의 데이터를 담을 수 있고, 추론기는 TBox 규칙을 ABox에 적용해 새 사실을 끌어낸다.
  formula: |
    TBox: Cathode ⊑ Electrode,  Cell ⊑ (=1 hasCathode.Cathode)
    ABox: Cell(cellA),  hasCathode(cellA, p1),  hasThickness(p1, 60)
  example: >-
    온톨로지 파일(TBox)은 공용 저장소에서 버전 관리하고, 각 연구실의 시험 데이터(ABox)는 그 TBox를 불러와 자기 데이터베이스에 쌓는 방식이 흔하다.
  misconception: >-
    무엇을 클래스로, 무엇을 개체로 둘지가 항상 분명하다고 생각하기 쉽지만, 'NCM811'은 소재 종류(클래스)로도, 특정 제품 로트(개체)로도 볼 수 있다. 용도에 따라 정해야 한다.
  connection: >-
    배터리 데이터 관리에서는 BattINFO 같은 공용 TBox를 쓰고, 셀·측정 데이터는 ABox로 만들어 지식 그래프에 쌓는 구조가 권장된다.
  quiz:
    question: "'셀A의 공칭 용량은 3.0 Ah다'는 어디에 속하나?"
    choices: ["TBox", "ABox", "토크나이저", "SHACL 형태"]
    answer_index: 1
    explanation: "특정 개체(셀A)에 대한 구체적 사실이므로 단언 상자(ABox)에 속한다."
  keywords:
    - {ko: "용어 상자", en: "TBox"}
    - {ko: "단언 상자", en: "ABox"}
    - {ko: "객체 속성", en: "object property"}
  next_topics: ["기술 논리(description logic)", "RDFS와 OWL"]
  references: ["F. Baader et al., The Description Logic Handbook, 2nd ed., Cambridge University Press, 2007"]

- concept: "SPARQL 질의"
  title: "SPARQL: 그래프 모양을 그려서 묻는 질의 언어"
  level: 중급
  one_liner: >-
    SPARQL은 RDF 그래프에 대한 표준 질의 언어로, 변수가 들어간 트리플 패턴을 적으면 그 모양과 일치하는 부분 그래프를 모두 찾아 돌려준다.
  sections:
    - heading: "기본 형태"
      body: >-
        SELECT 절에 원하는 변수를, WHERE 절에 트리플 패턴을 쓴다. 예를 들어 '?cell ex:hasCathode ?cathode . ?cathode a ex:NCM811 .'은 NCM811 양극을 가진 모든 셀을 찾는다.
        여러 패턴은 공통 변수로 연결되어 그래프 위의 경로를 표현한다.
    - heading: "자주 쓰는 기능"
      body: >-
        FILTER로 조건(온도 > 40)을 걸고, OPTIONAL로 없을 수도 있는 정보를 함께 가져오며, GROUP BY와 집계 함수(AVG, COUNT)로 요약한다. 속성 경로(ex:partOf+)로 여러 단계 관계를 한 번에 따라가고,
        SERVICE로 다른 엔드포인트의 데이터를 함께 묻는 연합 질의도 할 수 있다.
    - heading: "SQL과의 차이"
      body: >-
        SQL은 미리 정한 표 구조를 조인하지만, SPARQL은 스키마가 유연한 그래프에서 관계를 따라간다. 새로운 종류의 관계를 추가해도 기존 질의가 깨지지 않는다. 추론을 켠 저장소에서는
        하위 클래스 관계까지 반영된 결과가 나온다. 대신 대용량에서 성능 튜닝이 SQL보다 까다로울 수 있다.
  formula: |
    SELECT ?cell (AVG(?life) AS ?avgLife) WHERE {
      ?cell ex:hasCathode/a ex:NCM811 ;
            ex:testTemperature ?T ; ex:cycleLife ?life .
      FILTER(?T >= 45)
    } GROUP BY ?cell
  example: >-
    위키데이터 SPARQL 엔드포인트에서 '리튬을 포함하는 화합물 중 녹는점이 기록된 것'을 묻는 질의를 써 보면 SPARQL 문법을 빠르게 익힐 수 있다.
  misconception: >-
    SPARQL을 쓰면 데이터가 자동으로 정리된다고 생각하기 쉽지만, 같은 의미를 다른 URI로 기록한 데이터는 찾지 못한다. 온톨로지와 URI 관리가 먼저다.
  connection: >-
    셀 제조·시험 지식 그래프에 SPARQL을 쓰면 '특정 첨가제를 쓴 셀들의 45 °C 수명 분포' 같은 질문으로 머신러닝 학습 데이터를 바로 뽑을 수 있다. LLM이 자연어를 SPARQL로 바꾸는 연구도 활발하다.
  quiz:
    question: "SPARQL에서 없을 수도 있는 정보를 함께 가져올 때 쓰는 키워드는?"
    choices: ["FILTER", "OPTIONAL", "DELETE", "LIMIT"]
    answer_index: 1
    explanation: "OPTIONAL 패턴은 일치하면 값을 붙이고, 없어도 결과 행을 버리지 않는다(SQL의 LEFT JOIN과 비슷)."
  keywords:
    - {ko: "SPARQL", en: "SPARQL"}
    - {ko: "트리플 패턴", en: "triple pattern"}
    - {ko: "속성 경로", en: "property path"}
  next_topics: ["지식 그래프", "LLM과 지식 그래프의 결합(GraphRAG)"]
  references: ["W3C, SPARQL 1.1 Query Language, W3C Recommendation, 2013"]

- concept: "기술 논리(description logic)"
  title: "기술 논리: OWL 뒤에 있는 수학"
  level: 심화
  one_liner: >-
    기술 논리는 개념(클래스)과 역할(관계)을 구성자로 조합해 표현하는 1차 논리의 결정 가능한 부분 집합으로, OWL의 의미와 추론이 이 위에서 정의된다.
  sections:
    - heading: "기본 구성자"
      body: >-
        개념 이름(전극), 역할 이름(hasPart)에 교집합(⊓), 합집합(⊔), 부정(¬), 존재 제약(∃hasPart.양극: 적어도 하나의 양극을 부분으로 가진 것), 전칭 제약(∀hasPart.전극부품: 부분이 모두 전극부품인 것)을 조합한다.
        기본 언어 ALC에 역역할, 개수 제약 등을 더한 것이 OWL 2 DL의 바탕인 SROIQ다.
    - heading: "의미와 추론 문제"
      body: >-
        각 개념은 해석 영역의 부분 집합으로, 역할은 원소 쌍의 집합으로 해석된다. 주요 추론 문제는 (1) 포함 관계 판정(A ⊑ B인가), (2) 만족 가능성(어떤 개념이 원소를 가질 수 있나),
        (3) 일관성(지식베이스에 모순이 없나), (4) 개체 판정(이 개체가 그 개념에 속하나)이다. 이 문제들이 항상 끝나는(결정 가능한) 알고리즘으로 풀린다는 것이 장점이다.
    - heading: "표현력과 계산의 균형"
      body: >-
        표현력을 늘리면 추론의 계산 복잡도가 급격히 커진다. 그래서 OWL 2에는 대규모 개념 계층에 맞는 EL, 데이터베이스 질의에 맞는 QL, 규칙 엔진에 맞는 RL 같은 가벼운 프로파일이 있다.
        의료 온톨로지처럼 개념이 수십만 개인 경우 EL 프로파일로 빠르게 분류한다.
  formula: |
    Cell ⊑ ∃hasPart.Cathode ⊓ ∃hasPart.Anode
    FullCell ≡ Cell ⊓ ¬HalfCell
    해석: (∃r.C)^I = { x | ∃y. (x, y) ∈ r^I ∧ y ∈ C^I }
  example: >-
    'HalfCell ≡ Cell ⊓ ∃hasCounterElectrode.LithiumMetal'로 정의해 두면, 리튬 금속 상대 전극이 기록된 셀은 추론기가 자동으로 반쪽 셀로 분류한다.
  misconception: >-
    기술 논리가 일반 1차 논리만큼 무엇이든 표현할 수 있다고 생각하기 쉽지만, 결정 가능성을 지키기 위해 변수 사용 방식 등을 제한한 부분 집합이다. 일부 규칙은 표현할 수 없어 규칙 언어를 함께 쓴다.
  connection: >-
    기술 논리의 정의를 잘 쓰면 '어떤 측정이 어떤 시험 유형인가'를 사람이 일일이 태그하지 않아도 추론으로 분류할 수 있어, 대량의 배터리 시험 데이터 정리에 도움이 된다.
  quiz:
    question: "기술 논리에서 ∃hasPart.Cathode가 뜻하는 것은?"
    choices: ["모든 부분이 양극인 것", "적어도 하나의 양극을 부분으로 가진 것", "양극이 아닌 것", "양극의 개수가 0인 것"]
    answer_index: 1
    explanation: "존재 제약 ∃r.C는 r 관계로 C에 속하는 대상이 적어도 하나 있는 개체들의 집합이다."
  keywords:
    - {ko: "기술 논리", en: "description logic"}
    - {ko: "존재 제약", en: "existential restriction"}
    - {ko: "결정 가능성", en: "decidability"}
  next_topics: ["추론기(reasoner)와 일관성 검사", "RDFS와 OWL"]
  references: ["F. Baader, I. Horrocks, C. Lutz, U. Sattler, An Introduction to Description Logic, Cambridge University Press, 2017"]

- concept: "추론기(reasoner)와 일관성 검사"
  title: "추론기: 적어 둔 규칙에서 숨은 사실과 모순을 찾아낸다"
  level: 중급
  one_liner: >-
    추론기는 온톨로지의 공리를 바탕으로 클래스 계층을 자동으로 정리하고, 개체가 어떤 클래스에 속하는지 추론하며, 지식베이스에 논리적 모순이 있는지 검사하는 프로그램이다.
  sections:
    - heading: "하는 일"
      body: >-
        (1) 분류: 정의된 클래스들 사이의 하위 클래스 관계를 모두 계산해 계층을 만든다. (2) 실현: 각 개체가 속하는 가장 구체적인 클래스를 찾는다. (3) 일관성 검사: 모순이 있는지 확인한다.
        (4) 만족 불가능한 클래스 찾기: 정의상 원소를 가질 수 없는 클래스를 찾는다. 대부분 설계 실수의 신호다.
    - heading: "대표 추론기"
      body: >-
        HermiT, Pellet, FaCT++는 OWL 2 DL 전체를 다루는 타블로(tableau) 기반 추론기다. ELK는 EL 프로파일 전용으로 매우 빠르다. Protégé 같은 편집기에 플러그인으로 들어 있어,
        온톨로지를 고칠 때마다 추론기를 돌려 결과를 확인하는 것이 일반적인 작업 방식이다.
    - heading: "모순 디버깅"
      body: >-
        모순이 발견되면 추론기는 그 원인이 된 최소한의 공리 집합(설명, justification)을 보여 줄 수 있다. 흔한 원인은 서로소로 선언한 두 클래스에 같은 개체를 넣은 경우, 정의역·치역 선언 때문에 의도치 않은 클래스가 추론된 경우다.
        큰 온톨로지에서는 추론이 느려질 수 있어 프로파일 선택이 중요하다.
  formula: |
    일관성: KB에 모델(해석)이 하나라도 존재하는가?
    분류: 모든 이름 클래스 쌍 (A, B)에 대해 KB ⊨ A ⊑ B 판정
  example: >-
    시험 데이터 ABox를 온톨로지와 함께 추론기에 넣었더니 '셀 X가 반쪽 셀이면서 풀셀'이라는 모순이 나왔다면, 대개 데이터 입력 실수(상대 전극 기록 오류)를 찾은 것이다.
  misconception: >-
    추론기가 '필수 값이 빠졌다'는 오류도 찾아 줄 것이라 기대하기 쉽지만, OWL은 열린 세계 가정이라 누락은 모순이 아니다. 누락 검사는 SHACL로 한다.
  connection: >-
    머신러닝용 데이터셋을 만들기 전에 추론기와 SHACL로 데이터 모순과 누락을 걸러 내면, 잘못 표기된 시험 조건 때문에 생기는 학습 오류를 줄일 수 있다.
  quiz:
    question: "추론기가 '원소를 하나도 가질 수 없는 클래스'를 찾았다면 보통 의미하는 것은?"
    choices: ["정상적인 설계", "온톨로지 설계상의 실수 가능성", "데이터가 많다", "추론기가 고장 났다"]
    answer_index: 1
    explanation: "만족 불가능한 클래스는 서로 충돌하는 제약이 걸려 있다는 뜻으로, 대개 모델링 실수의 신호다."
  keywords:
    - {ko: "추론기", en: "semantic reasoner"}
    - {ko: "일관성 검사", en: "consistency checking"}
    - {ko: "만족 불가능 클래스", en: "unsatisfiable class"}
  next_topics: ["SHACL로 데이터 검증하기", "기술 논리(description logic)"]
  references: ["B. Glimm, I. Horrocks, B. Motik, G. Stoilos, Z. Wang, HermiT: an OWL 2 reasoner, J. Automated Reasoning, 2014"]

- concept: "지식 그래프"
  title: "지식 그래프: 사실들을 점과 선으로 이은 거대한 연결망"
  level: 입문
  one_liner: >-
    지식 그래프는 개체를 노드, 관계를 간선으로 하는 그래프에 사실을 쌓은 것으로, 온톨로지가 정한 의미 틀(스키마) 위에 실제 데이터를 연결해 검색·추론·분석에 쓴다.
  sections:
    - heading: "무엇인가"
      body: >-
        '셀A —hasCathode→ 양극P1 —madeOf→ NCM811'처럼 개체와 관계를 이어 놓은 그래프다. 검색 엔진의 지식 패널, 위키데이터, 생물의학 지식 그래프가 대표 예다. 온톨로지가 '어떤 종류의 노드와 관계가 있을 수 있는가'를 정한다면,
        지식 그래프는 그 틀에 실제 사실을 대량으로 채운 것이라고 볼 수 있다.
    - heading: "두 가지 기술 계열"
      body: >-
        RDF 트리플 저장소와 SPARQL을 쓰는 시맨틱 웹 계열과, 노드와 간선에 속성을 붙이는 속성 그래프(Neo4j, Cypher 질의 등) 계열이 있다. 전자는 표준화와 추론, 데이터 공유에 강하고,
        후자는 개발자 친화성과 그래프 탐색 성능에 강하다. 목적에 따라 고르거나 섞어 쓴다.
    - heading: "만들고 쓰기"
      body: >-
        데이터베이스, 표, 문헌에서 개체와 관계를 뽑아(정보 추출) 같은 것을 하나로 합치고(개체 정렬), 온톨로지에 맞춰 넣는다. 완성된 그래프는 다단계 관계 질의, 추천, 누락된 관계 예측(링크 예측), LLM 답변의 근거 자료로 쓰인다.
        품질 관리(중복, 오류, 출처 기록)가 가장 큰 과제다.
  formula: |
    G = (V, E),  E ⊆ V × R × V
    사실 하나 = (head, relation, tail)
  example: >-
    배터리 논문 수천 편에서 '소재-성질-값-조건' 관계를 추출해 지식 그래프로 만들면, 특정 전해질 첨가제가 어떤 양극에서 어떤 효과를 보였는지 문헌 전체를 가로질러 찾아볼 수 있다.
  misconception: >-
    지식 그래프에 들어간 사실은 모두 참이라고 믿기 쉽지만, 자동 추출로 만든 그래프에는 오류가 섞인다. 각 사실의 출처와 신뢰도를 함께 기록하는 것이 중요하다.
  connection: >-
    소재·공정·시험 데이터를 지식 그래프로 연결하면 GNN이나 지식 그래프 임베딩으로 '아직 시험하지 않은 조합의 결과'를 예측하는 머신러닝 문제로 바꿀 수 있다.
  quiz:
    question: "온톨로지와 지식 그래프의 관계로 가장 알맞은 것은?"
    choices: ["둘은 완전히 무관하다", "온톨로지가 의미 틀을, 지식 그래프가 그 틀에 채운 실제 사실을 담는다", "지식 그래프는 항상 표 형식이다", "온톨로지는 이미지 데이터다"]
    answer_index: 1
    explanation: "온톨로지는 개념과 관계의 스키마를, 지식 그래프는 그 스키마를 따르는 대량의 개체·관계 데이터를 담는다."
  keywords:
    - {ko: "지식 그래프", en: "knowledge graph"}
    - {ko: "속성 그래프", en: "property graph"}
    - {ko: "링크 예측", en: "link prediction"}
  next_topics: ["지식 그래프 임베딩(TransE 등)", "LLM과 지식 그래프의 결합(GraphRAG)", "SPARQL 질의"]
  references: ["A. Hogan et al., Knowledge graphs, ACM Computing Surveys, 2021"]

- concept: "상위 온톨로지(BFO 등)"
  title: "상위 온톨로지: 모든 분야가 공유하는 가장 일반적인 범주"
  level: 심화
  one_liner: >-
    상위 온톨로지는 물체, 과정, 성질, 역할처럼 분야와 관계없이 쓰이는 가장 일반적인 범주와 관계를 정의해, 서로 다른 분야 온톨로지가 같은 바탕 위에서 연결되게 한다.
  sections:
    - heading: "왜 필요한가"
      body: >-
        분야별 온톨로지를 따로 만들면 '시료', '측정', '온도' 같은 기본 개념을 제각각 정의해 나중에 연결하기 어렵다. 상위 온톨로지는 맨 위에 공통 범주를 두고, 각 분야 개념이 그 아래 어디에 속하는지 정하게 해
        일관성과 연결성을 확보한다.
    - heading: "BFO"
      body: >-
        기본 형식 온톨로지(BFO)는 생물의학 분야에서 널리 쓰이며 ISO 표준(ISO/IEC 21838-2)으로도 채택되었다. 시간 속에서 지속하는 것(continuant: 물체, 성질, 역할)과 시간에 따라 펼쳐지는 것
        (occurrent: 과정, 사건)을 크게 나눈다. 예를 들어 배터리 셀은 지속체, 충전은 과정, 셀의 용량은 셀에 의존하는 성질로 분류된다.
    - heading: "다른 상위 온톨로지"
      body: >-
        DOLCE는 인지·언어적 범주를 중시하고, EMMO는 물리학과 재료과학을 위해 설계되어 측정과 표현을 중심에 둔다. 상위 온톨로지마다 철학적 관점이 달라 서로 정렬하기 쉽지 않다.
        상위 온톨로지를 쓰면 일관성은 좋아지지만 처음 배우는 데 시간이 든다.
  formula: |
    BFO 최상위: Entity → { Continuant, Occurrent }
    Continuant → Independent(물체), Specifically dependent(성질·역할) ...
    Occurrent → Process, Temporal region ...
  example: >-
    '셀(물체)이 사이클 시험(과정)에 참여하고, 그 결과 용량(성질)의 측정값(정보)이 생긴다'처럼 상위 범주에 맞춰 모델링하면 다른 분야 실험 데이터와도 같은 구조로 연결된다.
  misconception: >-
    상위 온톨로지는 철학적 논쟁일 뿐 실무와 무관하다고 생각하기 쉽지만, 여러 분야 데이터를 통합할 때 '측정값과 측정 대상의 성질을 구분하는가' 같은 선택이 실제 데이터 구조를 바꾼다.
  connection: >-
    배터리 분야 온톨로지 BattINFO는 상위 온톨로지 EMMO 위에 만들어져, 재료·전기화학·측정 개념이 같은 틀에서 정의된다.
  quiz:
    question: "BFO에서 '충전 과정'은 어느 최상위 범주에 속하나?"
    choices: ["Continuant(지속체)", "Occurrent(시간 속에 펼쳐지는 것)", "정보 개체", "속성 그래프"]
    answer_index: 1
    explanation: "충전처럼 시간에 따라 진행되는 과정은 occurrent에 속하고, 셀 같은 물체는 continuant에 속한다."
  keywords:
    - {ko: "상위 온톨로지", en: "upper ontology"}
    - {ko: "기본 형식 온톨로지", en: "Basic Formal Ontology"}
    - {ko: "지속체·발생체", en: "continuant/occurrent"}
  next_topics: ["배터리 도메인 온톨로지(EMMO, BattINFO)", "온톨로지 정렬(alignment)"]
  references: ["R. Arp, B. Smith, A. D. Spear, Building Ontologies with Basic Formal Ontology, MIT Press, 2015"]

- concept: "SKOS와 용어 체계"
  title: "SKOS: 엄격한 논리 없이 용어 체계를 웹에 올리기"
  level: 입문
  one_liner: >-
    SKOS는 분류표, 시소러스, 용어집 같은 지식 조직 체계를 RDF로 표현하는 W3C 표준으로, 개념의 대표 이름·동의어·상하위·연관 관계를 가볍게 기술한다.
  sections:
    - heading: "무엇을 표현하나"
      body: >-
        skos:Concept로 개념을 만들고, skos:prefLabel(대표 이름, 언어별로 하나), skos:altLabel(동의어·약어), skos:definition(정의)을 붙인다. 개념 사이에는 skos:broader(더 넓은 개념), skos:narrower(더 좁은 개념),
        skos:related(연관 개념)를 쓴다. 개념들은 skos:ConceptScheme으로 묶는다.
    - heading: "OWL과의 차이"
      body: >-
        SKOS의 broader는 OWL의 subClassOf처럼 엄격한 집합 포함을 뜻하지 않는다. '배터리 안전'이 '열폭주'보다 넓다는 느슨한 관계도 표현할 수 있다. 그래서 논리 추론은 약하지만 만들기 쉽고,
        도서관 분류, 검색 태그, 다국어 용어집에 적합하다. 다른 체계의 개념과는 skos:exactMatch, closeMatch로 연결한다.
    - heading: "언제 쓰나"
      body: >-
        연구실이나 기관의 용어를 정리하고 동의어를 모아 검색을 개선하려 할 때, 완전한 온톨로지보다 SKOS로 시작하는 것이 현실적이다. 나중에 필요한 부분만 OWL 온톨로지로 발전시킬 수 있다.
  formula: |
    ex:SEI a skos:Concept ;
      skos:prefLabel "고체 전해질 계면"@ko , "solid electrolyte interphase"@en ;
      skos:altLabel "SEI"@en ;
      skos:broader ex:ElectrodeInterface .
  example: >-
    연구실 실험 노트 검색에서 'SEI', '고체 전해질 계면', 'solid electrolyte interphase'를 SKOS 동의어로 묶어 두면 어느 이름으로 검색해도 같은 기록이 나온다.
  misconception: >-
    SKOS의 broader를 OWL subClassOf처럼 '모든 A는 B다'로 해석하면 틀린 추론을 하게 된다. SKOS 관계는 의도적으로 느슨하다.
  connection: >-
    LLM 기반 문헌 정보 추출 결과를 SKOS 용어집의 대표 개념으로 정규화하면, 같은 소재가 여러 이름으로 흩어지는 문제를 줄일 수 있다.
  quiz:
    question: "SKOS에서 동의어나 약어를 기록하는 속성은?"
    choices: ["skos:prefLabel", "skos:altLabel", "skos:broader", "owl:sameAs"]
    answer_index: 1
    explanation: "skos:altLabel은 대표 이름 외의 동의어·약어를 기록하며, 대표 이름은 언어별로 하나의 prefLabel을 쓴다."
  keywords:
    - {ko: "단순 지식 조직 체계", en: "Simple Knowledge Organization System"}
    - {ko: "시소러스", en: "thesaurus"}
    - {ko: "대표 레이블", en: "preferred label"}
  next_topics: ["RDFS와 OWL", "온톨로지 정렬(alignment)"]
  references: ["W3C, SKOS Simple Knowledge Organization System Reference, W3C Recommendation, 2009"]

- concept: "SHACL로 데이터 검증하기"
  title: "SHACL: 그래프 데이터의 모양을 검사하는 규칙"
  level: 중급
  one_liner: >-
    SHACL은 RDF 데이터가 갖춰야 할 모양(필수 속성, 개수, 자료형, 값 범위)을 형태(shape)로 정의하고 위반을 보고하는 W3C 표준으로, OWL이 하지 않는 닫힌 세계식 데이터 검증을 맡는다.
  sections:
    - heading: "형태와 대상"
      body: >-
        노드 형태(NodeShape)는 어떤 노드들을 검사할지(대상, 예: 모든 Cell 개체)와 그 노드가 지켜야 할 속성 형태(PropertyShape)들을 정한다. 속성 형태에는 sh:path(속성), sh:minCount·maxCount(개수),
        sh:datatype(자료형), sh:minInclusive(최솟값), sh:in(허용 값 목록), sh:pattern(정규식) 같은 제약을 둔다.
    - heading: "OWL과의 역할 분담"
      body: >-
        OWL은 '셀은 양극을 가진다'에서 양극 기록이 없어도 '어딘가 있겠지'라고 본다(열린 세계). SHACL은 '이 데이터에 양극 기록이 없으면 위반'이라고 본다. 그래서 OWL은 의미와 추론에,
        SHACL은 데이터 입력 품질 검사에 쓴다. 둘은 함께 쓰는 것이 일반적이다.
    - heading: "검증 보고서"
      body: >-
        검증기를 돌리면 어떤 노드가 어떤 제약을 왜 위반했는지 RDF 형식의 보고서가 나온다. 이를 데이터 입력 화면이나 데이터 파이프라인에 연결하면 잘못된 데이터가 저장소에 들어가기 전에 막을 수 있다.
        SHACL 형태 자체가 데이터 형식 문서 역할도 한다.
  formula: |
    ex:CellShape a sh:NodeShape ;
      sh:targetClass ex:Cell ;
      sh:property [ sh:path ex:hasCathode ; sh:minCount 1 ; sh:maxCount 1 ] ;
      sh:property [ sh:path ex:nominalCapacity ; sh:datatype xsd:double ; sh:minExclusive 0 ] .
  example: >-
    사이클 시험 결과를 저장소에 올릴 때 SHACL로 '시험 온도, C-rate, 전압 범위가 반드시 있고 숫자여야 한다'를 검사하면, 조건이 빠진 데이터가 나중에 머신러닝 학습을 망치는 일을 막을 수 있다.
  misconception: >-
    SHACL을 쓰면 추론도 된다고 생각하기 쉽지만, SHACL은 기본적으로 검증 언어다. 일부 규칙 기능(SHACL-AF)이 있지만 OWL 추론을 대신하지는 않는다.
  connection: >-
    머신러닝 데이터 파이프라인의 '스키마 검증' 단계와 같은 역할을 한다. 배터리 데이터를 공유 저장소에 모을 때 SHACL 형태를 공개하면 여러 연구실이 같은 품질 기준으로 데이터를 낼 수 있다.
  quiz:
    question: "'모든 셀 데이터에는 공칭 용량이 반드시 있어야 한다'를 검사하기에 알맞은 것은?"
    choices: ["OWL 존재 제약", "SHACL sh:minCount 1", "SKOS broader", "SPARQL OPTIONAL"]
    answer_index: 1
    explanation: "누락 검사는 닫힌 세계식 검증이 필요하므로 SHACL의 sh:minCount 1로 표현한다."
  keywords:
    - {ko: "형태 제약 언어", en: "Shapes Constraint Language"}
    - {ko: "노드 형태", en: "node shape"}
    - {ko: "검증 보고서", en: "validation report"}
  next_topics: ["추론기(reasoner)와 일관성 검사", "교차검증과 데이터 누수"]
  references: ["W3C, Shapes Constraint Language (SHACL), W3C Recommendation, 2017"]

- concept: "온톨로지 정렬(alignment)"
  title: "온톨로지 정렬: 서로 다른 개념 체계 사이에 다리 놓기"
  level: 심화
  one_liner: >-
    온톨로지 정렬은 서로 다른 온톨로지의 개념·속성 사이에 '같다', '더 넓다', '관련 있다' 같은 대응 관계를 찾아 연결해, 각자 만든 데이터를 함께 쓸 수 있게 하는 작업이다.
  sections:
    - heading: "왜 필요한가"
      body: >-
        같은 분야라도 기관마다 다른 온톨로지를 쓴다. 한쪽은 'Cathode', 다른 쪽은 'PositiveElectrode'라고 부르고 계층 구조도 다르다. 데이터를 통합하려면 이 둘이 같은 개념이라는 대응(매핑)을 만들어야 한다.
        이 대응을 모은 것을 정렬(alignment)이라 하고, 이를 이용해 데이터를 변환하거나 함께 질의한다.
    - heading: "찾는 방법"
      body: >-
        이름과 레이블 문자열 유사도, 동의어 사전, 정의문 임베딩 유사도, 계층 구조의 유사성(부모·자식이 대응하는가), 실제 개체 데이터의 겹침을 함께 쓴다. 최근에는 LLM으로 후보 대응을 제안하고 사람이 검토하는 방식이 늘었다.
        OAEI라는 국제 평가 대회가 정렬 시스템을 비교한다.
    - heading: "조심할 점"
      body: >-
        이름이 같아도 뜻이 다를 수 있다. 예를 들어 '용량'이 한 온톨로지에서는 측정값, 다른 곳에서는 설계 사양을 뜻할 수 있다. 무리하게 '같다(owl:equivalentClass)'로 연결하면 추론 결과가 오염되므로,
        확신이 없으면 skos:closeMatch처럼 약한 관계를 쓴다. 정렬도 출처와 근거를 기록해 관리해야 한다.
  formula: |
    대응 = (e1, e2, 관계, 신뢰도),  관계 ∈ {≡, ⊑, ⊒, related}
    예) (onto1:Cathode, onto2:PositiveElectrode, ≡, 0.95)
  example: >-
    BattINFO의 개념과 다른 기관의 배터리 시험 데이터 스키마 열 이름을 정렬해 두면, 기존 데이터 형식을 바꾸지 않고도 공통 온톨로지로 변환해 함께 분석할 수 있다.
  misconception: >-
    이름 문자열이 같거나 비슷하면 같은 개념이라고 판단하기 쉽지만, 정의와 맥락을 확인하지 않으면 잘못된 대응이 생긴다.
  connection: >-
    정렬 후보를 찾는 일은 임베딩 유사도, 분류 모델, LLM이 쓰이는 전형적인 머신러닝 문제다. 사람 검토를 능동 학습으로 효율화하는 방식도 연구된다.
  quiz:
    question: "확신이 낮은 개념 대응을 표현할 때 더 안전한 선택은?"
    choices: ["owl:equivalentClass", "skos:closeMatch", "owl:sameAs", "rdfs:subClassOf 남발"]
    answer_index: 1
    explanation: "강한 동치 관계는 추론에 큰 영향을 주므로, 불확실하면 skos:closeMatch 같은 약한 관계가 안전하다."
  keywords:
    - {ko: "온톨로지 정렬", en: "ontology alignment"}
    - {ko: "온톨로지 매칭", en: "ontology matching"}
    - {ko: "매핑", en: "mapping"}
  next_topics: ["SKOS와 용어 체계", "임베딩과 의미 공간"]
  references: ["J. Euzenat, P. Shvaiko, Ontology Matching, 2nd ed., Springer, 2013"]

- concept: "배터리 도메인 온톨로지(EMMO, BattINFO)"
  title: "EMMO와 BattINFO: 배터리 데이터를 위한 공통 언어"
  level: 중급
  one_liner: >-
    EMMO는 재료과학과 물리를 위한 상위·중위 온톨로지이고, BattINFO는 그 위에 배터리 구성 요소·전기화학 개념·시험 방법을 정의해 배터리 데이터를 FAIR하게 만드는 도메인 온톨로지다.
  sections:
    - heading: "EMMO"
      body: >-
        Elementary Multiperspective Material Ontology(EMMO)는 유럽 재료 모델링 커뮤니티가 중심이 되어 개발한 온톨로지다. 물질, 과정, 측정, 모델, 표현(기호·수치·단위)을 일관되게 다루기 위해 설계되었다.
        측정된 값이 어떤 대상의 어떤 성질을 어떤 방법으로 잰 것인지를 명시적으로 연결하는 것이 특징이다.
    - heading: "BattINFO"
      body: >-
        Battery Interface Ontology(BattINFO)는 EMMO 기반으로 전극, 전해질, 분리막, 셀 형태, 전기화학 반응과 양, 충방전 시험 같은 개념을 정의한다. 유럽 배터리 연구 이니셔티브(BATTERY 2030+ 등) 맥락에서
        개발되어 공개 저장소에서 관리된다. 셀 사양서나 시험 결과를 JSON-LD로 표현하는 예제와 도구도 함께 제공된다.
    - heading: "쓰는 법과 과제"
      body: >-
        모든 개념을 처음부터 익히기보다, 자기 데이터의 주요 항목(셀 형식, 양극·음극 소재, 공칭 용량, 시험 조건)을 BattINFO 개념 IRI에 연결하는 것부터 시작하는 것이 현실적이다. 온톨로지가 크고 추상적이어서
        배우는 데 시간이 걸리고, 아직 개념이 계속 추가·수정되는 중이라 버전 관리가 필요하다.
  formula: |
    셀 사양(JSON-LD 개념 예):
    { "@type": "CoinCell",
      "hasPositiveElectrode": { "hasActiveMaterial": "NCM811" },
      "hasProperty": { "@type": "NominalCapacity", "value": 3.0, "unit": "mAh" } }
  example: >-
    셀 제조사 사양서의 '공칭 용량 3.0 Ah, 양극 NCM811, 2032 코인셀' 정보를 BattINFO 개념으로 표현해 두면, 다른 연구실의 시험 데이터와 자동으로 연결해 같은 셀 종류끼리 비교할 수 있다.
  misconception: >-
    도메인 온톨로지를 쓰려면 모든 데이터를 한 번에 변환해야 한다고 생각하기 쉽지만, 핵심 메타데이터 몇 개부터 연결해도 검색과 통합의 이점을 얻을 수 있다.
  connection: >-
    서로 다른 연구실의 사이클 데이터를 모아 수명 예측 모델을 학습하려면 시험 조건과 셀 사양의 의미가 맞아야 한다. BattINFO는 이런 '학습 가능한 공동 데이터셋'을 만드는 기반이다.
  quiz:
    question: "BattINFO가 바탕으로 삼는 상위 온톨로지는?"
    choices: ["BFO", "EMMO", "DOLCE", "SKOS"]
    answer_index: 1
    explanation: "BattINFO는 재료·물리용 온톨로지 EMMO 위에 배터리 개념을 정의한 도메인 온톨로지다."
  keywords:
    - {ko: "EMMO", en: "Elementary Multiperspective Material Ontology"}
    - {ko: "BattINFO", en: "Battery Interface Ontology"}
    - {ko: "FAIR 데이터", en: "FAIR data"}
  next_topics: ["상위 온톨로지(BFO 등)", "RDF 트리플과 URI", "사이클 수명 시험과 열화 모드 분리(LLI, LAM)"]
  references: ["S. Clark et al., Toward a unified description of battery data, Advanced Energy Materials, 2022"]

- concept: "지식 그래프 임베딩(TransE 등)"
  title: "지식 그래프 임베딩: 관계를 벡터의 이동으로 배운다"
  level: 심화
  one_liner: >-
    지식 그래프 임베딩은 개체와 관계를 벡터로 바꾸어, 참인 트리플은 점수가 높고 거짓은 낮도록 학습함으로써 그래프에 빠진 관계를 예측하고 머신러닝 입력으로 쓸 수 있게 한다.
  sections:
    - heading: "TransE"
      body: >-
        TransE는 관계를 '이동'으로 본다. (머리, 관계, 꼬리) 트리플이 참이면 머리 벡터에 관계 벡터를 더한 위치가 꼬리 벡터 근처에 있도록 학습한다(h + r ≈ t). 참인 트리플과 머리나 꼬리를 무작위로 바꾼 가짜 트리플 사이에
        여백을 두는 손실로 학습한다. 단순하고 빠르지만 일대다 관계(한 셀이 여러 시험을 가짐)를 잘 표현하지 못한다.
    - heading: "발전된 모델"
      body: >-
        DistMult는 곱셈 기반 점수로 대칭 관계를, ComplEx는 복소수 벡터로 비대칭 관계를, RotatE는 관계를 복소 공간의 회전으로 표현해 대칭·역관계·합성 관계를 함께 다룬다. 그래프 신경망으로 이웃 구조까지 반영하는
        R-GCN 같은 방법도 있다.
    - heading: "쓰임과 한계"
      body: >-
        주된 용도는 링크 예측(아직 기록되지 않은 관계 추천)과, 개체 벡터를 다른 머신러닝 모델의 특징으로 쓰는 것이다. 평가는 정답 꼬리가 후보 중 몇 위인지(MRR, Hits@k)로 한다. 하지만 학습에 쓰지 않은 새 개체는 다루기 어렵고,
        예측은 확률적 추천일 뿐 사실 확인이 필요하다.
  formula: |
    TransE 점수: f(h, r, t) = −‖h + r − t‖
    손실: Σ max(0, γ + ‖h + r − t‖ − ‖h′ + r − t′‖)
  example: >-
    (소재, 효과있음, 첨가제) 관계로 만든 문헌 지식 그래프를 임베딩하면, 아직 함께 시험되지 않은 '소재-첨가제' 조합 중 효과가 있을 가능성이 높은 후보를 순위로 뽑아 실험 우선순위를 정하는 데 참고할 수 있다.
  misconception: >-
    링크 예측 점수가 높으면 그 관계가 사실이라고 보기 쉽지만, 그래프에 있는 패턴과 비슷하다는 뜻일 뿐이다. 특히 문헌 지식 그래프는 출판 편향을 그대로 학습한다.
  connection: >-
    소재·공정·성능을 잇는 배터리 지식 그래프에 임베딩을 적용하면, 그래프 구조를 머신러닝이 쓸 수 있는 벡터로 바꿔 수명 예측이나 소재 추천 모델의 입력으로 쓸 수 있다.
  quiz:
    question: "TransE에서 참인 트리플 (h, r, t)이 만족하도록 학습하는 관계는?"
    choices: ["h · r = t", "h + r ≈ t", "h = r = t", "h − t = 0"]
    answer_index: 1
    explanation: "TransE는 관계를 벡터 이동으로 보아 머리 벡터에 관계 벡터를 더하면 꼬리 벡터 근처가 되도록 학습한다."
  keywords:
    - {ko: "지식 그래프 임베딩", en: "knowledge graph embedding"}
    - {ko: "링크 예측", en: "link prediction"}
    - {ko: "평균 역순위", en: "mean reciprocal rank"}
  next_topics: ["그래프 신경망(GNN)과 분자·결정 구조", "LLM과 지식 그래프의 결합(GraphRAG)"]
  references: ["A. Bordes et al., Translating embeddings for modeling multi-relational data, NeurIPS, 2013", "Z. Sun et al., RotatE: knowledge graph embedding by relational rotation in complex space, ICLR, 2019"]

- concept: "LLM과 지식 그래프의 결합(GraphRAG)"
  title: "LLM × 지식 그래프: 유창함과 정확한 구조를 함께"
  level: 심화
  one_liner: >-
    LLM은 자연어에 강하지만 사실이 불안정하고, 지식 그래프는 구조와 출처가 명확하지만 다루기 어렵다. 둘을 결합하면 LLM이 그래프를 만들고, 그래프가 LLM의 답을 근거 있게 만든다.
  sections:
    - heading: "LLM이 그래프를 돕는다"
      body: >-
        LLM으로 문헌·보고서에서 개체와 관계를 추출해 지식 그래프를 만들고, 개체 이름을 정규화하며, 온톨로지 정렬 후보를 제안한다. 또 사용자의 자연어 질문을 SPARQL·Cypher 질의로 바꿔(text-to-query)
        전문 지식 없이도 그래프를 검색하게 한다. 이때 온톨로지 스키마를 프롬프트에 넣으면 정확도가 오른다.
    - heading: "그래프가 LLM을 돕는다"
      body: >-
        질문과 관련된 개체와 그 이웃 관계를 그래프에서 찾아 프롬프트에 넣으면, LLM이 확인된 사실과 출처를 근거로 답한다. 여러 단계 관계를 따라가야 하는 질문(A를 쓴 셀 중 B 조건에서 시험된 것의 결과)에는
        문서 조각 검색보다 그래프 탐색이 강하다.
    - heading: "GraphRAG"
      body: >-
        GraphRAG는 문서 모음에서 LLM으로 개체·관계 그래프를 만들고, 그래프를 공동체(군집)로 나눠 각 군집의 요약을 미리 만들어 둔 뒤, 질문에 따라 관련 요약과 하위 그래프를 검색해 답하는 방식이다.
        '이 문서들 전체의 주요 주제는?' 같은 전역 질문에 일반 RAG보다 강하다고 보고되었다. 대신 그래프를 만드는 데 LLM 호출 비용이 많이 들고, 추출 오류가 그래프에 쌓일 수 있다.
  formula: |
    답 = LLM(질문, Subgraph(질문), 요약(군집))
    text-to-SPARQL: 질의 = LLM(질문, 온톨로지 스키마)
  example: >-
    연구실의 수년간 실험 보고서로 GraphRAG를 만들면 '고온 수명이 나빴던 실험들에서 공통적으로 나타난 조건은?' 같은 전체를 아우르는 질문에 보고서 여러 개를 연결해 답하게 할 수 있다.
  misconception: >-
    LLM이 만든 그래프는 사람이 만든 지식 그래프만큼 정확하다고 생각하기 쉽지만, 추출 오류와 중복이 많을 수 있다. 중요한 관계는 출처를 남기고 검증해야 한다.
  connection: >-
    배터리 연구에서 온톨로지(BattINFO)로 스키마를 정하고, LLM으로 문헌·실험 기록을 그 스키마에 맞춰 그래프로 만들고, 다시 그 그래프로 LLM 질의응답을 하는 순환 구조가 현실적인 연구 지원 도구로 연구되고 있다.
  quiz:
    question: "GraphRAG가 일반 RAG보다 특히 강하다고 보고된 질문 유형은?"
    choices: ["단어 하나 번역", "문서 모음 전체의 주제를 묻는 전역 질문", "계산 문제", "이미지 분류"]
    answer_index: 1
    explanation: "군집별 요약을 미리 만들어 두므로 여러 문서를 아우르는 전역적 질문에 일반 조각 검색 RAG보다 유리하다."
  keywords:
    - {ko: "그래프 RAG", en: "GraphRAG"}
    - {ko: "질의 생성", en: "text-to-query"}
    - {ko: "정보 추출", en: "information extraction"}
  next_topics: ["RAG(검색 증강 생성)", "지식 그래프", "SPARQL 질의"]
  references: ["D. Edge et al., From local to global: a graph RAG approach to query-focused summarization, arXiv:2404.16130, 2024", "S. Pan et al., Unifying large language models and knowledge graphs: a roadmap, IEEE TKDE, 2024"]
